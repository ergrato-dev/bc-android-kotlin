<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200"
     role="img" aria-labelledby="btitle bdesc">
  <title id="btitle">Bootcamp Android Kotlin</title>
  <desc id="bdesc">Banner: a la izquierda un teléfono con unas llaves de código en degradado; en el centro el título Android Kotlin, el lema nativo y nivel experto y chips de 42 semanas, 588 horas, Kotlin 2.4 y Gradle 9.8; a la derecha el recorrido de Main.kt por ./gradlew build hasta app.aab, con los tests en verde.</desc>
  <style>
    .t    { font-family: Inter, Roboto, "Segoe UI", system-ui, sans-serif; }
    .box  { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .edge { stroke: #484f58; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f52ff"/>
      <stop offset="0.55" stop-color="#c757bc"/>
      <stop offset="1" stop-color="#e44857"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#484f58"/>
    </marker>
    <clipPath id="clip"><rect width="800" height="200" rx="12"/></clipPath>
  </defs>

  <rect width="800" height="200" rx="12" fill="#0d1117"/>

  <!-- Rejilla sutil -->
  <g clip-path="url(#clip)" stroke="#161b22" stroke-width="1">
    <path d="M0 40H800M0 80H800M0 120H800M0 160H800"/>
    <path d="M40 0V200M80 0V200M120 0V200M160 0V200M200 0V200M240 0V200M280 0V200M320 0V200M360 0V200M400 0V200M440 0V200M480 0V200M520 0V200M560 0V200M600 0V200M640 0V200M680 0V200M720 0V200M760 0V200"/>
  </g>

  <!-- Teléfono con triángulo -->
  <g transform="translate(38 28)">
    <rect x="0" y="0" width="84" height="144" rx="16" fill="#161b22" stroke="#58a6ff" stroke-width="2.5"/>
    <rect x="30" y="8" width="24" height="4" rx="2" fill="#30363d"/>
    <text x="42" y="82" font-family="Inter, Roboto, 'Segoe UI', system-ui, sans-serif" font-size="46" font-weight="700" text-anchor="middle" fill="url(#grad)">{ }</text>
    <rect x="30" y="126" width="24" height="4" rx="2" fill="#30363d"/>
  </g>

  <!-- Título -->
  <g class="t">
    <text x="150" y="82" font-size="38" font-weight="700" fill="#e6edf3">Android Kotlin</text>
    <text x="152" y="108" font-size="15" fill="#9aa4af">Nativo · nivel experto · Gradle incluido</text>
  </g>

  <!-- Chips -->
  <g class="t" font-size="12" text-anchor="middle">
    <rect class="box" x="150" y="130" width="92" height="26" rx="13"/><text x="196" y="147" fill="#e6edf3">42 semanas</text>
    <rect class="box" x="250" y="130" width="72" height="26" rx="13"/><text x="286" y="147" fill="#e6edf3">588 h</text>
    <rect class="box" x="330" y="130" width="96" height="26" rx="13"/><text x="378" y="147" fill="#e6edf3">Kotlin 2.4</text>
    <rect class="box" x="434" y="130" width="96" height="26" rx="13"/><text x="482" y="147" fill="#e6edf3">Gradle 9.8</text>
  </g>

  <!-- Pipeline -->
  <g class="t" font-size="12" text-anchor="middle">
    <rect class="box" x="574" y="30" width="90" height="30" rx="8"/><text x="619" y="49" fill="#e6edf3">Main.kt</text>
    <path class="edge" d="M619 60 V84" marker-end="url(#arr)"/>
    <rect class="box" x="554" y="86" width="130" height="30" rx="8" stroke="#58a6ff"/><text x="619" y="105" fill="#e6edf3">./gradlew build</text>
    <path class="edge" d="M619 116 V140" marker-end="url(#arr)"/>
    <rect class="box" x="574" y="142" width="90" height="30" rx="8"/><text x="619" y="161" fill="#e6edf3">app.aab</text>
    <g transform="translate(704 100)">
      <circle r="13" fill="#0f2d1a" stroke="#3fb950" stroke-width="2"/>
      <path d="M-6 0 L-2 5 L7 -5" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="704" y="132" fill="#9aa4af" font-size="11">tests</text>
  </g>
</svg>
