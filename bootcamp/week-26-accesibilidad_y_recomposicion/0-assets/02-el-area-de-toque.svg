<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">El área de toque</title><desc id="d">Dos botones dibujados de 24 dp, juntos. Compose agranda el área de toque de cada uno hasta 48 dp, pero no les hace sitio: las dos áreas se pisan, y un dedo entre los dos no sabe cuál pulsa. Con minimumInteractiveComponentSize antes del size, cada botón ocupa 48 dp en la fila, se dibuja de 24 en el centro, y las áreas quedan una junto a la otra.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<text x="30" y="34">Sin sitio: size(24.dp).clickable</text><text x="400" y="34">minimumInteractiveComponentSize().size(24.dp)</text>
<rect class="r" x="40" y="70" width="96" height="96" rx="4" fill-opacity="0.4"/><rect class="r" x="88" y="70" width="96" height="96" rx="4" fill-opacity="0.4"/>
<rect class="b" x="64" y="94" width="48" height="48" rx="4"/><rect class="b" x="112" y="94" width="48" height="48" rx="4"/>
<text class="s" x="40" y="190">24 dp dibujados, 48 de toque:</text><text class="s" x="40" y="208">de -12 a 36 y de 12 a 60, se pisan</text>
<rect class="g" x="420" y="70" width="96" height="96" rx="4" fill-opacity="0.4"/><rect class="g" x="516" y="70" width="96" height="96" rx="4" fill-opacity="0.4"/>
<rect class="b" x="444" y="94" width="48" height="48" rx="4"/><rect class="b" x="540" y="94" width="48" height="48" rx="4"/>
<text class="s" x="420" y="190">48 dp reservados en la fila,</text><text class="s" x="420" y="208">24 dibujados en el centro: no se pisan</text>
<text class="s" x="30" y="260">assertTouchWidthIsAtLeast(48.dp) pasa en los dos casos: lo que se comprueba es que las áreas no se pisen.</text></svg>
