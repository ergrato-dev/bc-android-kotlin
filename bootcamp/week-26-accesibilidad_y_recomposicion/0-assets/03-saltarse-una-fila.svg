<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 320" role="img" aria-labelledby="t d"><title id="t">Saltarse una fila</title><desc id="d">Una tecla cambia el borrador en el SavedStateHandle. combine vuelve a calcular el estado. Si decode se ejecuta dentro de combine, saca observaciones nuevas, iguales a las de antes. Compose compara cada parámetro de ObservationRow: si el tipo es inestable, con igualdad de instancia, y la fila se recompone; si es estable, con equals, y se la salta. Con decode en un map antes de combine, la lista es la misma y también se la salta.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="30" y="40" width="150" height="50" rx="8"/><text x="46" y="70">tecla: draft</text>
<path class="l" d="M180 65H220" marker-end="url(#a)"/>
<rect class="b" x="230" y="40" width="200" height="50" rx="8"/><text x="246" y="62">combine { ... }</text><text class="s" x="246" y="80">nuevo BitacoraUiState</text>
<path class="l" d="M330 90V120" marker-end="url(#a)"/>
<rect class="r" x="90" y="130" width="230" height="60" rx="8"/><text x="106" y="155">decode dentro de combine</text><text class="s" x="106" y="175">observaciones nuevas, iguales</text>
<rect class="g" x="350" y="130" width="250" height="60" rx="8"/><text x="366" y="155">decode en un map, antes</text><text class="s" x="366" y="175">la misma lista</text>
<path class="l" d="M205 190V220" marker-end="url(#a)"/>
<rect class="f" x="30" y="230" width="350" height="70" rx="8"/><text x="46" y="255">ObservationRow(observation, ...)</text><text class="s" x="46" y="275">inestable: === (otra instancia) se recompone</text><text class="s" x="46" y="292">estable: equals (igual) se salta</text>
<path class="l" d="M475 190V230" marker-end="url(#a)"/>
<rect class="g" x="400" y="240" width="200" height="50" rx="8"/><text x="416" y="270">se salta: 0 filas</text></svg>
