<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">El árbol de semántica</title><desc id="d">Una fila de la Bitácora es un Row clickable con tres hijos: la insignia con el texto A, la línea y las coordenadas. El clickable une a sus hijos: en el árbol unido es un solo nodo, una parada de TalkBack, con los tres textos. Con clearAndSetSemantics en la insignia, el nodo unido solo lleva la línea y las coordenadas, y TalkBack ya no empieza por A. El árbol sin unir sigue teniendo un nodo por composable.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<text x="30" y="34">Composables</text><text x="280" y="34">Árbol unido (TalkBack)</text><text x="540" y="34">Lo que se lee</text>
<rect class="b" x="30" y="50" width="200" height="40" rx="6"/><text x="44" y="75">Row(clickable)</text>
<rect class="f" x="50" y="100" width="180" height="30" rx="6"/><text x="62" y="120">LevelBadge: "A"</text>
<rect class="b" x="50" y="140" width="180" height="30" rx="6"/><text x="62" y="160">"A-1 · Alta · riego..."</text>
<rect class="b" x="50" y="180" width="180" height="30" rx="6"/><text x="62" y="200">"-34.6037, -58.3816"</text>
<path class="l" d="M240 130H270" marker-end="url(#a)"/>
<rect class="r" x="280" y="90" width="230" height="80" rx="8"/><text x="294" y="115">un nodo, una parada</text><text class="s" x="294" y="137">Text = [A, A-1 · Alta..., -34.6...]</text><text class="s" x="294" y="155">acciones: clic, Borrar</text>
<path class="l" d="M520 130H530" marker-end="url(#a)"/><text x="540" y="135">"A, A-1 · Alta · riego..."</text>
<rect class="g" x="280" y="220" width="230" height="70" rx="8"/><text x="294" y="245">con clearAndSetSemantics {}</text><text class="s" x="294" y="267">en la insignia: Text = [A-1 · Alta..., -34.6...]</text>
<path class="l" d="M520 255H530" marker-end="url(#a)"/><text x="540" y="260">"A-1 · Alta · riego..."</text>
<text class="s" x="30" y="250">useUnmergedTree = true:</text><text class="s" x="30" y="268">un nodo por composable;</text><text class="s" x="30" y="286">la "A" sigue ahí</text></svg>
