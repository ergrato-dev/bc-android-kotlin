<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Qué recompila un cambio en core</title><desc id="d">Si cambias el cuerpo de una función de core sin cambiar su firma pública, solo se recompila core; data y app quedan UP-TO-DATE. Si añades o cambias una función pública, cambia la interfaz de core y se recompilan también data y app.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<text x="20" y="34">Cambio en core</text>
<rect class="g" x="20" y="55" width="330" height="215" rx="8"/><text x="36" y="84">El cuerpo de una función</text><text class="s" x="36" y="106">la firma pública no cambia</text>
<rect class="f" x="36" y="125" width="96" height="50" rx="6"/><text x="44" y="148">core</text><text class="s" x="44" y="166">recompila</text>
<rect class="g" x="140" y="125" width="96" height="50" rx="6"/><text x="148" y="148">data</text><text class="s" x="148" y="166">UP-TO-DATE</text>
<rect class="g" x="244" y="125" width="96" height="50" rx="6"/><text x="252" y="148">app</text><text class="s" x="252" y="166">UP-TO-DATE</text>
<text class="s" x="36" y="212">Gradle compara la interfaz de core,</text><text class="s" x="36" y="232">no su código: los demás no se enteran</text>
<rect class="r" x="410" y="55" width="330" height="215" rx="8"/><text x="426" y="84">Una función pública nueva</text><text class="s" x="426" y="106">la interfaz de core cambia</text>
<rect class="f" x="426" y="125" width="96" height="50" rx="6"/><text x="434" y="148">core</text><text class="s" x="434" y="166">recompila</text>
<rect class="f" x="530" y="125" width="96" height="50" rx="6"/><text x="538" y="148">data</text><text class="s" x="538" y="166">recompila</text>
<rect class="f" x="634" y="125" width="96" height="50" rx="6"/><text x="642" y="148">app</text><text class="s" x="642" y="166">recompila</text>
<text class="s" x="426" y="212">Una API pequeña y estable en core</text><text class="s" x="426" y="232">protege a los módulos que dependen de él</text></svg>
