<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 320" role="img" aria-labelledby="t d"><title id="t">Módulos de la Bitácora y sus dependencias</title><desc id="d">El módulo app depende de data con implementation. Data depende de core con api, así que app también ve los tipos de core. Data usa kotlinx-serialization con implementation, un detalle interno que app no ve al compilar. Core no depende de nadie. Una flecha de core hacia data formaría un ciclo y Gradle lo rechaza.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="20" y="30" width="170" height="80" rx="8"/><text x="35" y="58">:app</text><text class="s" x="35" y="80">application, MainKt</text><text class="s" x="35" y="98">el programa</text>
<rect class="b" x="285" y="30" width="190" height="80" rx="8"/><text x="300" y="58">:data</text><text class="s" x="300" y="80">guarda y lee el archivo</text><text class="s" x="300" y="98">java-library + serialization</text>
<rect class="g" x="540" y="30" width="190" height="80" rx="8"/><text x="555" y="58">:core</text><text class="s" x="555" y="80">modelo, reglas, informes</text><text class="s" x="555" y="98">no depende de nadie</text>
<path class="l" d="M190 70H283" marker-end="url(#a)"/><text class="s" x="196" y="60">implementation</text>
<path class="l" d="M475 70H538" marker-end="url(#a)"/><text class="s" x="505" y="60">api</text>
<path class="l" d="M105 110C105 190 600 190 635 112" marker-end="url(#a)" stroke-dasharray="6 5"/><text class="s" x="40" y="214">app ve core: lo hereda por el api de data</text>
<rect class="f" x="285" y="235" width="190" height="55" rx="8"/><text x="300" y="259">kotlinx-serialization</text><text class="s" x="300" y="278">implementation: interno</text>
<path class="l" d="M380 112V233" marker-end="url(#a)"/>
<rect class="r" x="540" y="235" width="190" height="55" rx="8"/><text x="555" y="259">core → data: ciclo</text><text class="s" x="555" y="278">Circular dependency</text></svg>
