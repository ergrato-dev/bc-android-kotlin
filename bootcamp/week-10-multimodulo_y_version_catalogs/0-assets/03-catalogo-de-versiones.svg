<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">Del catálogo a los módulos</title><desc id="d">El archivo gradle/libs.versions.toml tiene cuatro secciones: versions, libraries, bundles y plugins. Gradle genera de ahí los accesos libs.nombre que usan los build.gradle.kts de todos los módulos, así cada versión se escribe una sola vez.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="15" y="20" width="330" height="290" rx="8"/><text x="30" y="46">gradle/libs.versions.toml</text>
<text class="s" x="30" y="76">[versions]</text><text class="s" x="45" y="96">serialization = "1.12.0"</text>
<text class="s" x="30" y="126">[libraries]</text><text class="s" x="45" y="146">serialization-json = { module = ... }</text><text class="s" x="45" y="166">junit-bom = { ..., version.ref = "junit" }</text>
<text class="s" x="30" y="196">[bundles]</text><text class="s" x="45" y="216">testing = [kotlin-test, junit-launcher]</text>
<text class="s" x="30" y="246">[plugins]</text><text class="s" x="45" y="266">kotlin-jvm = { id = ..., version.ref }</text>
<path class="l" d="M345 165H410" marker-end="url(#a)"/><text class="s" x="352" y="152">genera</text>
<rect class="g" x="415" y="20" width="330" height="290" rx="8"/><text x="430" y="46">En cada build.gradle.kts</text>
<text class="s" x="430" y="82">libs.serialization.json</text><text class="s" x="430" y="104">platform(libs.junit.bom)</text><text class="s" x="430" y="126">libs.bundles.testing</text><text class="s" x="430" y="148">alias(libs.plugins.kotlin.jvm)</text>
<text class="s" x="430" y="190">un nombre mal escrito no compila:</text><text class="s" x="430" y="212">Unresolved reference 'bomm'</text>
<text class="s" x="430" y="262">cambiar una versión = tocar</text><text class="s" x="430" y="284">una sola línea</text></svg>
