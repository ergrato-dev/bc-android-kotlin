<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">El ciclo de una captura con Roborazzi</title><desc id="d">Cuatro pasos. Uno: recordRoborazziFieldDebug graba la captura en app/src/test/screenshots. Dos: la referencia entra en el repositorio y en el pull request. Tres: cada ./gradlew test, con roborazzi.test.verify=true, compara; si coincide, verde. Si no, falla con is changed y deja _actual y _compare en build/outputs/roborazzi. Cuatro: ante una diferencia, o se arregla la app (es un fallo) o se regraba a propósito y la imagen nueva va al pull request (es un cambio querido).</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.h{font-weight:bold}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="30" y="40" width="160" height="90" rx="8"/><text x="110" y="68" text-anchor="middle" class="h">1 · Grabar</text><text x="110" y="92" text-anchor="middle" class="s">recordRoborazzi</text><text x="110" y="110" text-anchor="middle" class="s">FieldDebug</text>
<line class="l" x1="190" y1="85" x2="218" y2="85" marker-end="url(#a)"/>
<rect class="b" x="222" y="40" width="160" height="90" rx="8"/><text x="302" y="68" text-anchor="middle" class="h">2 · Repositorio</text><text x="302" y="92" text-anchor="middle" class="s">src/test/screenshots</text><text x="302" y="110" text-anchor="middle" class="s">revisada en el PR</text>
<line class="l" x1="382" y1="85" x2="410" y2="85" marker-end="url(#a)"/>
<rect class="g" x="414" y="40" width="160" height="90" rx="8"/><text x="494" y="68" text-anchor="middle" class="h">3 · Cada test</text><text x="494" y="92" text-anchor="middle" class="s">roborazzi.test.verify</text><text x="494" y="110" text-anchor="middle" class="s">coincide: verde</text>
<line class="l" x1="574" y1="85" x2="602" y2="85" marker-end="url(#a)"/>
<rect class="r" x="606" y="40" width="124" height="90" rx="8"/><text x="668" y="68" text-anchor="middle" class="h">No coincide</text><text x="668" y="92" text-anchor="middle" class="s">"is changed"</text><text x="668" y="110" text-anchor="middle" class="s">_actual · _compare</text>
<line class="l" x1="668" y1="130" x2="668" y2="170"/><line class="l" x1="668" y1="170" x2="520" y2="170"/>
<rect class="f" x="30" y="190" width="330" height="110" rx="8"/><text x="46" y="216" class="h">Es un fallo</text><text x="46" y="242">Se arregla la app.</text><text x="46" y="266">La referencia no se toca.</text><text x="46" y="288" class="s">Bitácora: «Media» partida en dos líneas</text>
<rect class="f" x="400" y="190" width="330" height="110" rx="8"/><text x="416" y="216" class="h">Es un cambio querido</text><text x="416" y="242">Se regraba (paso 1), mirando _compare.</text><text x="416" y="266">La imagen nueva va al pull request.</text><text x="416" y="288" class="s">Nunca: regrabar para que pase sin mirar</text>
<line class="l" x1="520" y1="170" x2="200" y2="170"/><line class="l" x1="200" y1="170" x2="200" y2="186" marker-end="url(#a)"/><line class="l" x1="560" y1="170" x2="560" y2="186" marker-end="url(#a)"/>
</svg>
