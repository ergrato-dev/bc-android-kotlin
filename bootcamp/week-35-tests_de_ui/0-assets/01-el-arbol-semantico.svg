<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 360" role="img" aria-labelledby="t d"><title id="t">El árbol semántico de una fila</title><desc id="d">A la izquierda, el árbol unido de una fila de la Bitácora: un solo nodo clickable con el texto A-1 · Alta · riego y la acción Borrar; es lo que buscan los finders por defecto y lo que lee TalkBack. A la derecha, el árbol sin unir: el nodo de la fila con hijos, la insignia vaciada con clearAndSetSemantics, el Text de la línea y el Text del lugar. Abajo, la lista con testTag observations tiene dos hijos por fila: el fondo de Borrar y el Surface.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.h{font-weight:bold}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<text x="190" y="34" text-anchor="middle" class="h">Árbol unido (por defecto)</text>
<rect class="g" x="40" y="54" width="300" height="110" rx="8"/><text x="56" y="80" class="h">Fila · clickable</text><text x="56" y="104">Text = "A-1 · Alta · riego"</text><text x="56" y="126">Actions = [OnClick, Borrar]</text><text x="56" y="150" class="s">lo que busca onNodeWithText y lee TalkBack</text>
<text x="570" y="34" text-anchor="middle" class="h">Árbol sin unir (useUnmergedTree = true)</text>
<rect class="b" x="420" y="54" width="300" height="44" rx="8"/><text x="436" y="81">Fila · clickable</text>
<line class="l" x1="470" y1="98" x2="470" y2="200"/>
<line class="l" x1="470" y1="124" x2="500" y2="124" marker-end="url(#a)"/><rect class="f" x="504" y="108" width="216" height="32" rx="6"/><text x="516" y="129">Insignia · sin semántica</text>
<line class="l" x1="470" y1="162" x2="500" y2="162" marker-end="url(#a)"/><rect class="b" x="504" y="146" width="216" height="32" rx="6"/><text x="516" y="167">Text "A-1 · Alta · riego"</text>
<line class="l" x1="470" y1="200" x2="500" y2="200" marker-end="url(#a)"/><rect class="b" x="504" y="184" width="216" height="32" rx="6"/><text x="516" y="205">Text con el lugar</text>
<rect class="r" x="40" y="240" width="680" height="96" rx="8"/><text x="56" y="266" class="h">LazyColumn · testTag = "observations"</text>
<text x="56" y="292">Con 2 filas, onChildren() da 4 nodos: por cada fila, el fondo de "Borrar" y el Surface.</text>
<text x="56" y="316" class="s">Para contar filas: onAllNodes(hasAnyAncestor(hasTestTag("observations")) and hasClickAction())</text>
</svg>
