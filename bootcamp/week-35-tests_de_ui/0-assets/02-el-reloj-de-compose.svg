<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">El reloj de Compose en un test</title><desc id="d">Línea de tiempo del reloj de Compose con autoAdvance en false. En 0 ms, performTextInput cambia el estado. En 16 ms, advanceTimeByFrame recompone y lanza el LaunchedEffect con delay de 1000. En 1015 ms todavía no se ha guardado. En 1016 ms se guarda. El texto Guardado aparece en el fotograma siguiente. Debajo: advanceTimeBy de 999 sin ignoreFrameDuration avanza hasta 1008, redondeado a fotogramas de 16 ms. Abajo, en rojo: lo que corre en Dispatchers.IO no está en este reloj; waitForIdle no lo espera, waitUntil sí.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.h{font-weight:bold}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<line class="l" x1="40" y1="120" x2="730" y2="120" marker-end="url(#a)"/><text x="736" y="125" class="s">ms</text>
<circle cx="60" cy="120" r="7" fill="#9aa4af"/><text x="60" y="150" text-anchor="middle" class="s">0</text><text x="60" y="70" text-anchor="middle">tecla</text><text x="60" y="92" text-anchor="middle" class="s">cambia el estado</text>
<circle cx="130" cy="120" r="7" fill="#58a6ff"/><text x="130" y="150" text-anchor="middle" class="s">16</text><text x="210" y="70" text-anchor="middle">advanceTimeByFrame</text><text x="210" y="92" text-anchor="middle" class="s">recompone y lanza el efecto</text>
<line x1="130" y1="120" x2="560" y2="120" stroke="#58a6ff" stroke-width="5"/><text x="345" y="112" text-anchor="middle" class="s">delay(1000)</text>
<circle cx="540" cy="120" r="7" fill="#f85149"/><text x="532" y="150" text-anchor="end" class="s">1015 ✗</text>
<circle cx="560" cy="120" r="7" fill="#3fb950"/><text x="568" y="150" class="s">1016 ✓ onSave</text><text x="560" y="70" text-anchor="middle">guarda</text>
<circle cx="640" cy="120" r="7" fill="#3fb950"/><text x="650" y="92" text-anchor="middle" class="s">+1 fotograma:</text><text x="650" y="70" text-anchor="middle">"Guardado"</text>
<rect class="f" x="40" y="180" width="680" height="54" rx="8"/><text x="56" y="204">advanceTimeBy(999) sin ignoreFrameDuration = 1008 ms: redondea a fotogramas de 16 ms.</text><text x="56" y="224" class="s">Para un límite exacto: advanceTimeBy(999, ignoreFrameDuration = true)</text>
<rect class="r" x="40" y="250" width="680" height="54" rx="8"/><text x="56" y="274">Dispatchers.IO no está en este reloj: waitForIdle vuelve sin esperarlo.</text><text x="56" y="294" class="s">waitUntil { condición } repite waitForIdle hasta que se cumple, con un límite de tiempo real</text>
</svg>
