<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Las tres fases de un build</title><desc id="d">Un build de Gradle pasa por inicialización, que lee settings.gradle.kts; configuración, que ejecuta build.gradle.kts y registra las tareas; y ejecución, que corre solo las tareas pedidas y sus dependencias. Con la caché de configuración, la segunda fase se salta si nada cambió.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="15" y="20" width="220" height="190" rx="8"/><text x="30" y="48">1 · Inicialización</text><text class="s" x="30" y="76">lee settings.gradle.kts</text><text class="s" x="30" y="98">decide qué proyectos hay</text><text class="s" x="30" y="120">rootProject.name</text><text class="s" x="30" y="158">se ejecuta SIEMPRE</text>
<rect class="f" x="270" y="20" width="220" height="190" rx="8"/><text x="285" y="48">2 · Configuración</text><text class="s" x="285" y="76">ejecuta build.gradle.kts</text><text class="s" x="285" y="98">registra las tareas y</text><text class="s" x="285" y="120">arma el grafo de tareas</text><text class="s" x="285" y="158">no hace el trabajo</text><text class="s" x="285" y="180">println aquí sale SIEMPRE</text>
<rect class="g" x="525" y="20" width="220" height="190" rx="8"/><text x="540" y="48">3 · Ejecución</text><text class="s" x="540" y="76">solo las tareas pedidas</text><text class="s" x="540" y="98">y sus dependencias</text><text class="s" x="540" y="120">doFirst / doLast / @TaskAction</text><text class="s" x="540" y="158">UP-TO-DATE, FROM-CACHE,</text><text class="s" x="540" y="180">SKIPPED o ejecutada</text>
<path class="l" d="M235 115H268" marker-end="url(#a)"/><path class="l" d="M490 115H523" marker-end="url(#a)"/>
<rect class="r" x="15" y="235" width="730" height="50" rx="8"/><text x="30" y="258">Caché de configuración: si nada cambió, la fase 2 se salta y Gradle repite el grafo guardado</text><text class="s" x="30" y="276">"Reusing configuration cache" · por eso en la fase 3 no puedes usar project ni nada de la fase 2</text></svg>
