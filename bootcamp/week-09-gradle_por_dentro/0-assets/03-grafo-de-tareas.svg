<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Grafo de tareas de la Bitácora</title><desc id="d">La tarea release depende de bundle. Bundle toma sus archivos de stage, así que stage se ejecuta antes sin que nadie lo declare: es una dependencia implícita. Bundle tiene como finalizadora a announce, que corre justo después. Reset no pertenece al grafo de release.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="g" x="15" y="30" width="150" height="60" rx="8"/><text x="30" y="56">stage</text><text class="s" x="30" y="76">Copy: data/*.csv</text>
<rect class="b" x="215" y="30" width="150" height="60" rx="8"/><text x="230" y="56">bundle</text><text class="s" x="230" y="76">Zip: build/dist</text>
<rect class="f" x="415" y="30" width="150" height="60" rx="8"/><text x="430" y="56">announce</text><text class="s" x="430" y="76">imprime el nombre</text>
<rect class="b" x="215" y="150" width="150" height="60" rx="8"/><text x="230" y="176">release</text><text class="s" x="230" y="196">ciclo de vida</text>
<rect class="r" x="515" y="150" width="150" height="60" rx="8"/><text x="530" y="176">reset</text><text class="s" x="530" y="196">Delete: build/</text>
<path class="l" d="M165 60H213" marker-end="url(#a)"/><text class="s" x="22" y="112">from(stage): implícita</text>
<path class="l" d="M365 60H413" marker-end="url(#a)"/><text class="s" x="372" y="112">finalizedBy</text>
<path class="l" d="M290 150V92" marker-end="url(#a)"/><text class="s" x="300" y="128">dependsOn</text>
<text class="s" x="15" y="250">Orden al pedir release: stage, bundle, announce, release. Con -Pquiet, announce se marca SKIPPED.</text>
<text class="s" x="15" y="272">Con --dry-run se ve el orden sin ejecutar nada.</text></svg>
