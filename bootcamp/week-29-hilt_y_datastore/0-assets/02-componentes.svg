<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 320" role="img" aria-labelledby="t d"><title id="t">Los componentes de Hilt</title><desc id="d">De arriba abajo, cada componente es hijo del anterior y ve lo de sus padres. SingletonComponent, con @Singleton, vive con el proceso. ActivityRetainedComponent, con @ActivityRetainedScoped, sobrevive al giro. ViewModelComponent, con @ViewModelScoped, vive con el ViewModel y trae el SavedStateHandle. ActivityComponent, con @ActivityScoped, muere en cada onDestroy, también al girar. A la derecha, una línea de tiempo: al girar, la actividad se destruye y se crea otra, pero el ViewModel y la app siguen.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}.c{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 4}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="g" x="20" y="20" width="400" height="56" rx="8"/><text x="36" y="44">SingletonComponent · @Singleton</text><text class="s" x="36" y="64">Application.onCreate hasta que muere el proceso</text>
<rect class="b" x="50" y="96" width="370" height="56" rx="8"/><text x="66" y="120">ActivityRetainedComponent</text><text class="s" x="66" y="140">@ActivityRetainedScoped · sobrevive al giro</text>
<rect class="b" x="80" y="172" width="340" height="56" rx="8"/><text x="96" y="196">ViewModelComponent · @ViewModelScoped</text><text class="s" x="96" y="216">con el ViewModel · trae SavedStateHandle</text>
<rect class="r" x="80" y="248" width="340" height="56" rx="8"/><text x="96" y="272">ActivityComponent · @ActivityScoped</text><text class="s" x="96" y="292">onCreate hasta onDestroy, también al girar</text>
<text class="s" x="470" y="40">la app</text><path stroke="#3fb950" stroke-width="6" d="M470 52H740"/>
<text class="s" x="470" y="120">retained y ViewModel</text><path stroke="#58a6ff" stroke-width="6" d="M500 132H740"/>
<text class="s" x="470" y="250">la actividad</text><path stroke="#f85149" stroke-width="6" d="M500 262H600M630 262H740"/>
<path class="l" d="M615 140V250" stroke-dasharray="4 4"/><text class="s" x="580" y="295">girar el móvil</text>
</svg>
