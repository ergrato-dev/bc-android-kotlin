<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 290" role="img" aria-labelledby="t d"><title id="t">Qué test usa qué</title><desc id="d">Tres columnas. En la JVM y sin Hilt: el reducer, visible() y el ViewModel con FakeRepository y FakeSettings por el constructor, y DataStoreSettingsRepository en data con TempDir y runTest; son los más rápidos. Con Robolectric y la app de verdad: MainActivityTest o PreferencesTest abren la actividad con BitacoraApp, AppModule y DataStore en un archivo. Con Robolectric y Hilt de test: HiltTest lleva @HiltAndroidTest, HiltTestApplication y HiltAndroidRule, y FakeModule sustituye a AppModule con @TestInstallIn.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}.c{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 4}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="g" x="20" y="20" width="230" height="250" rx="8"/><text x="36" y="46">JVM, sin Hilt</text><text class="s" x="36" y="80">reduce y visible()</text><text class="s" x="36" y="104">BitacoraViewModel(handle,</text><text class="s" x="36" y="122">  FakeRepository, FakeSettings)</text><text class="s" x="36" y="156">DataStoreSettingsRepository</text><text class="s" x="36" y="174">  @TempDir + runTest</text><text class="s" x="36" y="246">milisegundos</text>
<rect class="f" x="265" y="20" width="230" height="250" rx="8"/><text x="281" y="46">Robolectric, la app</text><text class="s" x="281" y="80">MainActivityTest</text><text class="s" x="281" y="104">PreferencesTest</text><text class="s" x="281" y="138">BitacoraApp (@HiltAndroidApp)</text><text class="s" x="281" y="156">AppModule de verdad</text><text class="s" x="281" y="174">DataStore en filesDir</text><text class="s" x="281" y="246">segundos</text>
<rect class="b" x="510" y="20" width="230" height="250" rx="8"/><text x="526" y="46">Robolectric, Hilt de test</text><text class="s" x="526" y="80">HiltTest · @HiltAndroidTest</text><text class="s" x="526" y="104">HiltTestApplication</text><text class="s" x="526" y="122">HiltAndroidRule(order = 0)</text><text class="s" x="526" y="156">FakeModule @TestInstallIn</text><text class="s" x="526" y="174">  replaces = [AppModule]</text><text class="s" x="526" y="198">@Inject en el test</text><text class="s" x="526" y="246">segundos, más build</text>
</svg>
