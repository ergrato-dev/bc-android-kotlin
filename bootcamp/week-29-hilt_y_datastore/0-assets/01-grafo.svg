<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">El grafo de la Bitácora</title><desc id="d">AppModule, instalado en SingletonComponent, da con @Provides y @Singleton el ObservationRepository y el SettingsRepository, los dos a partir del ApplicationContext. ViewModelComponent da el SavedStateHandle. Con los tres, Hilt crea el BitacoraViewModel, marcado con @HiltViewModel e @Inject constructor, y se lo entrega a MainActivity, marcada con @AndroidEntryPoint, por viewModels(). BitacoraApp, con @HiltAndroidApp, arranca el grafo.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}.c{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 4}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="c" x="20" y="20" width="460" height="290" rx="10"/><text class="s" x="36" y="42">SingletonComponent · lo arranca BitacoraApp (@HiltAndroidApp)</text>
<rect class="f" x="40" y="60" width="200" height="56" rx="8"/><text x="56" y="84">@ApplicationContext</text><text class="s" x="56" y="104">ya está en el grafo</text>
<rect class="f" x="40" y="150" width="200" height="140" rx="8"/><text x="56" y="176">AppModule</text><text class="s" x="56" y="198">@Provides @Singleton</text><text class="s" x="56" y="222">observations()</text><text class="s" x="56" y="244">settings()</text><text class="s" x="56" y="270">en los tests: FakeModule</text>
<rect class="g" x="280" y="150" width="180" height="56" rx="8"/><text x="292" y="174">ObservationRepository</text><text class="s" x="292" y="194">uno para toda la app</text>
<rect class="g" x="280" y="234" width="180" height="56" rx="8"/><text x="292" y="258">SettingsRepository</text><text class="s" x="292" y="278">uno: un DataStore</text>
<rect class="c" x="500" y="20" width="240" height="160" rx="10"/><text class="s" x="514" y="42">ViewModelComponent</text>
<rect class="f" x="520" y="56" width="200" height="40" rx="8"/><text x="536" y="81">SavedStateHandle</text>
<rect class="b" x="520" y="116" width="200" height="50" rx="8"/><text x="536" y="138">BitacoraViewModel</text><text class="s" x="536" y="157">@HiltViewModel</text>
<rect class="b" x="520" y="230" width="200" height="60" rx="8"/><text x="536" y="254">MainActivity</text><text class="s" x="536" y="276">@AndroidEntryPoint</text>
<path class="l" d="M140 116V150" marker-end="url(#a)"/><path class="l" d="M240 178H280" marker-end="url(#a)"/><path class="l" d="M240 262H280" marker-end="url(#a)"/>
<path class="l" d="M460 178C490 178 490 150 520 146" marker-end="url(#a)"/><path class="l" d="M460 262C500 262 490 160 520 156" marker-end="url(#a)"/><path class="l" d="M620 96V116" marker-end="url(#a)"/><path class="l" d="M620 166V230" marker-end="url(#a)"/><text class="s" x="628" y="204">viewModels()</text>
</svg>
