<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Tres formas de mandar un efecto</title><desc id="d">Un efecto se manda mientras nadie escucha, por ejemplo al girar el móvil, y después la pantalla nueva empieza a recoger. Con un Channel con buffer, el efecto espera y llega una vez. Con un SharedFlow sin replay, se tira y no llega. Con un StateFlow, llega, pero se queda y se vuelve a ver la próxima vez que alguien se suscriba; y dos iguales seguidos son uno.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<text x="30" y="36">el efecto se manda sin nadie escuchando (al girar), y la pantalla nueva recoge después</text>
<rect class="g" x="30" y="60" width="220" height="200" rx="8"/><text x="50" y="88">Channel(BUFFERED)</text><text class="s" x="50" y="116">espera en la cola</text><text class="s" x="50" y="138">llega una vez, a uno</text><text class="s" x="50" y="160">dos que recogen: se reparten</text><text x="50" y="236">✓ efectos</text>
<rect class="r" x="270" y="60" width="220" height="200" rx="8"/><text x="290" y="88">SharedFlow (replay 0)</text><text class="s" x="290" y="116">tryEmit da true</text><text class="s" x="290" y="138">y se tira: no llega</text><text class="s" x="290" y="160">con replay 1: se repite</text><text x="290" y="236">✗ se pierde</text>
<rect class="f" x="510" y="60" width="220" height="200" rx="8"/><text x="530" y="88">StateFlow</text><text class="s" x="530" y="116">llega, y se queda</text><text class="s" x="530" y="138">se ve otra vez al volver</text><text class="s" x="530" y="160">dos iguales seguidos: uno</text><text x="530" y="236">✗ se repite</text>
</svg>
