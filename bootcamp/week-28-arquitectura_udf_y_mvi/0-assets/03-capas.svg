<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Quién tiene qué</title><desc id="d">BitacoraApp crea una vez el JsonFileObservationRepository, sobre observations.json en filesDir, y la actividad se lo da al BitacoraViewModel con viewModelFactory, junto con el SavedStateHandle. Las observaciones son del repositorio, que es la fuente de verdad. El borrador, la posición, locating y la última borrada siguen en el SavedStateHandle. En los tests, el ViewModel recibe un FakeRepository en memoria.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="f" x="30" y="40" width="200" height="70" rx="8"/><text x="50" y="68">BitacoraApp</text><text class="s" x="50" y="92">crea el repositorio, una vez</text>
<rect class="b" x="280" y="40" width="200" height="70" rx="8"/><text x="300" y="68">MainActivity</text><text class="s" x="300" y="92">viewModelFactory</text>
<rect class="g" x="280" y="160" width="200" height="90" rx="8"/><text x="300" y="188">BitacoraViewModel</text><text class="s" x="300" y="212">(handle, repository)</text>
<rect class="b" x="530" y="40" width="200" height="90" rx="8"/><text x="550" y="68">ObservationRepository</text><text class="s" x="550" y="92">archivo: observations.json</text><text class="s" x="550" y="112">tests: FakeRepository</text>
<rect class="r" x="30" y="160" width="200" height="90" rx="8"/><text x="50" y="188">SavedStateHandle</text><text class="s" x="50" y="212">borrador, posición,</text><text class="s" x="50" y="232">locating, la borrada</text>
<path class="l" d="M230 75H278" marker-end="url(#a)"/><path class="l" d="M380 110V158" marker-end="url(#a)"/>
<path class="l" d="M230 205H278" marker-end="url(#a)"/><path class="l" d="M630 130L482 190" marker-end="url(#a)"/><text class="s" x="560" y="176">la fuente de verdad</text>
