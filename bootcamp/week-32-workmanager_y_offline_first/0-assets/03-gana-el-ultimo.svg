<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 400" role="img" aria-labelledby="t d"><title id="t">Gana el último</title><desc id="d">Cuatro casos de la regla gana el último en la Bitácora. Caso 1: aquí hay un cambio sin subir de A-1 a las 1000 y el servidor tiene A-1 de las 500; gana el de aquí, se queda y se sube con PUT. Caso 2: el del servidor es de las 1500; gana el del servidor, entra en la tabla y el de aquí sale de la cola sin subirse. Caso 3: misma hora; en la Bitácora gana el de aquí, y en el ejercicio 02, el móvil de nombre mayor. Caso 4: aquí se borró A-1 a las 2000 y el servidor la tiene de las 1000; la lápida gana y la observación no vuelve. Abajo, el punto débil: las horas son de cada móvil, y uno con el reloj adelantado gana aunque escribiera antes.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}.c{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 4}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<text x="40" y="40">Aquí (en la cola)</text><text x="300" y="40">Servidor</text><text x="540" y="40">Resultado</text>
<rect class="g" x="20" y="56" width="220" height="44" rx="8"/><text x="36" y="83">A-1 «roya» · 1000</text>
<rect class="b" x="280" y="56" width="220" height="44" rx="8"/><text x="296" y="83">A-1 «del equipo» · 500</text>
<path class="l" d="M500 78H526" marker-end="url(#a)"/><text x="536" y="76">gana aquí: se queda</text><text class="s" x="536" y="94">y se sube (PUT)</text>
<rect class="g" x="20" y="126" width="220" height="44" rx="8"/><text x="36" y="153">A-1 «roya» · 1000</text>
<rect class="b" x="280" y="126" width="220" height="44" rx="8"/><text x="296" y="153">A-1 «del equipo» · 1500</text>
<path class="l" d="M500 148H526" marker-end="url(#a)"/><text x="536" y="146">gana el servidor: entra</text><text class="s" x="536" y="164">y sale de la cola sin subirse</text>
<rect class="g" x="20" y="196" width="220" height="44" rx="8"/><text x="36" y="223">A-1 «roya» · 1000</text>
<rect class="b" x="280" y="196" width="220" height="44" rx="8"/><text x="296" y="223">A-1 «del equipo» · 1000</text>
<path class="l" d="M500 218H526" marker-end="url(#a)"/><text x="536" y="216">empate: gana aquí</text><text class="s" x="536" y="234">(ejercicio 02: el móvil mayor)</text>
<rect class="r" x="20" y="266" width="220" height="44" rx="8"/><text x="36" y="293">A-1 borrada · 2000</text>
<rect class="b" x="280" y="266" width="220" height="44" rx="8"/><text x="296" y="293">A-1 «roya» · 1000</text>
<path class="l" d="M500 288H526" marker-end="url(#a)"/><text x="536" y="286">gana la lápida:</text><text class="s" x="536" y="304">A-1 no vuelve</text>
<rect class="c" x="20" y="330" width="720" height="52" rx="8"/><text class="s" x="36" y="352">Las horas son de cada móvil. Uno con el reloj una hora adelantado gana siempre, aunque escribiera antes:</text><text class="s" x="36" y="370">la regla es sencilla y converge, pero puede perder el cambio que de verdad fue el último.</text>
</svg>
