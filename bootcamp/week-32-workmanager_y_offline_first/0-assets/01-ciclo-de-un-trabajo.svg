<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 400" role="img" aria-labelledby="t d"><title id="t">La vida de un trabajo en WorkManager</title><desc id="d">Diagrama de estados. Un trabajo encolado está en ENQUEUED; si va detrás de otro en una cadena o con APPEND, empieza en BLOCKED y pasa a ENQUEUED cuando el anterior termina. Cuando se cumplen sus condiciones pasa a RUNNING y se llama a doWork. Si devuelve success, acaba en SUCCEEDED; si devuelve failure, en FAILED; si devuelve retry, vuelve a ENQUEUED con un intento más y espera lo que diga el backoff. Cancelarlo, o sustituirlo con REPLACE, lo deja en CANCELLED. Un trabajo periódico no acaba en SUCCEEDED: vuelve a ENQUEUED para el periodo siguiente.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}.c{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 4}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="40" y="40" width="150" height="44" rx="8"/><text x="72" y="67">BLOCKED</text>
<path class="l" d="M115 84V146" marker-end="url(#a)"/><text class="s" x="124" y="112">termina el anterior</text><text class="s" x="124" y="127">(cadena o APPEND)</text>
<rect class="b" x="40" y="150" width="150" height="44" rx="8"/><text x="68" y="177">ENQUEUED</text>
<path class="l" d="M190 172H286" marker-end="url(#a)"/><text class="s" x="196" y="160">condiciones</text><text class="s" x="196" y="192">cumplidas</text>
<rect class="f" x="290" y="150" width="160" height="44" rx="8"/><text x="312" y="177">RUNNING · doWork</text>
<path class="l" d="M450 160L556 92" marker-end="url(#a)"/><text class="s" x="470" y="110">success</text>
<rect class="g" x="560" y="60" width="160" height="44" rx="8"/><text x="592" y="87">SUCCEEDED</text>
<path class="l" d="M450 172H556" marker-end="url(#a)"/><text class="s" x="478" y="166">failure</text>
<rect class="r" x="560" y="150" width="160" height="44" rx="8"/><text x="610" y="177">FAILED</text>
<path class="l" d="M370 194V262Q370 282 350 282H135Q115 282 115 262V198" marker-end="url(#a)"/><text class="s" x="140" y="304">retry: runAttemptCount + 1, y espera el backoff</text><text class="s" x="140" y="320">(10 s como mínimo; exponencial: 10, 20, 40...)</text>
<path class="l" d="M450 186L556 252" marker-end="url(#a)"/><text class="s" x="470" y="244">cancel</text>
<rect class="r" x="560" y="240" width="160" height="44" rx="8"/><text x="596" y="267">CANCELLED</text>
<text class="s" x="560" y="306">cancelar, o REPLACE</text><text class="s" x="560" y="322">con uno igual en cola</text>
<rect class="c" x="40" y="336" width="680" height="52" rx="8"/><text class="s" x="56" y="357">Un periódico no acaba en SUCCEEDED: tras cada doWork vuelve a ENQUEUED,</text><text class="s" x="56" y="376">para el periodo siguiente (15 min como mínimo).</text>
</svg>
