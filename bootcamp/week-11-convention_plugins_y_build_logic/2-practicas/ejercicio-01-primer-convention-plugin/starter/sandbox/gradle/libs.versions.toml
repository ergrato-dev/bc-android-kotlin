# Paso 2: añade la biblioteca `kotlin-gradle-plugin` (org.jetbrains.kotlin:kotlin-gradle-plugin, con la versión de Kotlin).
#         build-logic la necesita para poder aplicar el plugin de Kotlin dentro de un convention plugin.

[versions]
kotlin = "2.4.21"
serialization = "1.12.0"
junit = "6.1.3"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
serialization-bom = { module = "org.jetbrains.kotlinx:kotlinx-serialization-bom", version.ref = "serialization" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json" }

[bundles]
testing = ["kotlin-test", "junit-launcher"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
