<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">Dónde se carga el plugin de Kotlin</title><desc id="d">A la izquierda, el raíz no declara el plugin de Kotlin: los módulos lo cargan junto con build-logic, y un cambio en build-logic cambia el classpath de compileKotlin y recompila todos los módulos; si además un módulo pide otro plugin de Kotlin con versión, Gradle avisa de que Kotlin se cargó varias veces. A la derecha, el raíz declara kotlin-jvm con apply false: Kotlin se carga una vez, desde el raíz, los módulos lo encuentran ahí, y un cambio en build-logic deja compileKotlin UP-TO-DATE.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="o" x="15" y="15" width="355" height="300" rx="10"/><text x="30" y="40">Raíz sin kotlin-jvm</text>
<rect class="b" x="35" y="60" width="315" height="45" rx="8"/><text x="50" y="88">raíz: nada de Kotlin</text>
<rect class="r" x="35" y="130" width="315" height="70" rx="8"/><text x="50" y="155">módulos: Kotlin llega con build-logic</text><text class="s" x="50" y="178">el classpath de compileKotlin incluye build-logic</text>
<path class="l" d="M192 107V128" marker-end="url(#a)"/>
<text class="s" x="35" y="232">Cambias un convention plugin:</text><text x="35" y="256">Class path of task ':core:compileKotlin'</text><text x="35" y="276">has changed: se recompila todo</text>
<rect class="o" x="390" y="15" width="355" height="300" rx="10"/><text x="405" y="40">Raíz con kotlin-jvm apply false</text>
<rect class="g" x="410" y="60" width="315" height="45" rx="8"/><text x="425" y="88">raíz: Kotlin, una vez</text>
<rect class="b" x="410" y="130" width="315" height="70" rx="8"/><text x="425" y="155">módulos: encuentran Kotlin en el raíz</text><text class="s" x="425" y="178">build-logic solo aporta sus plugins</text>
<path class="l" d="M567 107V128" marker-end="url(#a)"/>
<text class="s" x="410" y="232">Cambias un convention plugin:</text><text x="410" y="256">:core:compileKotlin UP-TO-DATE</text><text x="410" y="276">solo se reconstruye build-logic</text></svg>
