<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 340" role="img" aria-labelledby="t d"><title id="t">El build principal y build-logic</title><desc id="d">Dos builds en la misma carpeta. build-logic es un build aparte, con su propio settings, que compila los convention plugins con el plugin kotlin-dsl y lee el mismo catálogo de versiones. El settings del build principal lo incluye con pluginManagement includeBuild. Los módulos core, data y app aplican los convention plugins por su id, sin versión.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="o" x="15" y="15" width="330" height="310" rx="10"/><text x="30" y="40">build-logic (build incluido)</text>
<rect class="f" x="35" y="60" width="290" height="60" rx="8"/><text x="50" y="84">settings.gradle.kts</text><text class="s" x="50" y="104">repositorios propios + el mismo catálogo</text>
<rect class="f" x="35" y="135" width="290" height="60" rx="8"/><text x="50" y="159">build.gradle.kts</text><text class="s" x="50" y="179">kotlin-dsl + kotlin-gradle-plugin</text>
<rect class="g" x="35" y="210" width="290" height="95" rx="8"/><text x="50" y="234">src/main/kotlin/</text><text class="s" x="50" y="256">bitacora.kotlin-base.gradle.kts</text><text class="s" x="50" y="274">bitacora.kotlin-library.gradle.kts</text><text class="s" x="50" y="292">bitacora.kotlin-application.gradle.kts</text>
<rect class="o" x="415" y="15" width="330" height="310" rx="10"/><text x="430" y="40">build principal (bitacora)</text>
