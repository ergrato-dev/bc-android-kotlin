<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">Composición de convention plugins</title><desc id="d">bitacora.kotlin-base aplica el plugin de Kotlin, el JDK 21, los warnings como errores y JUnit. bitacora.kotlin-library aplica la base, java-library y las dependencias de prueba del catálogo. bitacora.kotlin-application aplica la base y application. core usa library y nada más; data usa library y añade serialization y su dependencia de core; app usa application y añade su mainClass y su dependencia de data.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="g" x="230" y="20" width="300" height="80" rx="8"/><text x="245" y="46">bitacora.kotlin-base</text><text class="s" x="245" y="68">org.jetbrains.kotlin.jvm, jvmToolchain(21)</text><text class="s" x="245" y="86">allWarningsAsErrors, useJUnitPlatform</text>
<rect class="f" x="40" y="140" width="300" height="70" rx="8"/><text x="55" y="166">bitacora.kotlin-library</text><text class="s" x="55" y="188">java-library + JUnit y kotlin-test (catálogo)</text>
<rect class="f" x="420" y="140" width="300" height="70" rx="8"/><text x="435" y="166">bitacora.kotlin-application</text><text class="s" x="435" y="188">application</text>
<path class="l" d="M190 138L300 102" marker-end="url(#a)"/><path class="l" d="M570 138L460 102" marker-end="url(#a)"/><text class="s" x="150" y="118">aplica</text><text class="s" x="575" y="118">aplica</text>
<rect class="b" x="20" y="250" width="160" height="62" rx="8"/><text x="35" y="274">:core</text><text class="s" x="35" y="294">nada más</text>
<rect class="b" x="200" y="250" width="200" height="62" rx="8"/><text x="215" y="274">:data</text><text class="s" x="215" y="294">+ serialization, api(:core)</text>
<rect class="b" x="460" y="250" width="240" height="62" rx="8"/><text x="475" y="274">:app</text><text class="s" x="475" y="294">+ mainClass, implementation(:data)</text>
<path class="l" d="M100 248L140 214" marker-end="url(#a)"/><path class="l" d="M290 248L240 214" marker-end="url(#a)"/><path class="l" d="M580 248L570 214" marker-end="url(#a)"/></svg>
