<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 470" role="img" aria-labelledby="t d"><title id="t">El grafo de módulos de la Bitácora</title><desc id="d">Seis módulos en tres capas. Arriba, la app, que junta las piezas. En medio, la feature del mapa. Abajo, cuatro módulos core de Kotlin puro: data, database, network y model. Flechas de dependencia: app depende de feature map y de core data; feature map depende de core model; core data depende de core database, core network y core model; core database depende de core model. Core model no depende de nada. A la derecha, las dependencias prohibidas por las reglas: una feature hacia otra feature, core hacia una feature, cualquiera hacia la app, core model hacia cualquier módulo, y una feature directa a core database.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}.x{stroke:#f85149;stroke-width:2;fill:none;stroke-dasharray:6 4}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<text class="s" x="20" y="34">app</text><text class="s" x="20" y="144">feature</text><text class="s" x="20" y="254">core</text>
<rect class="b" x="190" y="20" width="150" height="44" rx="8"/><text x="245" y="47">:app</text>
<text class="s" x="350" y="38">actividad, navegación,</text><text class="s" x="350" y="54">Hilt, WorkManager</text>
<rect class="f" x="70" y="130" width="150" height="44" rx="8"/><text x="100" y="157">:feature:map</text>
<text class="s" x="105" y="194">MapScreen, sus textos, Maps</text>
<rect class="g" x="300" y="240" width="150" height="44" rx="8"/><text x="336" y="267">:core:data</text>
<rect class="g" x="210" y="330" width="150" height="44" rx="8"/><text x="225" y="357">:core:database</text>
<rect class="g" x="390" y="330" width="150" height="44" rx="8"/><text x="408" y="357">:core:network</text>
<rect class="g" x="70" y="410" width="150" height="44" rx="8"/><text x="96" y="437">:core:model</text>
<path class="l" d="M230 64L170 128" marker-end="url(#a)"/>
<path class="l" d="M300 64L370 238" marker-end="url(#a)"/>
<path class="l" d="M95 174V408" marker-end="url(#a)"/>
<path class="l" d="M360 284L300 328" marker-end="url(#a)"/>
<path class="l" d="M400 284L455 328" marker-end="url(#a)"/>
<path class="l" d="M300 262H195L170 408" marker-end="url(#a)"/>
<path class="l" d="M250 374L195 408" marker-end="url(#a)"/>
<text class="s" x="230" y="400">api</text><text class="s" x="200" y="257">api</text>
<rect class="r" x="565" y="110" width="180" height="250" rx="8"/><text x="580" y="136">Prohibido</text>
<path class="x" d="M580 160H612"/><text class="s" x="620" y="164">feature → feature</text>
<path class="x" d="M580 194H612"/><text class="s" x="620" y="198">core → feature</text>
<path class="x" d="M580 228H612"/><text class="s" x="620" y="232">cualquiera → :app</text>
<path class="x" d="M580 262H612"/><text class="s" x="620" y="266">:core:model → algo</text>
<path class="x" d="M580 296H612"/><text class="s" x="620" y="294">feature →</text><text class="s" x="620" y="310">:core:database</text>
<text class="s" x="580" y="344">Gradle solo ve los ciclos</text>
