<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">Lo que ve la app al compilar</title><desc id="d">Tres módulos que ve la app (core network, a través del api de core data), con sus dependencias partidas en dos: lo que exponen con api, que la app ve al compilar, y lo que guardan con implementation, que va en el APK pero la app no puede importar. core network: api ktor-client-core; implementation content-negotiation y kotlinx-serialization-json. core data: api core model, core database, core network y coroutines; implementation datastore-preferences-core y kotlinx-serialization-json. feature map: api core model y compose material3; implementation maps-compose y play-services-maps. Arriba, el classpath de compilación de la app tiene solo lo de api; el de ejecución lo tiene todo.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.h{fill:#161b22;stroke:#30363d;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.v{font-size:12px;fill:#3fb950}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="20" y="20" width="720" height="70" rx="8"/><text x="36" y="46">:app · fieldDebugCompileClasspath: solo lo de api</text>
<text class="s" x="36" y="72">fieldDebugRuntimeClasspath (el APK): todo, también lo de implementation</text>
<path class="l" d="M130 150V92" marker-end="url(#a)"/><path class="l" d="M380 150V92" marker-end="url(#a)"/><path class="l" d="M630 150V92" marker-end="url(#a)"/>
<rect class="g" x="20" y="150" width="225" height="250" rx="8"/><text x="36" y="176">:core:network</text><text class="s" x="140" y="176">vía :core:data</text>
<text class="s" x="36" y="204">api (la app lo ve)</text><text class="v" x="36" y="224">ktor-client-core</text>
<rect class="h" x="30" y="290" width="205" height="98" rx="6"/><text class="s" x="40" y="312">implementation (dentro)</text><text class="s" x="40" y="334">content-negotiation</text><text class="s" x="40" y="354">serialization-json</text>
<rect class="g" x="267" y="150" width="225" height="250" rx="8"/><text x="283" y="176">:core:data</text>
<text class="s" x="283" y="204">api (la app lo ve)</text><text class="v" x="283" y="224">:core:model</text><text class="v" x="283" y="244">:core:database</text><text class="v" x="283" y="264">:core:network, coroutines</text>
<rect class="h" x="277" y="290" width="205" height="98" rx="6"/><text class="s" x="287" y="312">implementation (dentro)</text><text class="s" x="287" y="334">datastore-preferences</text><text class="s" x="287" y="354">serialization-json</text>
<rect class="f" x="515" y="150" width="225" height="250" rx="8"/><text x="531" y="176">:feature:map</text>
<text class="s" x="531" y="204">api (la app lo ve)</text><text class="v" x="531" y="224">:core:model</text><text class="v" x="531" y="244">compose-material3</text>
<rect class="h" x="525" y="290" width="205" height="98" rx="6"/><text class="s" x="535" y="312">implementation (dentro)</text><text class="s" x="535" y="334">maps-compose</text><text class="s" x="535" y="354">play-services-maps</text>
</svg>
