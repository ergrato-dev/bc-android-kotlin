<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">Las restricciones bajan, los tamaños suben</title><desc id="d">Una Row de 320 dp de ancho recibe de su padre un ancho máximo de 320. Mide primero a los hijos sin peso: la insignia pide 40 y la casilla 48. Después mide al hijo con weight con lo que sobra, 320 menos 40 menos 48, 232 dp. Cada hijo devuelve su tamaño y la Row los coloca de izquierda a derecha: la insignia de 0 a 40, el texto de 40 a 272 y la casilla de 272 a 320. Cada hijo se mide una sola vez.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}.k{stroke:#3fb950;stroke-width:2;fill:none}.e{stroke:#d29922;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="20" y="25" width="720" height="60" rx="8"/><text x="35" y="50">Row(Modifier.fillMaxWidth())</text><text class="s" x="35" y="72">recibe: ancho 0..320 dp</text>
<rect class="g" x="20" y="135" width="150" height="70" rx="8"/><text x="35" y="160">LevelBadge</text><text class="s" x="35" y="182">size(40.dp): 40</text>
<rect class="f" x="195" y="135" width="370" height="70" rx="8"/><text x="210" y="160">Column(Modifier.weight(1f))</text><text class="s" x="210" y="182">se mide la última: 320 - 40 - 48 = 232</text>
<rect class="g" x="590" y="135" width="150" height="70" rx="8"/><text x="605" y="160">Checkbox</text><text class="s" x="605" y="182">48 (toque mínimo)</text>
<path class="k" d="M95 85V130" marker-end="url(#a)"/><path class="k" d="M380 85V130" marker-end="url(#a)"/><path class="k" d="M665 85V130" marker-end="url(#a)"/>
<text class="s" x="105" y="112" style="fill:#3fb950">restricciones</text><text class="s" x="390" y="112" style="fill:#3fb950">0..232</text>
<path class="e" d="M130 205V240H600V210" /><text class="s" x="250" y="232" style="fill:#d29922">tamaños: 40, 232, 48. La Row coloca: 0-40, 40-272, 272-320</text>
<rect class="o" x="20" y="260" width="720" height="55" rx="10"/><text x="35" y="284">Primero los hijos sin peso, después los de weight con lo que sobra. Cada uno se mide una sola vez.</text><text class="s" x="35" y="304">Sin weight, el texto se mediría en su turno con todo lo que queda, y la casilla podría quedarse sin sitio.</text></svg>
