<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">Lo que compone un LazyColumn</title><desc id="d">A la izquierda, una Column con verticalScroll y 200 observaciones: las 200 están en la composición aunque solo se vean unas pocas. A la derecha, un LazyColumn con las mismas 200: solo están en la composición las que caben en la ventana, 8 en la sonda. Al desplazarse, las que salen se sueltan y las que entran se componen. Cada fila tiene su clave, el código de la observación, y su estado va con la clave.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}.k{stroke:#3fb950;stroke-width:2;fill:none}.e{stroke:#d29922;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<text x="40" y="35">Column + verticalScroll</text><text x="420" y="35">LazyColumn, key = { it.code }</text>
<rect class="r" x="40" y="50" width="280" height="30" rx="4"/><text class="s" x="50" y="70">A-1 compuesta</text>
<rect class="r" x="40" y="85" width="280" height="30" rx="4"/><text class="s" x="50" y="105">A-2 compuesta</text>
<rect class="r" x="40" y="120" width="280" height="30" rx="4"/><text class="s" x="50" y="140">...</text>
<rect class="r" x="40" y="155" width="280" height="30" rx="4"/><text class="s" x="50" y="175">A-200 compuesta, aunque no se vea</text>
<text class="s" x="40" y="210">200 nodos en la semántica</text>
<rect class="o" x="410" y="45" width="300" height="150" rx="6"/><text class="s" x="560" y="62">ventana</text>
<rect class="g" x="420" y="70" width="280" height="30" rx="4"/><text class="s" x="430" y="90">"A-41" compuesta</text>
<rect class="g" x="420" y="105" width="280" height="30" rx="4"/><text class="s" x="430" y="125">"A-42" compuesta</text>
<rect class="g" x="420" y="140" width="280" height="30" rx="4"/><text class="s" x="430" y="160">"A-43" compuesta</text>
<text class="s" x="420" y="215">A-1..A-40 y A-44..A-200: sin componer</text><text class="s" x="420" y="235">8 nodos en la sonda, también tras bajar a la 150</text>
<rect class="o" x="20" y="255" width="720" height="60" rx="10"/><text x="35" y="280">Al desplazarse, las que salen se sueltan y las que entran se componen. Su estado va con su clave.</text><text class="s" x="35" y="301">Dentro de una Column con verticalScroll, un LazyColumn no tiene alto máximo: IllegalStateException al medir.</text></svg>
