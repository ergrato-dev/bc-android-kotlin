<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">El orden de los modifiers</title><desc id="d">Dos cajas de 40 dp con los mismos modifiers en distinto orden. Con padding de 16 y luego clickable, la zona que se pulsa son los 40 dp de dentro, de 16 a 56, y el margen no responde. Con clickable y luego padding de 16, la zona que se pulsa son los 72 dp enteros, de 0 a 72, margen incluido. Cada modifier envuelve a los que vienen detrás: la cadena se lee de fuera adentro.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}.k{stroke:#3fb950;stroke-width:2;fill:none}.e{stroke:#d29922;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<text x="40" y="40">Modifier.padding(16.dp).clickable {}.size(40.dp)</text>
<rect class="o" x="40" y="60" width="216" height="216" rx="4"/><rect class="r" x="88" y="108" width="120" height="120" rx="4"/><text x="104" y="172">se pulsa</text><text class="s" x="104" y="192">16..56</text><text class="s" x="50" y="80">margen: no responde</text>
<text x="400" y="40">Modifier.clickable {}.padding(16.dp).size(40.dp)</text>
<rect class="g" x="400" y="60" width="216" height="216" rx="4"/><rect class="b" x="448" y="108" width="120" height="120" rx="4"/><text x="464" y="172">contenido</text><text class="s" x="410" y="80">se pulsa todo: 0..72</text>
<text class="s" x="40" y="305">Se lee de fuera adentro: cada modifier envuelve a los que vienen detrás. Una fila de lista: fillMaxWidth().clickable(...).padding(16.dp).</text></svg>
