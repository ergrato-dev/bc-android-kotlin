<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 290" role="img" aria-labelledby="t d"><title id="t">Dispatchers</title><desc id="d">Tres dispatchers: Main para la interfaz de Android, Default para trabajo de CPU con tantos hilos como núcleos, IO para esperas de red y disco con hasta 64 hilos. withContext cambia de dispatcher y vuelve al terminar el bloque.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="10" y="15" width="240" height="170" rx="8"/><text x="25" y="42">Dispatchers.Main</text><text class="s" x="25" y="66">el hilo de la interfaz (Android)</text><text class="s" x="25" y="94">solo con kotlinx-coroutines-android</text><text class="s" x="25" y="122">nada que bloquee: ni red ni disco</text><text class="s" x="25" y="150">en una app, es el dispatcher</text><text class="s" x="25" y="168">de partida de viewModelScope</text>
<rect class="g" x="260" y="15" width="240" height="170" rx="8"/><text x="275" y="42">Dispatchers.Default</text><text class="s" x="275" y="66">trabajo de CPU: ordenar,</text><text class="s" x="275" y="88">parsear, calcular</text><text class="s" x="275" y="122">tantos hilos como núcleos</text><text class="s" x="275" y="144">(mínimo 2)</text><text class="s" x="275" y="168">el de por defecto sin Main</text>
<rect class="f" x="510" y="15" width="240" height="170" rx="8"/><text x="525" y="42">Dispatchers.IO</text><text class="s" x="525" y="66">esperas: red, disco, base de datos</text><text class="s" x="525" y="94">hasta 64 hilos (o los núcleos</text><text class="s" x="525" y="116">si son más)</text><text class="s" x="525" y="144">comparte hilos con Default,</text><text class="s" x="525" y="166">pero admite más a la vez</text>
<rect class="b" x="10" y="205" width="740" height="70" rx="8"/><text x="25" y="232">withContext(Dispatchers.IO) { leerArchivo() }</text><text class="s" x="25" y="256">suspende la coroutine, ejecuta el bloque en otro dispatcher y VUELVE al original con el resultado</text></svg>
