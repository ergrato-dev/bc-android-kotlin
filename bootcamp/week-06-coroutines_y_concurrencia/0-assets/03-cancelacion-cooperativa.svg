<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Cancelación cooperativa</title><desc id="d">Dos líneas de tiempo. Arriba, un bucle con puntos de suspensión: job.cancel llega y la coroutine se detiene en el siguiente punto de suspensión. Abajo, un bucle de CPU sin comprobaciones sigue ejecutando hasta el final.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="g" x="10" y="15" width="740" height="125" rx="8"/><text x="25" y="42">bucle con ensureActive() o delay()</text>
<path class="l" d="M30 100L720 100" marker-end="url(#a)"/>
<rect class="b" x="40" y="80" width="70" height="40" rx="6"/><rect class="b" x="130" y="80" width="70" height="40" rx="6"/><rect class="b" x="220" y="80" width="70" height="40" rx="6"/><rect class="r" x="360" y="80" width="90" height="40" rx="6"/>
<text class="s" x="55" y="104">vuelta 1</text><text class="s" x="145" y="104">vuelta 2</text><text class="s" x="235" y="104">vuelta 3</text><text class="s" x="372" y="104">se detiene</text>
<path class="l" d="M320 58L320 120" stroke-dasharray="4 4"/><text class="s" x="270" y="54">job.cancel()</text>
<text class="s" x="470" y="64">se detiene en el siguiente punto de suspensión</text>
<rect class="r" x="10" y="160" width="740" height="125" rx="8"/><text x="25" y="187">bucle de CPU sin comprobar nada</text>
<path class="l" d="M30 245L720 245" marker-end="url(#a)"/>
<rect class="b" x="40" y="225" width="70" height="40" rx="6"/><rect class="b" x="130" y="225" width="70" height="40" rx="6"/><rect class="b" x="220" y="225" width="70" height="40" rx="6"/><rect class="b" x="310" y="225" width="70" height="40" rx="6"/><rect class="b" x="400" y="225" width="70" height="40" rx="6"/><rect class="b" x="490" y="225" width="70" height="40" rx="6"/><rect class="b" x="580" y="225" width="70" height="40" rx="6"/>
<text class="s" x="55" y="249">vuelta 1</text><text class="s" x="145" y="249">vuelta 2</text><text class="s" x="235" y="249">vuelta 3</text><text class="s" x="325" y="249">vuelta 4</text><text class="s" x="415" y="249">vuelta 5</text><text class="s" x="505" y="249">vuelta 6</text><text class="s" x="595" y="249">vuelta 7</text>
<path class="l" d="M210 203L210 265" stroke-dasharray="4 4"/><text class="s" x="222" y="215">job.cancel()</text>
<text class="s" x="580" y="205">sigue hasta el final</text></svg>
