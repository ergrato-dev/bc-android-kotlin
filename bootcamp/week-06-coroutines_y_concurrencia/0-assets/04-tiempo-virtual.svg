<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 290" role="img" aria-labelledby="t d"><title id="t">Tiempo virtual en runTest</title><desc id="d">Tres llamadas de 100 milisegundos. En secuencia, el reloj virtual avanza a 300. En paralelo con async, avanza a 100. Con un límite de 2 a la vez, avanza a 200. runTest salta los delay sin esperar de verdad.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<text class="s" x="150" y="30">0</text><text class="s" x="270" y="30">100</text><text class="s" x="390" y="30">200</text><text class="s" x="510" y="30">300 ms virtuales</text>
<path class="l" d="M150 38L650 38" marker-end="url(#a)"/>
<text x="20" y="75">en secuencia</text><rect class="r" x="150" y="55" width="120" height="30" rx="5"/><rect class="r" x="270" y="55" width="120" height="30" rx="5"/><rect class="r" x="390" y="55" width="120" height="30" rx="5"/><text class="s" x="525" y="75">currentTime = 300</text>
<text x="20" y="145">3 × async</text><rect class="g" x="150" y="108" width="120" height="22" rx="5"/><rect class="g" x="150" y="134" width="120" height="22" rx="5"/><rect class="g" x="150" y="160" width="120" height="22" rx="5"/><text class="s" x="285" y="145">currentTime = 100</text>
<text x="20" y="225">límite de 2</text><rect class="f" x="150" y="200" width="120" height="22" rx="5"/><rect class="f" x="150" y="226" width="120" height="22" rx="5"/><rect class="f" x="270" y="200" width="120" height="22" rx="5"/><text class="s" x="405" y="217">currentTime = 200</text>
<text class="s" x="20" y="275">runTest no espera de verdad: salta los delay cuando todas las coroutines están suspendidas</text></svg>
