<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 250" role="img" aria-labelledby="t d"><title id="t">UP-TO-DATE, FROM-CACHE o SUCCESS</title><desc id="d">Antes de ejecutar una tarea, Gradle mira si sus salidas en build siguen ahí y corresponden a las entradas de ahora: entonces es UP-TO-DATE y no hace nada. Si no, y la tarea es cacheable con la caché activada, busca su clave: si la encuentra, copia las salidas y es FROM-CACHE. Si no, la ejecuta: SUCCESS. clean borra build, así que después de clean solo queda FROM-CACHE o SUCCESS.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="15" y="95" width="150" height="60" rx="8"/><text x="30" y="120">la tarea va</text><text x="30" y="140">a ejecutarse</text>
<path class="l" d="M165 125H200" marker-end="url(#a)"/>
<rect class="o" x="205" y="15" width="260" height="220" rx="10"/>
<rect class="f" x="220" y="30" width="230" height="60" rx="8"/><text x="235" y="55">¿salidas en build/ y</text><text x="235" y="75">mismas entradas que entonces?</text>
<rect class="f" x="220" y="150" width="230" height="70" rx="8"/><text x="235" y="175">¿cacheable, caché activada</text><text x="235" y="195">y la clave en una caché?</text><text class="s" x="235" y="212">tras clean se empieza aquí</text>
<path class="l" d="M335 90V145" marker-end="url(#a)"/><text class="s" x="342" y="122">no</text>
<path class="l" d="M450 60H545" marker-end="url(#a)"/><text class="s" x="490" y="52">sí</text>
<path class="l" d="M450 170H545" marker-end="url(#a)"/><text class="s" x="490" y="162">sí</text>
<path class="l" d="M335 220V232H520V218L545 208" marker-end="url(#a)"/><text class="s" x="420" y="246">no</text>
<rect class="g" x="550" y="35" width="195" height="50" rx="8"/><text x="565" y="58">UP-TO-DATE</text><text class="s" x="565" y="76">no hace nada</text>
<rect class="g" x="550" y="140" width="195" height="45" rx="8"/><text x="565" y="160">FROM-CACHE</text><text class="s" x="565" y="177">copia las salidas</text>
<rect class="r" x="550" y="190" width="195" height="45" rx="8"/><text x="565" y="210">SUCCESS</text><text class="s" x="565" y="227">ejecuta y guarda</text></svg>
