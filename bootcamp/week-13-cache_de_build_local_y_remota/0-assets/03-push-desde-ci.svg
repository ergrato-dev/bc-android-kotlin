<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 280" role="img" aria-labelledby="t d"><title id="t">La caché remota: el CI sube, todos bajan</title><desc id="d">El CI construye main y sube sus resultados al servidor de caché (isPush, solo con la variable CI). Cada desarrollador busca primero en su caché local y después en el servidor, del que solo descarga; lo que descarga queda también en su caché local. Las credenciales salen de variables de entorno. Si el servidor falla, Gradle desactiva la caché remota durante ese build y sigue.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="15" y="30" width="230" height="90" rx="8"/><text x="30" y="55">CI (main)</text><text class="s" x="30" y="77">CI=true, isPush</text><text class="s" x="30" y="95">credenciales: los secretos</text><text class="s" x="30" y="111">del CI, nunca en el repositorio</text>
<path class="l" d="M245 75H315" marker-end="url(#a)"/><text class="s" x="252" y="65">PUT</text>
<rect class="f" x="320" y="30" width="165" height="90" rx="8"/><text x="335" y="55">servidor de caché</text><text class="s" x="335" y="77">HttpBuildCache</text><text class="s" x="335" y="95">https, con usuario</text><text class="s" x="335" y="111">401 sin credenciales</text>
<rect class="o" x="15" y="150" width="730" height="115" rx="10"/><text x="30" y="175">Desarrolladores (sin CI: solo bajan)</text>
<rect class="g" x="30" y="190" width="200" height="60" rx="8"/><text x="45" y="214">1. caché local</text><text class="s" x="45" y="234">~/.gradle/caches/build-cache-1</text>
<path class="l" d="M230 220H300" marker-end="url(#a)"/><text class="s" x="240" y="212">si no está</text>
<rect class="g" x="305" y="190" width="170" height="60" rx="8"/><text x="320" y="214">2. GET al servidor</text><text class="s" x="320" y="234">y se guarda en local</text>
<path class="l" d="M400 190V125" marker-end="url(#a)"/>
<rect class="r" x="500" y="190" width="230" height="60" rx="8"/><text x="515" y="214">servidor caído o 401</text><text class="s" x="515" y="234">remota desactivada; el build sigue</text>
<rect class="o" x="500" y="30" width="245" height="90" rx="10"/><text class="s" x="515" y="55">Solo el CI sube: lo que hay en el</text><text class="s" x="515" y="73">servidor salió de un build limpio de</text><text class="s" x="515" y="91">main, no del portátil de alguien</text><text class="s" x="515" y="109">con cambios sin commit.</text></svg>
