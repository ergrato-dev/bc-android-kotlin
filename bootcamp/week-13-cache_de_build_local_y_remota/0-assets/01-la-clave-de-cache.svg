<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 270" role="img" aria-labelledby="t d"><title id="t">La clave de caché de una tarea</title><desc id="d">Gradle calcula la clave de una tarea a partir de su implementación, sus valores de entrada y la huella de sus archivos de entrada, normalizada según PathSensitive, más los nombres de sus salidas. Con esa clave busca primero en la caché local y después en la remota. Si la encuentra, descarga las salidas: FROM-CACHE. Si no, ejecuta la tarea y guarda las salidas con esa clave.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="o" x="15" y="15" width="270" height="240" rx="10"/><text x="30" y="40">Lo que entra en la clave</text>
<rect class="b" x="30" y="55" width="240" height="40" rx="8"/><text x="45" y="80">implementación de la tarea</text>
<rect class="b" x="30" y="105" width="240" height="40" rx="8"/><text x="45" y="130">@Input: skipHeader = true</text>
<rect class="b" x="30" y="155" width="240" height="50" rx="8"/><text x="45" y="176">@InputFile + @PathSensitive</text><text class="s" x="45" y="195">data/observations.csv + su contenido</text>
<text class="s" x="30" y="232">+ el nombre de cada salida (report)</text>
<path class="l" d="M285 135H335" marker-end="url(#a)"/>
<rect class="f" x="340" y="105" width="150" height="60" rx="8"/><text x="355" y="130">clave (hash)</text><text class="s" x="355" y="150">4b6e67b4de55...</text>
<path class="l" d="M490 120L525 70" marker-end="url(#a)"/><path class="l" d="M490 150L525 200" marker-end="url(#a)"/>
<rect class="g" x="530" y="35" width="220" height="70" rx="8"/><text x="545" y="60">¿la tiene alguna caché?</text><text class="s" x="545" y="80">local primero, luego remota</text><text class="s" x="545" y="96">sí: FROM-CACHE, sin ejecutar</text>
<rect class="r" x="530" y="165" width="220" height="70" rx="8"/><text x="545" y="190">ninguna la tiene</text><text class="s" x="545" y="210">ejecuta la tarea: SUCCESS</text><text class="s" x="545" y="226">y guarda las salidas con la clave</text></svg>
