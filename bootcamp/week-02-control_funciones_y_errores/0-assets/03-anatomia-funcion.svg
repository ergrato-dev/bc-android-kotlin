<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 190" role="img" aria-labelledby="t d"><title id="t">Anatomía de una función</title><desc id="d">fun, nombre, parámetros con tipo y valor por defecto, tipo de retorno y cuerpo; la misma función se puede escribir con cuerpo de expresión.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.m{font-family:sans-serif}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs><rect class="b" x="10" y="15" width="740" height="75" rx="8"/><text class="m" x="25" y="45">fun formatear(valor: Double, decimales: Int = 2): String {</text><text class="m" x="25" y="70">    return String.format(Locale.ROOT, "%.${decimales}f", valor) }</text><text class="s" x="25" y="85">fun · nombre · parámetros (nombre: Tipo = valorPorDefecto) · : tipo de retorno · cuerpo</text><rect class="f" x="10" y="105" width="740" height="75" rx="8"/><text class="m" x="25" y="135">fun formatear(valor: Double, decimales: Int = 2) =</text><text class="m" x="25" y="157">    String.format(Locale.ROOT, "%.${decimales}f", valor)</text><text class="s" x="25" y="173">cuerpo de expresión: sin llaves ni return; el tipo de retorno se infiere</text></svg>
