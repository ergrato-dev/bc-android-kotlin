<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 230" role="img" aria-labelledby="t d"><title id="t">Cómo viaja un error</title><desc id="d">Una función lanza una excepción; si nadie la captura sube por la pila de llamadas hasta un try/catch o hasta terminar el programa. Alternativas: devolver null o un Result.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.m{font-family:sans-serif}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs><rect class="f" x="10" y="20" width="150" height="50" rx="8"/><text x="85" y="50" text-anchor="middle">main()</text><rect class="f" x="10" y="85" width="150" height="50" rx="8"/><text x="85" y="115" text-anchor="middle">leerSeguro()</text><rect class="f" x="10" y="150" width="150" height="50" rx="8"/><text x="85" y="180" text-anchor="middle">parseEnteroOLanza()</text><path d="M85 70V83M85 135V148" stroke="#9aa4af" stroke-width="2" marker-end="url(#a)"/><path d="M175 175H215V110H175" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/><text class="s" x="225" y="150" fill="#f85149">throw IllegalArgumentException</text><text class="s" x="225" y="168">sube hasta el primer try/catch</text><rect class="b" x="430" y="20" width="320" height="55" rx="8"/><text x="445" y="43">Excepción: algo no debería pasar</text><text class="s" x="445" y="62">require, check, throw, try/catch</text><rect class="b" x="430" y="88" width="320" height="55" rx="8"/><text x="445" y="111">null: la ausencia es normal</text><text class="s" x="445" y="130">toIntOrNull, ?., ?:</text><rect class="b" x="430" y="156" width="320" height="55" rx="8"/><text x="445" y="179">Result: éxito o fallo como valor</text><text class="s" x="445" y="198">runCatching, fold, getOrElse</text></svg>
