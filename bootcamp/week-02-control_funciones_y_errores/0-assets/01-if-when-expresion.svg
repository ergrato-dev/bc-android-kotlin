<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" role="img" aria-labelledby="t d"><title id="t">if y when como expresiones</title><desc id="d">Un when evalúa sus ramas en orden y devuelve el valor de la primera cuya condición se cumple; else cubre el resto.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.m{font-family:sans-serif}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs><rect class="b" x="10" y="15" width="360" height="180" rx="8"/><text class="m" x="25" y="42">val nivel = when {</text><text class="m" x="25" y="68">  m >= 50 -> "HIGH"</text><text class="m" x="25" y="94">  m >= 10 -> "MEDIUM"</text><text class="m" x="25" y="120">  else    -> "LOW"</text><text class="m" x="25" y="146">}</text><text class="s" x="25" y="176">when devuelve un valor: es una expresión</text><rect class="f" x="400" y="15" width="350" height="180" rx="8"/><text x="415" y="42">m = 57.0</text><text class="s" x="415" y="62">¿57 >= 50?  sí  -> "HIGH"  (para aquí)</text><text x="415" y="100">m = 12.0</text><text class="s" x="415" y="120">¿12 >= 50?  no</text><text class="s" x="415" y="138">¿12 >= 10?  sí  -> "MEDIUM"</text><text x="415" y="170">m = 3.0</text><text class="s" x="415" y="188">ninguna se cumple  -> else  "LOW"</text></svg>
