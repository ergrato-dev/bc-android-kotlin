xt x="333" y="136">2</text><text x="373" y="136">1</text><text class="s" x="420" y="136">hacia atrás</text><text class="m" x="15" y="185">1..10 step 3</text><g class="f"><rect x="200" y="165" width="40" height="30"/><rect x="240" y="165" width="40" height="30"/><rect x="280" y="165" width="40" height="30"/><rect x="320" y="165" width="40" height="30"/></g><text x="213" y="186">1</text><text x="253" y="186">4</text><text x="293" y="186">7</text><text x="326" y="186">10</text><text class="s" x="420" y="186">de tres en tres</text></svg>
