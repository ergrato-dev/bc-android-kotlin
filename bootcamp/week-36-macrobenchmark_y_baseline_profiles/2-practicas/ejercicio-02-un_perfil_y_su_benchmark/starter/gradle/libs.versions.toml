# Ya está hecho: lo de las semanas anteriores, y lo de esta: Macrobenchmark y el plugin de Baseline Profiles 1.5.0,
# UiAutomator 2.4.1 y profileinstaller 1.4.1. wire-runtime es la corregida de la que trae Macrobenchmark.
[versions]
agp = "9.4.1"
kotlin = "2.4.21"
activity = "1.13.0"
compose-bom = "2026.09.00"
junit = "6.1.3"
androidx-test-junit = "1.3.0"
benchmark = "1.5.0"
uiautomator = "2.4.1"
profileinstaller = "1.4.1"
wire = "6.4.7"

[libraries]
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
wire-runtime = { module = "com.squareup.wire:wire-runtime", version.ref = "wire" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
