<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 780 270" role="img" aria-labelledby="t d"><title id="t">El arranque en frío de la Bitácora</title><desc id="d">Línea de tiempo en milisegundos del arranque en frío medido en el emulador, mediana de 15 sin perfil. Hasta 695,6 ms: proceso, Application, MainActivity, Hilt, setContent y el primer fotograma, vacío; ahí está TTID. De 695,6 a 1 324,2 ms: Room lee la lista y llega la pantalla de verdad; ahí está TTFD, cuando la app llama a reportFullyDrawn con ReportDrawnWhen.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.h{font-weight:bold}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<text x="40" y="40" class="h">Arranque en frío de la Bitácora (emulador, mediana de 15, sin perfil)</text><line class="l" x1="40" y1="190" x2="740.0" y2="190" marker-end="url(#a)"/><line class="l" x1="40.0" y1="186" x2="40.0" y2="194"/><text x="30.0" y="212" class="s">0</text><line class="l" x1="140.0" y1="186" x2="140.0" y2="194"/><text x="130.0" y="212" class="s">200</text><line class="l" x1="240.0" y1="186" x2="240.0" y2="194"/><text x="230.0" y="212" class="s">400</text><line class="l" x1="340.0" y1="186" x2="340.0" y2="194"/><text x="330.0" y="212" class="s">600</text><line class="l" x1="440.0" y1="186" x2="440.0" y2="194"/><text x="430.0" y="212" class="s">800</text><line class="l" x1="540.0" y1="186" x2="540.0" y2="194"/><text x="530.0" y="212" class="s">1000</text><line class="l" x1="640.0" y1="186" x2="640.0" y2="194"/><text x="630.0" y="212" class="s">1200</text><text x="690.0" y="212" class="s">ms</text><rect class="b" x="40.0" y="70" width="347.8" height="50" rx="6"/><text x="52.0" y="92">Proceso, Application, MainActivity</text><text x="52.0" y="112" class="s">Hilt, setContent, primer fotograma (vacío)</text><rect class="f" x="387.8" y="70" width="314.3" height="50" rx="6"/><text x="399.8" y="92">Room lee la lista</text><text x="399.8" y="112" class="s">state.loaded · la pantalla de verdad</text><line class="l" x1="387.8" y1="130" x2="387.8" y2="180"/><text x="237.8" y="160">TTID 695,6 ms</text><line class="l" x1="702.1" y1="130" x2="702.1" y2="180"/><text x="542.1" y="160">TTFD 1 324,2 ms</text><text x="40" y="244" class="s">TTID lo mide Android solo. TTFD llega cuando la app llama a reportFullyDrawn (ReportDrawnWhen { state.loaded }).</text>
</svg>
