<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 410" role="img" aria-labelledby="t d"><title id="t">De la regla al APK</title><desc id="d">Tres fuentes de reglas: src/main/baseline-prof.txt escrito a mano, el perfil generado en src/fieldRelease/generated con 25 879 líneas, y el perfil de cada biblioteca. mergeFieldReleaseArtProfile las junta en un texto de 27 998 líneas; compileFieldReleaseArtProfile lo compila a assets/dexopt/baseline.prof y baseline.profm en el APK, 14 969 bytes solo con las bibliotecas y 26 302 con el generado. En el móvil, Play o profileinstaller se lo da a ART.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.h{font-weight:bold}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="g" x="30" y="30" width="220" height="70" rx="8"/><text x="44" y="58">src/main/baseline-prof.txt</text><text x="44" y="80" class="s">a mano (ejercicio 02)</text><rect class="g" x="270" y="30" width="220" height="70" rx="8"/><text x="284" y="58">src/fieldRelease/generated</text><text x="284" y="80" class="s">generado · 25 879 líneas</text><rect class="g" x="510" y="30" width="220" height="70" rx="8"/><text x="524" y="58">Compose, Room, Ktor...</text><text x="524" y="80" class="s">el perfil de cada biblioteca</text><path class="l" d="M140 100V140" marker-end="url(#a)"/><path class="l" d="M380 100V140" marker-end="url(#a)"/><path class="l" d="M620 100V140" marker-end="url(#a)"/><rect class="b" x="30" y="142" width="700" height="60" rx="8"/><text x="46" y="168">merged_art_profile/.../baseline-prof.txt · texto, todo junto</text><text x="46" y="190" class="s">mergeFieldReleaseArtProfile · aquí se ve qué entra (27 998 líneas en la Bitácora)</text><path class="l" d="M380 202V240" marker-end="url(#a)"/><rect class="f" x="30" y="242" width="700" height="60" rx="8"/><text x="46" y="268">APK: assets/dexopt/baseline.prof + baseline.profm · binario</text><text x="46" y="290" class="s">compileFieldReleaseArtProfile · 14 969 bytes solo con las bibliotecas, 26 302 con el generado</text><path class="l" d="M380 302V338" marker-end="url(#a)"/><rect class="r" x="30" y="340" width="700" height="50" rx="8"/><text x="46" y="370">En el móvil: Play, o profileinstaller, se lo da a ART, que compila esas clases y métodos</text>
