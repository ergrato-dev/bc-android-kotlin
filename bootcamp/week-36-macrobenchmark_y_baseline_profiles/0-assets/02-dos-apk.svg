<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 350" role="img" aria-labelledby="t d"><title id="t">Dos APK en el dispositivo</title><desc id="d">A la izquierda, el APK de los benchmarks, con StartupBenchmark, ScrollBenchmark, BaselineProfileGenerator, Macrobenchmark y UiAutomator; se instrumenta a sí mismo. A la derecha, la app de field en benchmarkRelease: release sin debuggable, profileable desde la shell, firmada con la clave de debug y con el perfil en assets/dexopt. El primero arranca y mata la app, la toca y desliza, y recibe la traza de Perfetto. Abajo: deja un JSON con las medidas y una traza por iteración.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.h{font-weight:bold}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="g" x="30" y="30" width="330" height="220" rx="10"/><text x="46" y="58" class="h">baselineprofile-benchmarkRelease.apk</text><text x="46" y="86">StartupBenchmark · ScrollBenchmark</text><text x="46" y="112">BaselineProfileGenerator</text><text x="46" y="138">Macrobenchmark · UiAutomator</text><text x="46" y="164" class="s">targetPackage: dev.bitacora.baselineprofile</text><text x="46" y="184" class="s">(se instrumenta a sí mismo)</text><rect class="b" x="460" y="30" width="270" height="220" rx="10"/><text x="476" y="58" class="h">app-field-benchmarkRelease.apk</text><text x="476" y="86">dev.bitacora.agro</text><text x="476" y="112">release, sin debuggable</text><text x="476" y="138">profileable shell="true"</text><text x="476" y="164">firmada con la clave de debug</text><text x="476" y="190">assets/dexopt/baseline.prof</text><path class="l" d="M360 100H458" marker-end="url(#a)"/><text x="370" y="92" class="s">am start, kill</text><path class="l" d="M360 150H458" marker-end="url(#a)"/><text x="370" y="142" class="s">toques, fling</text><path class="l" d="M458 200H362" marker-end="url(#a)"/><text x="370" y="192" class="s">traza Perfetto</text><rect class="f" x="30" y="272" width="700" height="56" rx="8"/><text x="46" y="296">Sale: dev.bitacora.baselineprofile-benchmarkData.json y un .perfetto-trace por iteración</text><text x="46" y="316" class="s">./gradlew :baselineprofile:connectedBenchmarkReleaseAndroidTest · en un emulador, con suppressErrors=EMULATOR</text>
</svg>
