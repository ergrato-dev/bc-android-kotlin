# Ya está hecho (semana 11): un solo catálogo para el build principal y build-logic.

[versions]
agp = "9.4.1"
kotlin = "2.4.21"
serialization = "1.12.0"
junit = "6.1.3"
activity = "1.13.0"
lifecycle = "2.11.0"
junit4 = "4.13.2"
robolectric = "4.17"
guava = "33.7.2-jre"
android-all = "16-robolectric-13921718-i7"
androidx-test-core = "1.7.0"
androidx-test-junit = "1.3.0"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
serialization-bom = { module = "org.jetbrains.kotlinx:kotlinx-serialization-bom", version.ref = "serialization" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
activity = { module = "androidx.activity:activity", version.ref = "activity" }
lifecycle-viewmodel-savedstate = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
android-all = { module = "org.robolectric:android-all-instrumented", version.ref = "android-all" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }

[bundles]
testing = ["kotlin-test", "junit-launcher"]
robolectric = ["junit4", "kotlin-test-junit", "robolectric", "androidx-test-core", "androidx-test-junit"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
