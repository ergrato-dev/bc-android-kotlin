<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">El orden de los source sets</title><desc id="d">Para la variante demoDebug, un recurso se busca primero en src/demoDebug, después en src/debug, después en src/demo y por último en src/main. Gana el primero que lo tiene. Un calificador que coincide con el móvil, como values-en, pesa más que la carpeta. El código no se tapa: las clases de main y de demo se compilan juntas, y una clase repetida da Redeclaration.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="g" x="15" y="30" width="165" height="70" rx="8"/><text x="30" y="58">src/demoDebug</text><text class="s" x="30" y="80">la variante</text>
<rect class="b" x="205" y="30" width="165" height="70" rx="8"/><text x="220" y="58">src/debug</text><text class="s" x="220" y="80">el tipo de build</text>
<rect class="b" x="395" y="30" width="165" height="70" rx="8"/><text x="410" y="58">src/demo</text><text class="s" x="410" y="80">el flavor</text>
<rect class="b" x="585" y="30" width="160" height="70" rx="8"/><text x="600" y="58">src/main</text><text class="s" x="600" y="80">todas</text>
<path class="l" d="M180 65H200" marker-end="url(#a)"/><path class="l" d="M370 65H390" marker-end="url(#a)"/><path class="l" d="M560 65H580" marker-end="url(#a)"/>
<text class="s" x="15" y="125">Recursos: gana la primera carpeta que tiene el recurso, con los mismos calificadores.</text>
<rect class="f" x="15" y="145" width="355" height="90" rx="8"/><text x="30" y="170">El idioma pesa más que la carpeta</text><text class="s" x="30" y="192">src/demo/res/values: Bitácora demo</text><text class="s" x="30" y="210">src/main/res/values-en: Field log</text><text class="s" x="30" y="227">móvil en inglés: Field log, el de main</text>
<rect class="r" x="395" y="145" width="350" height="90" rx="8"/><text x="410" y="170">El código no se tapa</text><text class="s" x="410" y="192">Samples en main y en demo: Redeclaration</text><text class="s" x="410" y="210">Samples en demo y en field, nunca en main;</text><text class="s" x="410" y="227">si falta en uno, solo ese no compila</text>
<rect class="o" x="15" y="255" width="730" height="60" rx="10"/><text x="30" y="280">Tests: src/test en todas las variantes; src/testDemo solo en demo; src/testField solo en field.</text><text class="s" x="30" y="301">El manifiesto de src/demo se fusiona con el de main, como el de una biblioteca.</text></svg>
