<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">La matriz de variantes</title><desc id="d">Los flavors demo y field se cruzan con los tipos de build debug y release. Salen cuatro variantes: demoDebug con applicationId dev.bitacora.agro.demo.debug, fieldDebug con dev.bitacora.agro.debug, fieldRelease con dev.bitacora.agro, y demoRelease, que beforeVariants quita. field es la variante por defecto, la que miran lint y check.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<text x="250" y="40">debug</text><text class="s" x="250" y="58">.debug · -debug</text><text x="510" y="40">release</text><text class="s" x="510" y="58">firmada con la clave de subida</text>
<text x="25" y="115">demo</text><text class="s" x="25" y="133">.demo · -demo</text>
<text x="25" y="215">field</text><text class="s" x="25" y="233">isDefault = true</text>
<rect class="b" x="240" y="80" width="230" height="74" rx="8"/><text x="255" y="105">demoDebug</text><text class="s" x="255" y="125">dev.bitacora.agro.demo.debug</text><text class="s" x="255" y="142">1.0.0-demo-debug</text>
<rect class="r" x="500" y="80" width="240" height="74" rx="8"/><text x="515" y="105">demoRelease</text><text class="s" x="515" y="125">quitada con beforeVariants:</text><text class="s" x="515" y="142">la demo no se publica</text>
<rect class="g" x="240" y="180" width="230" height="74" rx="8"/><text x="255" y="205">fieldDebug</text><text class="s" x="255" y="225">dev.bitacora.agro.debug</text><text class="s" x="255" y="242">la que miran lint y check</text>
<rect class="f" x="500" y="180" width="240" height="74" rx="8"/><text x="515" y="205">fieldRelease</text><text class="s" x="515" y="225">dev.bitacora.agro</text><text class="s" x="515" y="242">1.0.0, la que se publica</text>
<rect class="o" x="15" y="272" width="730" height="44" rx="10"/><text x="30" y="292">Tareas: assembleFieldDebug, testFieldDebugUnitTest, lintFieldDebug.</text><text class="s" x="30" y="309">assembleDebug agrupa demoDebug y fieldDebug.</text></svg>
