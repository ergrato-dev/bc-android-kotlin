<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">La clave fuera del repositorio</title><desc id="d">La ruta del almacén y las contraseñas llegan a Gradle como propiedades, desde ~/.gradle/gradle.properties, desde -P en la terminal o desde variables de entorno ORG_GRADLE_PROJECT en la integración continua. El repositorio solo tiene los nombres de las propiedades. Con ellas, el release se firma con la clave de subida; sin ellas, sale sin firmar. Google Play comprueba la clave de subida y firma la app con su propia clave.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="15" y="20" width="240" height="50" rx="8"/><text x="30" y="42">~/.gradle/gradle.properties</text><text class="s" x="30" y="60">tu máquina</text>
<rect class="b" x="15" y="84" width="240" height="50" rx="8"/><text x="30" y="106">-PbitacoraStorePassword=…</text><text class="s" x="30" y="124">una vez, en la terminal</text>
<rect class="b" x="15" y="148" width="240" height="50" rx="8"/><text x="30" y="170">ORG_GRADLE_PROJECT_bitacora…</text><text class="s" x="30" y="188">secretos de la integración continua</text>
<rect class="f" x="295" y="70" width="190" height="80" rx="8"/><text x="310" y="96">signingConfigs</text><text class="s" x="310" y="116">providers.gradleProperty</text><text class="s" x="310" y="134">en el repositorio, solo nombres</text>
<path class="l" d="M255 45H275V95H290" marker-end="url(#a)"/><path class="l" d="M255 109H290" marker-end="url(#a)"/><path class="l" d="M255 173H275V125H290" marker-end="url(#a)"/>
<rect class="g" x="525" y="20" width="220" height="60" rx="8"/><text x="540" y="45">con las propiedades</text><text class="s" x="540" y="65">app-field-release.apk, firmada</text>
<rect class="r" x="525" y="100" width="220" height="60" rx="8"/><text x="540" y="125">sin ellas</text><text class="s" x="540" y="145">app-field-release-unsigned.apk</text>
<path class="l" d="M485 100H505V50H520" marker-end="url(#a)"/><path class="l" d="M485 120H505V130H520" marker-end="url(#a)"/>
<rect class="o" x="15" y="220" width="730" height="94" rx="10"/><text x="30" y="245">Google Play: tú firmas lo que subes con la clave de subida; Google firma la app con su clave.</text><text class="s" x="30" y="268">Si pierdes la clave de subida, Play Console la cambia y los usuarios no lo notan.</text><text class="s" x="30" y="288">apksigner verify --print-certs: con qué clave está firmado un APK.</text><text class="s" x="30" y="306">keytool -list -v: el SHA-256 del certificado de tu almacén, para compararlo.</text></svg>
