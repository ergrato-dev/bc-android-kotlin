<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 310" role="img" aria-labelledby="t d"><title id="t">Del objeto al JSON</title><desc id="d">Un objeto Kotlin pasa por Json y se convierte en texto. Los valores por defecto no se escriben, una propiedad con SerialName cambia de clave y una propiedad Transient no se escribe. Al leer, las claves que faltan toman su valor por defecto y las desconocidas se ignoran si se configura.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="10" y="15" width="270" height="215" rx="8"/><text x="25" y="42">objeto Kotlin</text>
<text class="s" x="25" y="72">sensor = "s1"</text><text class="s" x="25" y="98">value = 21.5</text><text class="s" x="25" y="124">unit = "C"   (por defecto)</text><text class="s" x="25" y="150">id con @SerialName("sensor_id")</text><text class="s" x="25" y="176">cache con @Transient</text>
<rect class="f" x="305" y="85" width="150" height="70" rx="8"/><text x="335" y="115">Json { }</text><text class="s" x="318" y="137">una sola instancia</text>
<path class="l" d="M280 120L303 120" marker-end="url(#a)"/><path class="l" d="M455 120L478 120" marker-end="url(#a)"/>
<rect class="g" x="480" y="15" width="270" height="215" rx="8"/><text x="495" y="42">texto JSON</text>
<text class="s" x="495" y="72">{"sensor":"s1",</text><text class="s" x="495" y="98">"value":21.5}</text><text class="s" x="495" y="130">unit no aparece: es el valor por</text><text class="s" x="495" y="150">defecto (encodeDefaults = false)</text><text class="s" x="495" y="180">cache no aparece: @Transient</text>
<text class="s" x="25" y="262">al LEER: lo que falta toma su valor por defecto; si es obligatorio, MissingFieldException</text><text class="s" x="25" y="284">claves de más: error, salvo ignoreUnknownKeys = true</text></svg>
