<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">Lambda con receptor y alcance</title><desc id="d">Tres bloques anidados. El bloque de logbookFile tiene como this un LogbookFileBuilder; dentro, el bloque de observation tiene como this un ObservationBuilder. Sin DslMarker, desde el bloque interior se podría llamar a observation del constructor exterior sin querer. Con DslMarker, el compilador lo prohíbe.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="10" y="15" width="480" height="300" rx="8"/><text x="25" y="42">logbookFile("agro") {      this = LogbookFileBuilder</text>
<rect class="g" x="40" y="70" width="420" height="150" rx="8"/><text x="55" y="97">observation("A-1") {      this = ObservationBuilder</text>
<text class="s" x="75" y="127">description = "Riego"      → this.description</text><text class="s" x="75" y="151">quantity = 3</text><text class="s" x="75" y="175">measure = 12.5</text><text x="55" y="206">}</text>
<text class="s" x="40" y="250">observation("A-2") { ... }      → this.observation</text><text x="25" y="296">}</text>
<rect class="r" x="515" y="15" width="235" height="300" rx="8"/><text x="530" y="42">@DslMarker</text><text class="s" x="530" y="70">dentro del bloque interior</text><text class="s" x="530" y="92">escribir observation("B") { }</text><text class="s" x="530" y="124">sin marcador: compila y añade</text><text class="s" x="530" y="146">B al constructor de fuera</text><text class="s" x="530" y="168">(un fallo silencioso)</text><text class="s" x="530" y="208">con marcador: error del</text><text class="s" x="530" y="230">compilador: cannot be called</text><text class="s" x="530" y="252">in this context by implicit</text><text class="s" x="530" y="274">receiver</text></svg>
