<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">Qué hace el plugin bitacora.build-info</title><desc id="d">El build del usuario escribe buildInfo con su dominio. La extensión guarda domain y version; version toma por defecto la versión del proyecto, de forma perezosa. La tarea generateBuildInfo recibe las dos propiedades como entradas y escribe build-info.properties en build/generated/build-info. Solo si el proyecto aplica java, esa carpeta se añade a los recursos de main y acaba en el jar.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="20" y="30" width="200" height="80" rx="8"/><text x="35" y="56">build.gradle.kts</text><text class="s" x="35" y="78">buildInfo {</text><text class="s" x="35" y="96">    domain = "agro" }</text>
<rect class="f" x="280" y="30" width="200" height="80" rx="8"/><text x="295" y="56">BuildInfoExtension</text><text class="s" x="295" y="78">domain: Property&lt;String&gt;</text><text class="s" x="295" y="96">version: convention(...)</text>
<rect class="g" x="540" y="30" width="200" height="80" rx="8"/><text x="555" y="56">generateBuildInfo</text><text class="s" x="555" y="78">@Input appVersion, domain</text><text class="s" x="555" y="96">@OutputDirectory outputDir</text>
<path class="l" d="M222 70H278" marker-end="url(#a)"/><path class="l" d="M482 70H538" marker-end="url(#a)"/><text class="s" x="488" y="60">set(...)</text>
<rect class="b" x="280" y="160" width="200" height="45" rx="8"/><text x="295" y="188">project.version</text>
<path class="l" d="M380 158V112" marker-end="url(#a)" stroke-dasharray="6 5"/><text class="s" x="390" y="140">perezoso: provider { }</text>
<rect class="g" x="540" y="160" width="200" height="60" rx="8"/><text x="555" y="185">build-info.properties</text><text class="s" x="555" y="206">build/generated/build-info</text>
<path class="l" d="M640 112V158" marker-end="url(#a)"/>
<rect class="f" x="540" y="250" width="200" height="60" rx="8"/><text x="555" y="275">recursos de main</text><text class="s" x="555" y="296">solo con withPlugin("java")</text>
<path class="l" d="M640 222V248" marker-end="url(#a)" stroke-dasharray="6 5"/></svg>
