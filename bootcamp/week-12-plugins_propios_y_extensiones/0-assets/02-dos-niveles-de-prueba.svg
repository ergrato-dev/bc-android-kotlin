<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Dos niveles de prueba de un plugin</title><desc id="d">Con ProjectBuilder el test crea un proyecto en memoria, aplica el plugin y comprueba que existen la extensión y la tarea y sus valores por defecto; no ejecuta tareas y es rápido. Con TestKit y withPluginClasspath el test escribe un build de prueba en una carpeta temporal y ejecuta Gradle de verdad: archivos generados, UP-TO-DATE, mensajes de error y caché de configuración; es lento. validatePlugins comprueba las anotaciones de las tareas y forma parte de build.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="o" x="15" y="15" width="355" height="215" rx="10"/><text x="30" y="40">ProjectBuilder (unitario)</text>
<rect class="g" x="35" y="60" width="315" height="150" rx="8"/><text x="50" y="86">proyecto en memoria</text><text class="s" x="50" y="110">aplica el plugin por su id</text><text class="s" x="50" y="130">¿existe buildInfo? ¿y generateBuildInfo?</text><text class="s" x="50" y="150">¿qué valor tiene version por defecto?</text><text class="s" x="50" y="178">no ejecuta tareas · milisegundos</text>
<rect class="o" x="390" y="15" width="355" height="215" rx="10"/><text x="405" y="40">TestKit (funcional)</text>
<rect class="b" x="410" y="60" width="315" height="150" rx="8"/><text x="425" y="86">Gradle de verdad, carpeta temporal</text><text class="s" x="425" y="110">withPluginClasspath: el plugin sin publicar</text><text class="s" x="425" y="130">archivo generado, UP-TO-DATE, errores</text><text class="s" x="425" y="150">caché de configuración</text><text class="s" x="425" y="178">ejecuta tareas · segundos</text>
<rect class="f" x="15" y="245" width="730" height="42" rx="8"/><text x="30" y="271">validatePlugins: comprueba las anotaciones de las tareas; ./gradlew build lo ejecuta (check)</text></svg>
