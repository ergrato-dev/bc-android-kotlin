<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 320" role="img" aria-labelledby="t d"><title id="t">Cómo encuentra Gradle un plugin publicado</title><desc id="d">El consumidor pide id bitacora.build-info versión 1.0.0. Gradle lo traduce a las coordenadas del marcador, bitacora.build-info:bitacora.build-info.gradle.plugin:1.0.0, y lo busca en los repositorios de pluginManagement. El marcador es un POM sin código que depende del artefacto real, dev.bitacora:build-info-plugin:1.0.0. Dentro de su jar, META-INF/gradle-plugins/bitacora.build-info.properties dice qué clase implementa el plugin: BuildInfoPlugin.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="20" y="30" width="305" height="70" rx="8"/><text x="35" y="56">consumer/build.gradle.kts</text><text class="s" x="35" y="80">id("bitacora.build-info") version "1.0.0"</text>
<rect class="f" x="380" y="30" width="360" height="70" rx="8"/><text x="395" y="56">marcador (POM, sin código)</text><text class="s" x="395" y="80">bitacora.build-info:bitacora.build-info.gradle.plugin:1.0.0</text>
<path class="l" d="M327 65H378" marker-end="url(#a)"/>
<rect class="g" x="380" y="140" width="360" height="70" rx="8"/><text x="395" y="166">artefacto (jar)</text><text class="s" x="395" y="190">dev.bitacora:build-info-plugin:1.0.0</text>
<path class="l" d="M560 102V138" marker-end="url(#a)"/><text class="s" x="570" y="125">depende de</text>
<rect class="g" x="380" y="245" width="360" height="60" rx="8"/><text x="395" y="268">META-INF/gradle-plugins/bitacora.build-info.properties</text><text class="s" x="395" y="290">implementation-class=BuildInfoPlugin</text>
<path class="l" d="M560 212V243" marker-end="url(#a)"/>
<rect class="o" x="20" y="140" width="305" height="165" rx="8"/><text x="35" y="166">pluginManagement</text><text class="s" x="35" y="190">repositories { maven { url = ... } }</text><text class="s" x="35" y="214">donde busca Gradle:</text><text class="s" x="35" y="234">solo los repositorios declarados</text><text class="s" x="35" y="254">(por defecto, el Plugin Portal)</text></svg>
