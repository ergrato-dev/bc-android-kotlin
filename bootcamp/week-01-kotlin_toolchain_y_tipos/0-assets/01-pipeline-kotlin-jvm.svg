<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" role="img" aria-labelledby="t d"><title id="t">Del código Kotlin a la ejecución en la JVM</title><desc id="d">Un archivo .kt pasa por el compilador de Kotlin y produce un .class de bytecode; la JVM lo carga, lo interpreta y compila las partes calientes a código máquina.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.s{font-size:12px;fill:#9aa4af}</style><rect id="bg" width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs><rect class="f" x="10" y="45" width="130" height="60" rx="8"/><text x="75" y="72" text-anchor="middle">Main.kt</text><text class="s" x="75" y="92" text-anchor="middle">código fuente</text><rect class="b" x="200" y="45" width="150" height="60" rx="8"/><text x="275" y="72" text-anchor="middle">kotlinc</text><text class="s" x="275" y="92" text-anchor="middle">compilador (K2)</text><rect class="f" x="410" y="45" width="130" height="60" rx="8"/><text x="475" y="72" text-anchor="middle">MainKt.class</text><text class="s" x="475" y="92" text-anchor="middle">bytecode</text><rect class="b" x="600" y="45" width="150" height="60" rx="8"/><text x="675" y="72" text-anchor="middle">JVM</text><text class="s" x="675" y="92" text-anchor="middle">interpreta + JIT</text><path d="M140 75H198M350 75H408M540 75H598" stroke="#9aa4af" stroke-width="2" marker-end="url(#a)"/><text class="s" x="380" y="145" text-anchor="middle">Gradle orquesta estos pasos: tú ejecutas ./gradlew build</text></svg>
