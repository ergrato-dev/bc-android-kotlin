<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 230" role="img" aria-labelledby="t d"><title id="t">Wrapper, daemon y grafo de tareas de Gradle</title><desc id="d">gradlew descarga la distribución fijada, arranca el daemon, que ejecuta las tareas compileKotlin, classes, compileTestKotlin, test y build en orden de dependencias.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.s{font-size:12px;fill:#9aa4af}</style><rect id="bg" width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs><rect class="f" x="10" y="20" width="150" height="55" rx="8"/><text x="85" y="45" text-anchor="middle">./gradlew</text><text class="s" x="85" y="63" text-anchor="middle">wrapper en tu repo</text><rect class="b" x="230" y="20" width="150" height="55" rx="8"/><text x="305" y="45" text-anchor="middle">Gradle 9.8.2</text><text class="s" x="305" y="63" text-anchor="middle">descargado + SHA-256</text><rect class="b" x="450" y="20" width="150" height="55" rx="8"/><text x="525" y="45" text-anchor="middle">daemon (JVM)</text><text class="s" x="525" y="63" text-anchor="middle">queda en memoria</text><path d="M160 48H228M380 48H448" stroke="#9aa4af" stroke-width="2" marker-end="url(#a)"/><rect class="f" x="10" y="140" width="120" height="50" rx="8"/><text x="70" y="170" text-anchor="middle">compileKotlin</text><rect class="f" x="160" y="140" width="100" height="50" rx="8"/><text x="210" y="170" text-anchor="middle">classes</text><rect class="f" x="290" y="140" width="150" height="50" rx="8"/><text x="365" y="170" text-anchor="middle">compileTestKotlin</text><rect class="f" x="470" y="140" width="90" height="50" rx="8"/><text x="515" y="170" text-anchor="middle">test</text><rect class="f" x="590" y="140" width="100" height="50" rx="8"/><text x="640" y="170" text-anchor="middle">build</text><path d="M130 165H158M260 165H288M440 165H468M560 165H588" stroke="#9aa4af" stroke-width="2" marker-end="url(#a)"/><path d="M525 75V138" stroke="#9aa4af" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/><text class="s" x="535" y="112">ejecuta el grafo</text></svg>
