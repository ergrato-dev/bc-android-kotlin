<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" role="img" aria-labelledby="t d"><title id="t">Tamaño de los tipos numéricos de Kotlin</title><desc id="d">Byte 1 byte, Short 2 bytes, Int 4 bytes, Long 8 bytes, Float 4 bytes y Double 8 bytes, con sus rangos.</desc><style>text{font:14px sans-serif;fill:#1b1b1b}.b{fill:#e8f0fe;stroke:#3b6fd4;stroke-width:2}.f{fill:#fff7e0;stroke:#c98a00;stroke-width:2}.s{font-size:12px;fill:#444}</style><text x="10" y="22">Cada cuadro pequeño = 1 byte</text><g class="b"><rect x="10" y="35" width="30" height="30"/></g><text x="55" y="55">Byte  · -128 a 127</text><g class="b"><rect x="10" y="75" width="30" height="30"/><rect x="40" y="75" width="30" height="30"/></g><text x="85" y="95">Short · -32 768 a 32 767</text><g class="b"><rect x="10" y="115" width="30" height="30"/><rect x="40" y="115" width="30" height="30"/><rect x="70" y="115" width="30" height="30"/><rect x="100" y="115" width="30" height="30"/></g><text x="145" y="135">Int · ±2 147 483 647 (el tipo por defecto)</text><g class="f"><rect x="10" y="155" width="30" height="30"/><rect x="40" y="155" width="30" height="30"/><rect x="70" y="155" width="30" height="30"/><rect x="100" y="155" width="30" height="30"/><rect x="130" y="155" width="30" height="30"/><rect x="160" y="155" width="30" height="30"/><rect x="190" y="155" width="30" height="30"/><rect x="220" y="155" width="30" height="30"/></g><text x="265" y="175">Long · ±9,2 × 10¹⁸ · Double usa también 8 bytes; Float, 4</text></svg>
