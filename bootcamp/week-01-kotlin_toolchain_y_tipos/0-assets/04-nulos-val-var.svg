<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" role="img" aria-labelledby="t d"><title id="t">val, var y tipos que admiten null</title><desc id="d">val no se reasigna, var sí. String no admite null; String? sí, y hay que tratarlo con ?., ?: o una comprobación antes de usarlo.</desc><style>text{font:14px monospace;fill:#1b1b1b}.b{fill:#e8f0fe;stroke:#3b6fd4;stroke-width:2}.f{fill:#fff7e0;stroke:#c98a00;stroke-width:2}.s{font:12px sans-serif;fill:#444}</style><rect class="b" x="10" y="15" width="355" height="75" rx="8"/><text x="25" y="42">val nombre = "Ada"</text><text x="25" y="65">nombre = "Bea"   // error</text><text class="s" x="25" y="82">val: una asignación y listo</text><rect class="f" x="395" y="15" width="355" height="75" rx="8"/><text x="410" y="42">var edad = 36</text><text x="410" y="65">edad = 37        // ok</text><text class="s" x="410" y="82">var: se puede reasignar</text><rect class="b" x="10" y="105" width="355" height="75" rx="8"/><text x="25" y="132">val a: String  = "x"</text><text x="25" y="155">a.length         // siempre seguro</text><text class="s" x="25" y="172">String nunca es null</text><rect class="f" x="395" y="105" width="355" height="75" rx="8"/><text x="410" y="132">val b: String? = null</text><text x="410" y="155">b?.length ?: 0   // 0</text><text class="s" x="410" y="172">String? obliga a decidir qué pasa con null</text></svg>
