# Ya está hecho: lo de las semanas anteriores. La app no usa AndroidX: solo la plataforma.
[versions]
agp = "9.4.1"
kotlin = "2.4.21"
junit = "6.1.3"
junit4 = "4.13.2"
robolectric = "4.17"
android-all = "16-robolectric-13921718-i7"
guava = "33.7.2-jre"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
android-all = { module = "org.robolectric:android-all-instrumented", version.ref = "android-all" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
