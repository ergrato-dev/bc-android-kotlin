<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">Certificate pinning</title><desc id="d">Arriba, sin pin: el certificado del servidor de verdad y uno emitido por error para el mismo dominio pasan los dos, porque los firma una CA de confianza. Abajo, con pin: además, el SHA-256 de la clave pública tiene que ser uno de los dos fijados, el del servidor o el de reserva; el otro falla con Pin verification failed. Tras la fecha de expiration, los pines dejan de comprobarse.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.h{font-weight:bold}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<text x="24" y="38" class="h">Sin pin</text>
<rect class="g" x="24" y="52" width="330" height="60" rx="10"/><text x="40" y="78">Certificado del servidor</text><text x="40" y="98" class="s">Firmado por una CA de confianza: pasa</text>
<rect class="r" x="400" y="52" width="336" height="60" rx="10"/><text x="416" y="78">Uno emitido por error, mismo dominio</text><text x="416" y="98" class="s">También firmado por una CA: pasa</text>
<text x="24" y="156" class="h">Con pin: CA + sha256(SPKI) en el pin-set</text>
<rect class="g" x="24" y="170" width="330" height="60" rx="10"/><text x="40" y="196">Clave de server/api.pem</text><text x="40" y="216" class="s">HjvVwpOM…: pasa</text>
<rect class="r" x="400" y="170" width="336" height="60" rx="10"/><text x="416" y="196">Otra clave</text><text x="416" y="216" class="s">SSLHandshakeException: Pin verification failed</text>
<rect class="f" x="24" y="248" width="330" height="60" rx="10"/><text x="40" y="274">Clave de reserva (server/backup.pem)</text><text x="40" y="294" class="s">G7HF5err…: sin usar; pasa el día que haga falta</text>
<rect class="b" x="400" y="248" width="336" height="60" rx="10"/><text x="416" y="274">expiration="2027-12-01"</text><text x="416" y="294" class="s">Después, sin pines: solo la CA</text>
</svg>
