<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">El token, cifrado con el Keystore</title><desc id="d">El token de 23 bytes entra en TokenStore, que lo cifra con AEAD y el contexto bitacora-token. La clave bitacora_token vive en el Keystore y no sale de él: la app solo le pide cifrar y descifrar. En files/token.bin quedan 51 bytes: 12 de nonce, 23 cifrados y 16 de etiqueta. Las copias de seguridad excluyen token.bin; el Keystore no viaja nunca.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.h{font-weight:bold}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="24" y="40" width="190" height="70" rx="10"/><text x="40" y="68" class="h">Token</text><text x="40" y="92" class="s">tk_4f9a2c7e1b0d5a8e3c6f · 23 B</text>
<rect class="g" x="280" y="40" width="200" height="100" rx="10"/><text x="296" y="68" class="h">TokenStore</text><text x="296" y="92" class="s">AEAD (AES-256-GCM)</text><text x="296" y="112" class="s">contexto "bitacora-token"</text><text x="296" y="130" class="s">null si no se abre</text>
<rect class="f" x="280" y="200" width="200" height="100" rx="10"/><text x="296" y="228" class="h">Keystore</text><text x="296" y="252" class="s">clave bitacora_token</text><text x="296" y="272" class="s">encoded = null: no sale</text><text x="296" y="292" class="s">no va en las copias</text>
<rect class="b" x="540" y="40" width="196" height="100" rx="10"/><text x="556" y="68" class="h">files/token.bin</text><text x="556" y="92" class="s">51 B = 12 nonce</text><text x="556" y="112" class="s">+ 23 cifrados + 16 etiqueta</text>
<rect class="r" x="540" y="200" width="196" height="100" rx="10"/><text x="556" y="228" class="h">Copias de seguridad</text><text x="556" y="252" class="s">exclude file/token.bin</text><text x="556" y="272" class="s">en otro móvil: sin clave,</text><text x="556" y="292" class="s">read() = null</text>
<path class="l" d="M214 75L278 85" marker-end="url(#a)"/><path class="l" d="M380 198L380 142" marker-end="url(#a)"/><path class="l" d="M480 90L538 90" marker-end="url(#a)"/><path class="l" d="M638 142L638 198" marker-end="url(#a)" stroke-dasharray="5 4"/>
</svg>
