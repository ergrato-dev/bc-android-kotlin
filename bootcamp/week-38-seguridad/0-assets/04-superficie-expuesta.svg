<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 340" role="img" aria-labelledby="t d"><title id="t">Lo que se puede abrir desde fuera</title><desc id="d">Otra app (o adb shell) llama a la app Alertas. En el starter abre DetailActivity con el código que quiera y hace que AlertReceiver publique una notificación falsa, porque los dos están exportados. En la solución solo entra por MainActivity; DetailActivity da Permission Denial, not exported. La notificación abre DetailActivity con un PendingIntent explícito e inmutable, con la identidad de la app.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.h{font-weight:bold}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="r" x="24" y="130" width="150" height="80" rx="10"/><text x="40" y="160" class="h">Otra app</text><text x="40" y="184" class="s">am start · am broadcast</text>
<rect class="g" x="260" y="24" width="220" height="60" rx="10"/><text x="276" y="50" class="h">MainActivity</text><text x="276" y="70" class="s">exported: el lanzador</text>
<rect class="r" x="260" y="120" width="220" height="70" rx="10"/><text x="276" y="146" class="h">DetailActivity</text><text x="276" y="166" class="s">starter: se abre con cualquier código</text><text x="276" y="182" class="s">solución: Permission Denial</text>
<rect class="r" x="260" y="226" width="220" height="70" rx="10"/><text x="276" y="252" class="h">AlertReceiver</text><text x="276" y="272" class="s">starter: publica la alerta X-9</text><text x="276" y="288" class="s">solución: no llega</text>
<rect class="b" x="540" y="120" width="196" height="100" rx="10"/><text x="556" y="146" class="h">Notificación</text><text x="556" y="170" class="s">PendingIntent explícito</text><text x="556" y="190" class="s">FLAG_IMMUTABLE</text><text x="556" y="210" class="s">con la identidad de la app</text>
<path class="l" d="M174 150L258 60" marker-end="url(#a)"/><path class="l" d="M174 170L258 158" marker-end="url(#a)" stroke-dasharray="5 4"/><path class="l" d="M174 190L258 258" marker-end="url(#a)" stroke-dasharray="5 4"/><path class="l" d="M538 170L482 158" marker-end="url(#a)"/>
</svg>
