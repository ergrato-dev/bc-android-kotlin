<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 360" role="img" aria-labelledby="t d"><title id="t">Network Security Config</title><desc id="d">Una petición de la app pasa por la configuración de red. Si es http, se corta con Cleartext HTTP traffic not permitted. Si es https a api.bitacora.example, se aplica su domain-config: CA del sistema y uno de los dos pines. A cualquier otro dominio, base-config: CA del sistema. Solo en la debug, debug-overrides añade las CA de la persona, sin pines.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.h{font-weight:bold}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="24" y="140" width="150" height="70" rx="10"/><text x="40" y="170" class="h">La app</text><text x="40" y="192" class="s">OkHttp · HttpURLConnection</text>
<rect class="r" x="250" y="24" width="230" height="70" rx="10"/><text x="266" y="52" class="h">http://</text><text x="266" y="76" class="s">Cleartext HTTP traffic … not permitted</text>
<rect class="g" x="250" y="124" width="230" height="90" rx="10"/><text x="266" y="152" class="h">domain-config</text><text x="266" y="174" class="s">api.bitacora.example</text><text x="266" y="194" class="s">CA del sistema + 1 de 2 pines</text>
<rect class="b" x="250" y="244" width="230" height="70" rx="10"/><text x="266" y="272" class="h">base-config</text><text x="266" y="294" class="s">Otros dominios (Maps): CA del sistema</text>
<rect class="f" x="540" y="124" width="196" height="120" rx="10"/><text x="556" y="152" class="h">debug-overrides</text><text x="556" y="176" class="s">Solo si es depurable</text><text x="556" y="198" class="s">+ CA de la persona (proxy)</text><text x="556" y="220" class="s">overridePins="true"</text>
<path class="l" d="M174 160L248 62" marker-end="url(#a)"/><path class="l" d="M174 172L248 170" marker-end="url(#a)"/><path class="l" d="M174 190L248 274" marker-end="url(#a)"/><path class="l" d="M538 184L482 172" marker-end="url(#a)" stroke-dasharray="5 4"/><path class="l" d="M538 220L482 274" marker-end="url(#a)" stroke-dasharray="5 4"/>
</svg>
