<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 340" role="img" aria-labelledby="t d"><title id="t">Las capas de la Bitácora con Room</title><desc id="d">En app, MainActivity pinta el estado de BitacoraViewModel, que pide un ObservationRepository y le manda la lista con save. AppModule crea la BitacoraDatabase con el builder de Android y el Context, y la entrega con @Singleton. En data, RoomObservationRepository traduce entre Observation y ObservationEntity y usa el ObservationDao, que lee con un Flow y escribe con replace en una transacción. Debajo, SQLite: el del sistema en el móvil, el empaquetado en los tests de la JVM. El Flow vuelve a emitir cada vez que cambia la tabla.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}.c{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 4}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="c" x="20" y="20" width="250" height="300" rx="10"/><text class="s" x="36" y="42">app (Android)</text>
<rect class="b" x="40" y="60" width="210" height="56" rx="8"/><text x="56" y="84">MainActivity</text><text class="s" x="56" y="104">espera a loaded</text>
<rect class="b" x="40" y="150" width="210" height="56" rx="8"/><text x="56" y="174">BitacoraViewModel</text><text class="s" x="56" y="194">pide un ObservationRepository</text>
<rect class="f" x="40" y="240" width="210" height="60" rx="8"/><text x="56" y="264">AppModule</text><text class="s" x="56" y="286">builder de Android, @Singleton</text>
<rect class="c" x="300" y="20" width="440" height="220" rx="10"/><text class="s" x="316" y="42">data (JVM, sin Android)</text>
<rect class="g" x="320" y="60" width="200" height="70" rx="8"/><text x="336" y="84">RoomObservation</text><text x="336" y="102">Repository</text><text class="s" x="336" y="122">Observation ↔ Entity</text>
<rect class="g" x="540" y="60" width="180" height="70" rx="8"/><text x="556" y="84">ObservationDao</text><text class="s" x="556" y="104">all(): Flow</text><text class="s" x="556" y="122">replace(): @Transaction</text>
<rect class="g" x="320" y="160" width="400" height="60" rx="8"/><text x="336" y="184">BitacoraDatabase · ObservationEntity</text><text class="s" x="336" y="204">version = 1 · bitacora(): IO e importar el JSON al crear</text>
<rect class="r" x="300" y="260" width="440" height="60" rx="8"/><text x="316" y="284">SQLite</text><text class="s" x="316" y="304">móvil: el del sistema · tests de la JVM: el empaquetado</text>
<path class="l" d="M145 150V116" marker-end="url(#a)"/><text class="s" x="152" y="138">estado</text>
<path class="l" d="M250 170H320" marker-end="url(#a)"/><text class="s" x="262" y="162">save</text>
<path class="l" d="M320 112C290 112 280 190 250 192" marker-end="url(#a)"/><text class="s" x="258" y="226">Flow</text>
