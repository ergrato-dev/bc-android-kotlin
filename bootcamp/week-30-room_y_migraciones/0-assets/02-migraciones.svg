<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Las versiones de la libreta</title><desc id="d">Cuatro versiones de la tabla items, cada una con su esquema en schemas. De la 1 a la 2, AutoMigration añade quantity con defaultValue 1. De la 2 a la 3, AutoMigration con el spec @RenameColumn cambia trip por tripName. De la 3 a la 4, MIGRATION_3_4, a mano en SQL, añade status, lo rellena a partir de packed y borra packed. Room encadena las que haga falta, desde la versión que tenga el archivo, y después comprueba las tablas contra el esquema de la última.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}.c{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 4}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="20" y="40" width="160" height="150" rx="8"/><text x="36" y="64">versión 1</text><text class="s" x="36" y="88">1.json</text><text class="s" x="36" y="116">id, trip, name,</text><text class="s" x="36" y="136">packed</text>
<rect class="b" x="210" y="40" width="160" height="150" rx="8"/><text x="226" y="64">versión 2</text><text class="s" x="226" y="88">2.json</text><text class="s" x="226" y="116">id, trip, name,</text><text class="s" x="226" y="136">packed, quantity</text>
<rect class="b" x="400" y="40" width="160" height="150" rx="8"/><text x="416" y="64">versión 3</text><text class="s" x="416" y="88">3.json</text><text class="s" x="416" y="116">id, tripName, name,</text><text class="s" x="416" y="136">packed, quantity</text>
<rect class="b" x="590" y="40" width="150" height="150" rx="8"/><text x="606" y="64">versión 4</text><text class="s" x="606" y="88">4.json</text><text class="s" x="606" y="116">id, tripName, name,</text><text class="s" x="606" y="136">quantity, status</text>
<path class="l" d="M180 115H210" marker-end="url(#a)"/><path class="l" d="M370 115H400" marker-end="url(#a)"/><path class="l" d="M560 115H590" marker-end="url(#a)"/>
<rect class="g" x="20" y="210" width="230" height="70" rx="8"/><text x="36" y="234">1 → 2: AutoMigration</text><text class="s" x="36" y="256">columna nueva, defaultValue = "1"</text>
<rect class="g" x="265" y="210" width="230" height="70" rx="8"/><text x="281" y="234">2 → 3: AutoMigration + spec</text><text class="s" x="281" y="256">@RenameColumn(trip, tripName)</text>
<rect class="f" x="510" y="210" width="230" height="70" rx="8"/><text x="526" y="234">3 → 4: MIGRATION_3_4</text><text class="s" x="526" y="256">SQL a mano: ADD, UPDATE, DROP</text>
<text class="s" x="20" y="24">Room encadena desde la versión del archivo y comprueba las tablas contra el último esquema</text>
</svg>
