<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 260" role="img" aria-labelledby="t d"><title id="t">Verificar un artefacto</title><desc id="d">Cada archivo que Gradle descarga o usa de su caché, jar, pom o module, también de los plugins, se compara con el sha256 apuntado en gradle/verification-metadata.xml, que está en el repositorio. Si coincide, se usa. Si no coincide o no está apuntado, el build falla con Dependency verification failed antes de usarlo. El archivo lo genera Gradle con --write-verification-metadata sha256 y se revisa en el pull request.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="15" y="30" width="200" height="70" rx="8"/><text x="30" y="55">Maven Central /</text><text x="30" y="75">Plugin Portal</text><text class="s" x="30" y="92">jar, pom, module</text>
<path class="l" d="M215 65H265" marker-end="url(#a)"/>
<rect class="f" x="270" y="30" width="200" height="70" rx="8"/><text x="285" y="55">sha256 del archivo</text><text class="s" x="285" y="77">calculado al usarlo</text><text class="s" x="285" y="92">(también desde la caché)</text>
<rect class="o" x="270" y="125" width="200" height="110" rx="10"/><text x="285" y="150">verification-metadata.xml</text><text class="s" x="285" y="172">en gradle/, en el repositorio</text><text class="s" x="285" y="192">lo genera --write-verification-</text><text class="s" x="285" y="208">metadata sha256; se revisa</text><text class="s" x="285" y="224">en el pull request</text>
<path class="l" d="M370 100V120" marker-end="url(#a)"/>
<path class="l" d="M470 65H565" marker-end="url(#a)"/><text class="s" x="478" y="57">coincide</text>
<path class="l" d="M470 180H565" marker-end="url(#a)"/><text class="s" x="478" y="172">distinto o</text><text class="s" x="478" y="200">no apuntado</text>
<rect class="g" x="570" y="30" width="175" height="70" rx="8"/><text x="585" y="58">se usa</text><text class="s" x="585" y="80">el build sigue</text>
<rect class="r" x="570" y="140" width="175" height="80" rx="8"/><text x="585" y="165">Dependency</text><text x="585" y="185">verification failed</text><text class="s" x="585" y="205">antes de usarlo</text></svg>
