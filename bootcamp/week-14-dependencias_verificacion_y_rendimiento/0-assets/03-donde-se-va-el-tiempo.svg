<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 250" role="img" aria-labelledby="t d"><title id="t">Dónde se va el tiempo de un build</title><desc id="d">Un build tiene tres fases: inicialización, configuración y ejecución. --profile mide cada una. La caché de configuración se salta la configuración cuando nada de lo que la afecta ha cambiado. En la ejecución, org.gradle.parallel ejecuta a la vez tareas de proyectos distintos que no dependen entre sí, UP-TO-DATE evita repetir trabajo y la caché de build trae salidas ya calculadas.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="15" y="30" width="170" height="70" rx="8"/><text x="30" y="55">inicialización</text><text class="s" x="30" y="77">settings.gradle.kts,</text><text class="s" x="30" y="92">builds incluidos</text>
<path class="l" d="M185 65H215" marker-end="url(#a)"/>
<rect class="b" x="220" y="30" width="220" height="70" rx="8"/><text x="235" y="55">configuración</text><text class="s" x="235" y="77">scripts y plugins de cada</text><text class="s" x="235" y="92">proyecto: el grafo de tareas</text>
<path class="l" d="M440 65H470" marker-end="url(#a)"/>
<rect class="b" x="475" y="30" width="270" height="70" rx="8"/><text x="490" y="55">ejecución</text><text class="s" x="490" y="77">las acciones de las tareas</text><text class="s" x="490" y="92">del grafo</text>
<rect class="g" x="220" y="120" width="220" height="70" rx="8"/><text x="235" y="145">caché de configuración</text><text class="s" x="235" y="167">se salta la fase entera si</text><text class="s" x="235" y="182">no cambia nada que la afecte</text>
<rect class="g" x="475" y="120" width="270" height="70" rx="8"/><text x="490" y="145">parallel · UP-TO-DATE · caché</text><text class="s" x="490" y="167">a la vez, sin repetir,</text><text class="s" x="490" y="182">o con salidas ya calculadas</text>
<path class="l" d="M330 100V115" marker-end="url(#a)"/><path class="l" d="M610 100V115" marker-end="url(#a)"/>
<rect class="f" x="15" y="205" width="730" height="35" rx="8"/><text x="30" y="228">--profile: cuánto tarda cada fase y cada tarea · build/reports/profile/profile-&lt;fecha&gt;.html</text></svg>
