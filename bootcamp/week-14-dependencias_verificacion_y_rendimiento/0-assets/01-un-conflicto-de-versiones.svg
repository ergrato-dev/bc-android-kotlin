<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 290" role="img" aria-labelledby="t d"><title id="t">Un conflicto de versiones</title><desc id="d">El build pide kotlin-stdlib 2.4.21 a través del plugin de Kotlin; kotlinx-coroutines-core 1.11.0 pide la 2.2.20 y kotlinx-serialization-json 1.12.0 la 2.4.10. Solo puede haber una versión de cada módulo en el classpath: Gradle elige la más alta, 2.4.21, y dependencyInsight lo explica como By conflict resolution. Una restricción con because puede subir una transitiva, como org.jetbrains:annotations de 23.0.0 a 26.1.0.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="15" y="20" width="230" height="50" rx="8"/><text x="30" y="42">el build (plugin de Kotlin)</text><text class="s" x="30" y="60">pide kotlin-stdlib 2.4.21</text>
<rect class="b" x="15" y="85" width="230" height="50" rx="8"/><text x="30" y="107">kotlinx-coroutines-core 1.11.0</text><text class="s" x="30" y="125">pide kotlin-stdlib 2.2.20</text>
<rect class="b" x="15" y="150" width="230" height="50" rx="8"/><text x="30" y="172">kotlinx-serialization-json 1.12.0</text><text class="s" x="30" y="190">pide kotlin-stdlib 2.4.10</text>
<path class="l" d="M245 45L330 100" marker-end="url(#a)"/><path class="l" d="M245 110H330" marker-end="url(#a)"/><path class="l" d="M245 175L330 120" marker-end="url(#a)"/>
<rect class="f" x="335" y="80" width="170" height="60" rx="8"/><text x="350" y="104">un módulo,</text><text x="350" y="124">una versión</text>
<path class="l" d="M505 110H555" marker-end="url(#a)"/>
<rect class="g" x="560" y="70" width="185" height="80" rx="8"/><text x="575" y="95">kotlin-stdlib 2.4.21</text><text class="s" x="575" y="115">la más alta</text><text class="s" x="575" y="133">By conflict resolution</text>
<rect class="o" x="15" y="220" width="730" height="55" rx="10"/><text x="30" y="243">constraints { implementation("org.jetbrains:annotations:26.1.0") { because("...") } }</text><text class="s" x="30" y="263">no añade la dependencia: participa en el conflicto si alguien la trae. 23.0.0 -&gt; 26.1.0, By constraint</text></svg>
