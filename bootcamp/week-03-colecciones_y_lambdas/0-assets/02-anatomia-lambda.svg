<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="t d"><title id="t">Anatomía de una lambda</title><desc id="d">Un tipo de función (Int) -&gt; Int, una lambda con parámetro explícito, con it, y la lambda final fuera de los paréntesis.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.s{font-size:12px;fill:#9aa4af}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs><rect class="b" x="10" y="15" width="740" height="55" rx="8"/><text x="25" y="40">val doble: (Int) -&gt; Int = { x -&gt; x * 2 }</text><text class="s" x="25" y="60">tipo de función: (parámetros) -&gt; resultado · lambda: { parámetros -&gt; cuerpo }; la última expresión es el valor</text><rect class="b" x="10" y="85" width="740" height="55" rx="8"/><text x="25" y="110">val doble: (Int) -&gt; Int = { it * 2 }</text><text class="s" x="25" y="130">con un solo parámetro puedes omitirlo y usar it</text><rect class="f" x="10" y="155" width="740" height="55" rx="8"/><text x="25" y="180">lista.filter { it &gt; 3 }.map { it * 2 }</text><text class="s" x="25" y="200">si la lambda es el último argumento va fuera de los paréntesis; si es el único, se omiten los paréntesis</text></svg>
