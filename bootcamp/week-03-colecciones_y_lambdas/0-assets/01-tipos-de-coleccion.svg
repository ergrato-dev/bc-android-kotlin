<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 250" role="img" aria-labelledby="t d"><title id="t">List, Set y Map</title><desc id="d">List conserva el orden y admite repetidos; Set no admite repetidos; Map asocia claves únicas con valores. Cada una existe en versión de solo lectura y en versión mutable.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.s{font-size:12px;fill:#9aa4af}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs><rect class="b" x="10" y="15" width="235" height="150" rx="8"/><text x="25" y="42">List&lt;T&gt;</text><text class="s" x="25" y="62">orden fijo, admite repetidos</text><text class="s" x="25" y="86">listOf(3, 1, 3)</text><g class="f"><rect x="25" y="105" width="40" height="30"/><rect x="65" y="105" width="40" height="30"/><rect x="105" y="105" width="40" height="30"/></g><text x="39" y="125">3</text><text x="79" y="125">1</text><text x="119" y="125">3</text><text class="s" x="25" y="155">lista[0] = 3</text><rect class="b" x="262" y="15" width="235" height="150" rx="8"/><text x="277" y="42">Set&lt;T&gt;</text><text class="s" x="277" y="62">sin repetidos</text><text class="s" x="277" y="86">setOf(3, 1, 3)</text><g class="f"><rect x="277" y="105" width="40" height="30"/><rect x="317" y="105" width="40" height="30"/></g><text x="291" y="125">3</text><text x="331" y="125">1</text><text class="s" x="277" y="155">3 in conjunto = true</text><rect class="b" x="515" y="15" width="235" height="150" rx="8"/><text x="530" y="42">Map&lt;K, V&gt;</text><text class="s" x="530" y="62">clave única -&gt; valor</text><text class="s" x="530" y="86">mapOf("a" to 1)</text><g class="f"><rect x="530" y="105" width="95" height="30"/><rect x="625" y="105" width="95" height="30"/></g><text x="548" y="125">"a"  -&gt;  1</text><text x="640" y="125">"b" -&gt; 2</text><text class="s" x="530" y="155">mapa["a"] = 1</text><rect class="f" x="10" y="185" width="740" height="50" rx="8"/><text x="25" y="208">listOf, setOf, mapOf: solo lectura.   mutableListOf, mutableSetOf, mutableMapOf: admiten add, remove y put.</text><text class="s" x="25" y="226">Por defecto, pide y devuelve la versión de solo lectura.</text></svg>
