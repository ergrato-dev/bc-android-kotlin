<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 230" role="img" aria-labelledby="t d"><title id="t">Un pipeline de transformaciones</title><desc id="d">La lista [1,2,3,4,5,6] pasa por filter para quedarse con los pares [2,4,6], por map para elevar al cuadrado [4,16,36] y por sum para dar 56.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.s{font-size:12px;fill:#9aa4af}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs><defs></defs><rect class="f" x="10" y="35" width="170" height="60" rx="8"/><text x="95" y="62" text-anchor="middle">1, 2, 3, 4, 5, 6</text><text class="s" x="95" y="82" text-anchor="middle">List&lt;Int&gt;</text><rect class="b" x="210" y="35" width="150" height="60" rx="8"/><text x="285" y="62" text-anchor="middle">filter { it % 2 == 0 }</text><text class="s" x="285" y="82" text-anchor="middle">se queda con los pares</text><rect class="b" x="390" y="35" width="150" height="60" rx="8"/><text x="465" y="62" text-anchor="middle">map { it * it }</text><text class="s" x="465" y="82" text-anchor="middle">transforma cada uno</text><rect class="b" x="570" y="35" width="90" height="60" rx="8"/><text x="615" y="70" text-anchor="middle">sum()</text><rect class="f" x="685" y="35" width="65" height="60" rx="8"/><text x="717" y="70" text-anchor="middle">56</text><path d="M180 65H208M360 65H388M540 65H568M660 65H683" stroke="#9aa4af" stroke-width="2" marker-end="url(#a)"/><text class="s" x="285" y="125" text-anchor="middle">2, 4, 6</text><text class="s" x="465" y="125" text-anchor="middle">4, 16, 36</text><text class="s" x="615" y="125" text-anchor="middle">4 + 16 + 36</text><text x="15" y="185">Cada paso crea una colección nueva; la original no cambia.</text><text class="s" x="15" y="206">Con colecciones muy grandes y muchos pasos, asSequence() evita las colecciones intermedias.</text></svg>
