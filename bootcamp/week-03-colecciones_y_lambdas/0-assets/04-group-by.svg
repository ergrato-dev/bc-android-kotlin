<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="t d"><title id="t">groupBy</title><desc id="d">Una lista de observaciones se agrupa por nivel y produce un mapa de nivel a lista de observaciones.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.s{font-size:12px;fill:#9aa4af}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs><rect class="f" x="10" y="20" width="200" height="170" rx="8"/><text x="25" y="46">lista de observaciones</text><text class="s" x="25" y="72">A · 5.0</text><text class="s" x="25" y="94">B · 20.0</text><text class="s" x="25" y="116">C · 60.0</text><text class="s" x="25" y="138">D · 20.0</text><text class="s" x="25" y="160">E · 2.0</text><rect class="b" x="260" y="70" width="190" height="60" rx="8"/><text x="355" y="96" text-anchor="middle">groupBy</text><text class="s" x="355" y="116" text-anchor="middle">{ level(it.measure) }</text><path d="M210 100H258M450 100H498" stroke="#9aa4af" stroke-width="2" marker-end="url(#a)"/><rect class="b" x="500" y="20" width="250" height="170" rx="8"/><text x="515" y="46">Map&lt;String, List&lt;Observation&gt;&gt;</text><text class="s" x="515" y="76">"LOW"    -&gt; [A, E]</text><text class="s" x="515" y="100">"MEDIUM" -&gt; [B, D]</text><text class="s" x="515" y="124">"HIGH"   -&gt; [C]</text><text class="s" x="515" y="160">la clave la calcula tu lambda</text></svg>
