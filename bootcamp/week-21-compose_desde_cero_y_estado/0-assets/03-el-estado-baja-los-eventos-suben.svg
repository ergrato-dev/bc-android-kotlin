<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">El estado baja, los eventos suben</title><desc id="d">El ViewModel guarda el estado en el SavedStateHandle y lo publica como StateFlow. DraftRoute lo recoge con collectAsStateWithLifecycle y se lo pasa a DraftScreen, que no tiene estado; DraftScreen pasa el nivel a LevelPicker. Los eventos suben al revés: LevelPicker llama a onSelect, DraftScreen a onLevelChange, y DraftRoute lo convierte en una llamada a una función del ViewModel, que escribe en el handle. Solo hay una copia de cada dato.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}.k{stroke:#3fb950;stroke-width:2;fill:none}.e{stroke:#d29922;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="g" x="20" y="30" width="230" height="90" rx="8"/><text x="35" y="58">DraftViewModel</text><text class="s" x="35" y="80">handle: "text", "level", "saved"</text><text class="s" x="35" y="97">state: StateFlow&lt;DraftUiState&gt;</text><text class="s" x="35" y="112">onLevelChange(level)</text>
<rect class="b" x="20" y="160" width="230" height="70" rx="8"/><text x="35" y="188">DraftRoute</text><text class="s" x="35" y="210">collectAsStateWithLifecycle()</text>
<rect class="b" x="290" y="160" width="210" height="70" rx="8"/><text x="305" y="188">DraftScreen</text><text class="s" x="305" y="210">sin estado: state, lambdas</text>
<rect class="b" x="540" y="160" width="200" height="70" rx="8"/><text x="555" y="188">LevelPicker</text><text class="s" x="555" y="210">sin estado: selected, onSelect</text>
<path class="k" d="M110 120V155" marker-end="url(#a)"/><path class="k" d="M250 180H285" marker-end="url(#a)"/><path class="k" d="M500 180H535" marker-end="url(#a)"/>
<path class="e" d="M535 215H505" marker-end="url(#a)"/><path class="e" d="M285 215H255" marker-end="url(#a)"/><path class="e" d="M160 160V125" marker-end="url(#a)"/>
<text class="s" x="270" y="60" style="fill:#3fb950">el estado baja: parámetros</text><text class="s" x="270" y="80" style="fill:#d29922">los eventos suben: lambdas</text><text class="s" x="270" y="100">onSelect, onLevelChange, viewModel::onLevelChange</text>
<rect class="o" x="20" y="255" width="720" height="60" rx="10"/><text x="35" y="280">Una sola copia de cada dato. Los composables sin estado se prueban solos, con un estado de mentira y lambdas.</text><text class="s" x="35" y="301">Si LevelPicker guardara su propio nivel con remember, habría dos copias: al guardar, la pantalla lo vacía y él sigue marcado.</text></svg>
