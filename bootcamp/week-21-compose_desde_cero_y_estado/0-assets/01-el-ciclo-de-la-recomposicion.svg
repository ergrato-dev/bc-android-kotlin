<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">El ciclo de la recomposición</title><desc id="d">Un estado de Compose, creado con mutableStateOf y guardado con remember, lo lee un composable, que pinta la pantalla. Un clic del usuario llama a una lambda que escribe el estado. Escribirlo programa una recomposición: Compose vuelve a llamar a los composables que lo leyeron, con el valor nuevo. Sin remember, la recomposición crea el estado otra vez, con el valor inicial.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}.k{stroke:#3fb950;stroke-width:2;fill:none}.e{stroke:#d29922;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="g" x="20" y="40" width="200" height="80" rx="8"/><text x="35" y="68">Estado</text><text class="s" x="35" y="90">var n by remember {</text><text class="s" x="35" y="107">  mutableIntStateOf(0) }</text>
<rect class="b" x="280" y="40" width="200" height="80" rx="8"/><text x="295" y="68">Composable</text><text class="s" x="295" y="90">Text("Guardadas: $n")</text><text class="s" x="295" y="107">lee n: depende de n</text>
<rect class="b" x="540" y="40" width="200" height="80" rx="8"/><text x="555" y="68">Pantalla</text><text class="s" x="555" y="90">Guardadas: 0</text><text class="s" x="555" y="107">lo que ve el usuario</text>
<path class="l" d="M220 80H275" marker-end="url(#a)"/><path class="l" d="M480 80H535" marker-end="url(#a)"/>
<rect class="f" x="540" y="160" width="200" height="70" rx="8"/><text x="555" y="188">Evento</text><text class="s" x="555" y="210">clic en Guardar</text>
<rect class="f" x="280" y="160" width="200" height="70" rx="8"/><text x="295" y="188">Lambda</text><text class="s" x="295" y="210">onClick = { n++ }</text>
<path class="l" d="M640 120V155" marker-end="url(#a)"/><path class="l" d="M540 195H485" marker-end="url(#a)"/><path class="l" d="M280 195H120V125" marker-end="url(#a)"/>
<text class="s" x="130" y="150">escribe n:</text><text class="s" x="130" y="167">programa la</text><text class="s" x="130" y="184">recomposición</text>
<rect class="r" x="20" y="255" width="720" height="60" rx="8"/><text x="35" y="280">Sin remember, la recomposición vuelve a ejecutar mutableIntStateOf(0): el estado nace otra vez a 0.</text><text class="s" x="35" y="301">Lint lo para: UnrememberedMutableState. Con remember, el estado vive en la composición, hasta que la actividad se destruye.</text></svg>
