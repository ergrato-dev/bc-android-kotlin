<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">Un toque en Actualizar</title><desc id="d">Secuencia en cinco columnas: pantalla, reducer, ViewModel, repositorio y Room con el servidor. 1, la pantalla manda el intent Refresh. 2, el reducer pone refreshing a true y el botón se desactiva; un segundo Refresh no cambia nada. 3, como refreshing ha pasado de false a true, el ViewModel lanza repository.refresh() en viewModelScope. 4, el repositorio hace el GET al servidor y escribe lo recibido en Room con upsert. 5, el Flow de Room emite la lista nueva y llega a la pantalla. 6, refresh devuelve un RefreshResult, que vuelve como el intent Refreshed. 7, el reducer quita refreshing y emite el efecto ShowRefresh, que la pantalla enseña en un aviso, una sola vez.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}.c{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 4}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="20" y="20" width="130" height="40" rx="8"/><text x="36" y="45">Pantalla</text>
<rect class="b" x="170" y="20" width="130" height="40" rx="8"/><text x="186" y="45">reduce</text>
<rect class="b" x="320" y="20" width="130" height="40" rx="8"/><text x="336" y="45">ViewModel</text>
<rect class="g" x="470" y="20" width="130" height="40" rx="8"/><text x="486" y="45">Repositorio</text>
<rect class="r" x="620" y="20" width="120" height="40" rx="8"/><text x="636" y="45">Servidor · Room</text>
<path class="c" d="M85 60V400"/><path class="c" d="M235 60V400"/><path class="c" d="M385 60V400"/><path class="c" d="M535 60V400"/><path class="c" d="M680 60V400"/>
<path class="l" d="M85 90H235" marker-end="url(#a)"/><text class="s" x="92" y="84">1 Refresh</text>
<text class="s" x="242" y="118">2 refreshing = true</text>
<path class="l" d="M235 140H385" marker-end="url(#a)"/><text class="s" x="242" y="134">3 de false a true</text>
<path class="l" d="M385 170H535" marker-end="url(#a)"/><text class="s" x="392" y="164">refresh()</text>
<path class="l" d="M535 200H680" marker-end="url(#a)"/><text class="s" x="542" y="194">4 GET</text>
<path class="l" d="M680 230H535" marker-end="url(#a)"/><text class="s" x="542" y="224">las del equipo</text>
<path class="l" d="M535 260H680" marker-end="url(#a)"/><text class="s" x="542" y="254">upsert</text>
<path class="l" d="M680 290H85" marker-end="url(#a)"/><text class="s" x="92" y="284">5 Flow: la lista nueva</text>
<path class="l" d="M535 320H385" marker-end="url(#a)"/><text class="s" x="392" y="314">6 RefreshResult</text>
<path class="l" d="M385 345H235" marker-end="url(#a)"/><text class="s" x="242" y="339">Refreshed</text>
<path class="l" d="M235 375H85" marker-end="url(#a)"/><text class="s" x="92" y="369">7 ShowRefresh</text>
<text class="s" x="92" y="395">refreshing = false · aviso, una vez</text>
</svg>
