<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 380" role="img" aria-labelledby="t d"><title id="t">Las capas de la Bitácora con la red</title><desc id="d">En app, BitacoraViewModel pide refresh al ObservationRepository. AppModule crea con @Singleton el HttpClient que usa ObservationApi, con el motor de OkHttp y la URL del flavor (BuildConfig.API_URL), y la BitacoraDatabase. En data, RoomObservationRepository llama a ObservationApi, que hace un GET al servidor con el HttpClient y traduce RemoteObservation a Observation; lo recibido se escribe con upsert en Room. La pantalla no recibe la lista de la red: el Flow de Room la emite, como cualquier otro cambio.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}.c{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 4}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="c" x="20" y="20" width="250" height="340" rx="10"/><text class="s" x="36" y="42">app (Android)</text>
<rect class="b" x="40" y="60" width="210" height="56" rx="8"/><text x="56" y="84">BitacoraViewModel</text><text class="s" x="56" y="104">Refresh, Refreshed</text>
<rect class="f" x="40" y="200" width="210" height="140" rx="8"/><text x="56" y="224">AppModule</text><text class="s" x="56" y="248">@Singleton HttpClient</text><text class="s" x="56" y="268">motor: OkHttp</text><text class="s" x="56" y="288">URL: BuildConfig.API_URL</text><text class="s" x="56" y="316">@Singleton BitacoraDatabase</text>
<rect class="c" x="290" y="20" width="300" height="340" rx="10"/><text class="s" x="306" y="42">data (JVM, sin motor)</text>
<rect class="b" x="310" y="60" width="260" height="56" rx="8"/><text x="326" y="84">RoomObservationRepository</text><text class="s" x="326" y="104">refresh(): RefreshResult</text>
<rect class="g" x="420" y="150" width="150" height="76" rx="8"/><text x="434" y="174">ObservationApi</text><text class="s" x="434" y="194">RemoteObservation</text><text class="s" x="434" y="212">→ Observation</text>
<rect class="g" x="310" y="280" width="260" height="56" rx="8"/><text x="326" y="304">Room (ObservationDao)</text><text class="s" x="326" y="324">upsert · Flow de all()</text>
<rect class="r" x="610" y="160" width="130" height="56" rx="8"/><text x="626" y="184">Servidor</text><text class="s" x="626" y="204">GET observations</text>
<path class="l" d="M250 80H310" marker-end="url(#a)"/><text class="s" x="258" y="72">refresh</text>
<path class="l" d="M495 116V150" marker-end="url(#a)"/>
<path class="l" d="M570 188H610" marker-end="url(#a)"/>
<path class="l" d="M360 116V280" marker-end="url(#a)"/><text class="s" x="368" y="250">upsert</text>
<path class="l" d="M310 320H280V100H250" marker-end="url(#a)"/><text class="s" x="140" y="150">Flow: la lista nueva</text>
</svg>
