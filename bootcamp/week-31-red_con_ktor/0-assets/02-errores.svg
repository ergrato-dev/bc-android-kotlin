<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 400" role="img" aria-labelledby="t d"><title id="t">De las excepciones a los errores de la app</title><desc id="d">toNetworkError mira las excepciones en orden. Primero los tiempos agotados: HttpRequestTimeoutException, ConnectTimeoutException y SocketTimeoutException dan TIMEOUT. Después, cualquier otra IOException, como ConnectException, da OFFLINE; los tiempos agotados también son IOException, por eso van antes. ClientRequestException (4xx) y ServerResponseException (5xx), que son ResponseException, dan SERVER. JsonConvertException y NoTransformationFoundException dan BAD_RESPONSE. Cualquier otra cosa, incluida CancellationException, da null y se relanza.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}.c{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 4}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<text x="20" y="40">toNetworkError(), de arriba abajo: la primera que encaja</text>
<rect class="b" x="20" y="60" width="420" height="56" rx="8"/><text x="36" y="84">HttpRequestTimeoutException</text><text class="s" x="36" y="104">ConnectTimeoutException · SocketTimeoutException</text>
<rect class="b" x="20" y="130" width="420" height="56" rx="8"/><text x="36" y="154">IOException</text><text class="s" x="36" y="174">ConnectException, sin red (los tiempos también lo son)</text>
<rect class="b" x="20" y="200" width="420" height="56" rx="8"/><text x="36" y="224">ResponseException (con expectSuccess)</text><text class="s" x="36" y="244">ClientRequestException 4xx · ServerResponseException 5xx</text>
<rect class="b" x="20" y="270" width="420" height="56" rx="8"/><text x="36" y="294">ContentConvertException</text><text class="s" x="36" y="314">JsonConvertException · NoTransformationFoundException</text>
<rect class="r" x="20" y="340" width="420" height="48" rx="8"/><text x="36" y="362">Lo demás, y CancellationException</text><text class="s" x="36" y="380">un fallo nuestro, o cerrar la pantalla</text>
<rect class="g" x="520" y="64" width="210" height="48" rx="8"/><text x="536" y="94">TIMEOUT</text>
<rect class="g" x="520" y="134" width="210" height="48" rx="8"/><text x="536" y="164">OFFLINE</text>
<rect class="g" x="520" y="204" width="210" height="48" rx="8"/><text x="536" y="234">SERVER</text>
<rect class="g" x="520" y="274" width="210" height="48" rx="8"/><text x="536" y="304">BAD_RESPONSE</text>
<rect class="f" x="520" y="340" width="210" height="48" rx="8"/><text x="536" y="362">null: throw e</text><text class="s" x="536" y="380">sigue subiendo</text>
<path class="l" d="M440 88H520" marker-end="url(#a)"/><path class="l" d="M440 158H520" marker-end="url(#a)"/><path class="l" d="M440 228H520" marker-end="url(#a)"/><path class="l" d="M440 298H520" marker-end="url(#a)"/><path class="l" d="M440 364H520" marker-end="url(#a)"/>
</svg>
