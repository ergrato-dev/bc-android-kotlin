<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 320" role="img" aria-labelledby="t d"><title id="t">De dónde salen las reglas</title><desc id="d">Cuatro orígenes entran en configuration.txt: las reglas de AGP (proguard-android-optimize.txt, 72 líneas), el proguard-rules.pro de la app (vacío en la Bitácora), 45 AAR con su proguard.txt (por ejemplo work-runtime, room3-runtime, hilt-android) y 9 archivos de JAR en META-INF (ktor.pro, coroutines.pro, kotlinx-serialization). También las que AGP genera del manifiesto. R8 las aplica todas a toda la app.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.h{font-weight:bold}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="f" x="24" y="24" width="220" height="56" rx="10"/><text x="40" y="48" class="h">AGP</text><text x="40" y="68" class="s">proguard-android-optimize.txt</text>
<rect class="f" x="24" y="94" width="220" height="56" rx="10"/><text x="40" y="118" class="h">La app</text><text x="40" y="138" class="s">proguard-rules.pro (vacío)</text>
<rect class="b" x="24" y="164" width="220" height="56" rx="10"/><text x="40" y="188" class="h">45 AAR: proguard.txt</text><text x="40" y="208" class="s">work-runtime · room3 · hilt</text>
<rect class="b" x="24" y="234" width="220" height="62" rx="10"/><text x="40" y="258" class="h">9 JAR: META-INF/…/*.pro</text><text x="40" y="280" class="s">ktor · coroutines · serialization</text>
<rect class="g" x="330" y="110" width="200" height="100" rx="10"/><text x="346" y="142" class="h">configuration.txt</text><text x="346" y="166" class="s">58 bloques, con su origen</text><text x="346" y="186" class="s">+ las generadas del manifiesto</text>
<path class="l" d="M244 52L328 130" marker-end="url(#a)"/><path class="l" d="M244 122L328 150" marker-end="url(#a)"/><path class="l" d="M244 192L328 175" marker-end="url(#a)"/><path class="l" d="M244 265L328 195" marker-end="url(#a)"/>
<rect class="r" x="580" y="110" width="156" height="100" rx="10"/><text x="596" y="142" class="h">R8</text><text x="596" y="166" class="s">las aplica todas</text><text x="596" y="186" class="s">a toda la app</text>
<path class="l" d="M530 160L578 160" marker-end="url(#a)"/>
</svg>
