<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">De la traza ofuscada a la de verdad</title><desc id="d">Arriba a la izquierda, la traza del móvil: at gf.o(r8-map-id-1dc0…:3) y at fk.e(r8-map-id-1dc0…:329). Abajo a la izquierda, el mapping de esa build, con pg_map_id 1dc0… y la línea dev.bitacora.BitacoraViewModel -> fk. Los dos entran en retrace, que devuelve SessionKt.reduce(Session.kt:71) y BitacoraViewModel.onIntent(BitacoraViewModel.kt:65). El pg_map_id de la traza y el del mapping tienen que coincidir.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.h{font-weight:bold}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="r" x="24" y="24" width="290" height="110" rx="10"/><text x="40" y="50" class="h">Traza del móvil</text><text x="40" y="76" class="s">at gf.o(r8-map-id-1dc0…:3)</text><text x="40" y="96" class="s">at fk.e(r8-map-id-1dc0…:329)</text><text x="40" y="116" class="s">… 13 líneas de la app</text>
<rect class="f" x="24" y="160" width="290" height="116" rx="10"/><text x="40" y="186" class="h">mapping.txt de esa build</text><text x="40" y="212" class="s">pg_map_id: 1dc0…</text><text x="40" y="232" class="s">dev.bitacora.BitacoraViewModel -&gt; fk:</text><text x="40" y="252" class="s">14:22:void onIntent(…):65 -&gt; e</text>
