<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">Qué hace R8</title><desc id="d">A la izquierda entran el código de la app, el de las bibliotecas y las reglas (las de AGP, las de la app y las de cada biblioteca). En el centro, R8 quita lo que no se alcanza, optimiza, renombra y convierte a dex. A la derecha salen el dex (de 4 archivos y 35,5 MB a 2 y 3,9 MB en la Bitácora) y el mapping con seeds, usage y configuration.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.h{font-weight:bold}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="24" y="30" width="210" height="70" rx="10"/><text x="40" y="58" class="h">Código de la app</text><text x="40" y="82" class="s">dev.bitacora: 61 KB de dex</text>
<rect class="b" x="24" y="120" width="210" height="70" rx="10"/><text x="40" y="148" class="h">Bibliotecas</text><text x="40" y="172" class="s">Compose, Ktor, Room, Hilt…</text>
<rect class="f" x="24" y="210" width="210" height="90" rx="10"/><text x="40" y="238" class="h">Reglas</text><text x="40" y="260" class="s">AGP · proguard-rules.pro</text><text x="40" y="280" class="s">54 de bibliotecas</text>
<rect class="g" x="290" y="60" width="180" height="210" rx="10"/><text x="356" y="92" class="h">R8</text><text x="306" y="128">1. Quitar</text><text x="306" y="160">2. Optimizar</text><text x="306" y="192">3. Renombrar</text><text x="306" y="224">4. Convertir a dex</text>
<path class="l" d="M234 65L288 120" marker-end="url(#a)"/><path class="l" d="M234 155L288 165" marker-end="url(#a)"/><path class="l" d="M234 255L288 215" marker-end="url(#a)"/>
<rect class="b" x="526" y="40" width="210" height="110" rx="10"/><text x="542" y="68" class="h">classes*.dex</text><text x="542" y="94" class="s">Sin R8: 4 dex, 35,5 MB</text><text x="542" y="114" class="s">Con R8: 2 dex, 3,9 MB</text><text x="542" y="134" class="s">APK: 13,2 MB → 2,25 MB</text>
<rect class="f" x="526" y="170" width="210" height="120" rx="10"/><text x="542" y="198" class="h">build/outputs/mapping</text><text x="542" y="222" class="s">mapping.txt (guárdalo)</text><text x="542" y="242" class="s">seeds.txt · usage.txt</text><text x="542" y="262" class="s">configuration.txt</text><text x="542" y="282" class="s">resources.txt</text>
<path class="l" d="M470 130L524 100" marker-end="url(#a)"/><path class="l" d="M470 210L524 225" marker-end="url(#a)"/>
</svg>
