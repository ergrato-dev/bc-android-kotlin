<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 280" role="img" aria-labelledby="t d"><title id="t">La memoria medida de la Bitácora</title><desc id="d">Barras de TOTAL PSS con dumpsys meminfo en el emulador, 8 segundos tras abrir la app: debug 97,5 MB, release sin R8 35,9 MB y release con R8 27,2 MB. Debajo de cada una, el heap de Java: 19,9, 7,4 y 4,8 MB.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.h{font-weight:bold}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<text x="24" y="40" class="h">TOTAL PSS (dumpsys meminfo, emulador, 8 s tras abrir)</text>
<text x="24" y="92">Debug</text><rect class="r" x="190" y="72" width="487" height="30" rx="4"/><text x="684" y="92">97,5 MB</text><text x="24" y="112" class="s">Java Heap 19,9 MB</text>
<text x="24" y="162">Release sin R8</text><rect class="f" x="190" y="142" width="180" height="30" rx="4"/><text x="380" y="162">35,9 MB</text><text x="24" y="182" class="s">Java Heap 7,4 MB</text>
<text x="24" y="232">Release con R8</text><rect class="g" x="190" y="212" width="136" height="30" rx="4"/><text x="336" y="232">27,2 MB</text><text x="24" y="252" class="s">Java Heap 4,8 MB</text>
