<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">La foto por FileProvider</title><desc id="d">La Bitácora crea files/photos/A-1.jpg y le pide a FileProvider una Uri content://dev.bitacora.agro.files/photos/A-1.jpg. TakePicture lanza IMAGE_CAPTURE con esa Uri en EXTRA_OUTPUT y permiso de lectura y escritura solo para ella. La app de la cámara escribe la foto a través de la Uri. Al volver, el callback recibe true y la observación guarda el nombre A-1.jpg. La app de la cámara no puede leer ningún otro archivo de la Bitácora.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="15" y="20" width="230" height="56" rx="8"/><text x="30" y="43">Bitácora</text><text class="s" x="30" y="63">files/photos/A-1.jpg</text>
<rect class="f" x="285" y="20" width="190" height="56" rx="8"/><text x="298" y="43">FileProvider</text><text class="s" x="298" y="63">file_paths.xml: photos/</text>
<path class="l" d="M245 48H280" marker-end="url(#a)"/>
<rect class="b" x="15" y="120" width="460" height="56" rx="8"/><text x="30" y="143">TakePicture: IMAGE_CAPTURE</text><text class="s" x="30" y="163">EXTRA_OUTPUT = content://dev.bitacora.agro.files/photos/A-1.jpg</text>
<path class="l" d="M380 76V115" marker-end="url(#a)"/>
<rect class="g" x="515" y="120" width="230" height="56" rx="8"/><text x="530" y="143">App de la cámara</text><text class="s" x="530" y="163">escribe solo en esa Uri</text>
<path class="l" d="M475 148H510" marker-end="url(#a)"/>
<rect class="g" x="15" y="220" width="460" height="56" rx="8"/><text x="30" y="243">callback(true)</text><text class="s" x="30" y="263">observation.copy(photo = "A-1.jpg")</text>
<path class="l" d="M630 176V248H480" marker-end="url(#a)"/><text class="s" x="560" y="240">RESULT_OK</text></svg>
