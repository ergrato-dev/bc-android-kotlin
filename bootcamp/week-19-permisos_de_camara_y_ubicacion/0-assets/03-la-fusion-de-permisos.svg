<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">La fusión de permisos</title><desc id="d">Tres manifiestos entran en la fusión: el de la app con los permisos de ubicación, CAMERA y READ_CONTACTS con tools:node remove; el del SDK con INTERNET y READ_CONTACTS; y el de androidx.core con su permiso de firma. El manifiesto fusionado tiene ubicación, CAMERA, INTERNET y el de firma, sin READ_CONTACTS. De los permisos, aapt2 deduce funciones de hardware obligatorias, cámara y ubicación, salvo que el manifiesto las declare con required false.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="15" y="20" width="250" height="66" rx="8"/><text x="30" y="43">app</text><text class="s" x="30" y="62">ubicación, CAMERA</text><text class="s" x="30" y="78">READ_CONTACTS tools:node="remove"</text>
<rect class="b" x="15" y="100" width="250" height="50" rx="8"/><text x="30" y="122">:sdk</text><text class="s" x="30" y="140">INTERNET, READ_CONTACTS</text>
<rect class="b" x="15" y="164" width="250" height="50" rx="8"/><text x="30" y="186">androidx.core</text><text class="s" x="30" y="204">DYNAMIC_RECEIVER_..._PERMISSION</text>
<rect class="f" x="305" y="95" width="160" height="60" rx="8"/><text x="318" y="120">fusión del</text><text x="318" y="140">manifiesto</text>
<path class="l" d="M265 53H285V115H300" marker-end="url(#a)"/><path class="l" d="M265 125H300" marker-end="url(#a)"/><path class="l" d="M265 189H285V135H300" marker-end="url(#a)"/>
<rect class="g" x="505" y="20" width="240" height="90" rx="8"/><text x="520" y="43">APK: permisos</text><text class="s" x="520" y="63">ubicación, CAMERA, INTERNET,</text><text class="s" x="520" y="81">el de firma de androidx.core</text><text class="s" x="520" y="99">sin READ_CONTACTS</text>
<rect class="r" x="505" y="130" width="240" height="84" rx="8"/><text x="520" y="153">funciones implícitas</text><text class="s" x="520" y="173">camera y location obligatorias</text><text class="s" x="520" y="191">salvo uses-feature con el mismo</text><text class="s" x="520" y="207">nombre y required="false"</text>
<path class="l" d="M465 115H485V65H500" marker-end="url(#a)"/><path class="l" d="M465 135H485V172H500" marker-end="url(#a)"/>
<rect class="o" x="15" y="240" width="730" height="74" rx="10"/><text x="30" y="264">apkanalyzer manifest permissions app-debug.apk: los permisos.</text><text x="30" y="286">aapt2 dump badging app-debug.apk: además, las funciones que ve Google Play.</text><text class="s" x="30" y="305">manifest-merger-blame-debug-report.txt: quién trajo cada línea.</text></svg>
