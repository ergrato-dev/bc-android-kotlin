<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 230" role="img" aria-labelledby="t d"><title id="t">object, companion y extensiones</title><desc id="d">Un object es un único objeto global; un companion object pertenece a la clase y se usa para fábricas como Version.parse; una función de extensión añade un método a un tipo desde fuera.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.s{font-size:12px;fill:#9aa4af}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker><marker id="h" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L12 6L0 12z" fill="#0d1117" stroke="#9aa4af" stroke-width="1.5"/></marker></defs><rect class="b" x="10" y="15" width="235" height="200" rx="8"/><text x="25" y="42">object</text><text class="s" x="25" y="64">un único objeto en todo el programa</text><text x="25" y="100">object Config {</text><text x="25" y="122">    val maxItems = 100</text><text x="25" y="144">}</text><text class="s" x="25" y="176">Config.maxItems</text><rect class="f" x="262" y="15" width="235" height="200" rx="8"/><text x="277" y="42">companion object</text><text class="s" x="277" y="64">lo "estático" de la clase</text><text x="277" y="100">class Version(...) {</text><text x="277" y="122">  companion object {</text><text x="277" y="144">    fun parse(t: String)</text><text x="277" y="166">  }</text><text x="277" y="188">}  →  Version.parse("1.2.3")</text><rect class="g" x="515" y="15" width="235" height="200" rx="8"/><text x="530" y="42">extensión</text><text class="s" x="530" y="64">añade un miembro desde fuera</text><text x="530" y="100">fun Double.format2() =</text><text x="530" y="122">  String.format(</text><text x="530" y="144">    Locale.ROOT, "%.2f", this)</text><text class="s" x="530" y="176">3.14159.format2()</text><text class="s" x="530" y="196">no toca la clase original</text></svg>
