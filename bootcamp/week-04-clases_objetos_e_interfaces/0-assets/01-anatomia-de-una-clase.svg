<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 270" role="img" aria-labelledby="t d"><title id="t">Anatomía de una clase</title><desc id="d">Una clase Rectangle con constructor primario, bloque init de validación, propiedades calculadas y un constructor secundario, con la visibilidad de cada miembro.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.s{font-size:12px;fill:#9aa4af}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker><marker id="h" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L12 6L0 12z" fill="#0d1117" stroke="#9aa4af" stroke-width="1.5"/></marker></defs><rect class="b" x="10" y="12" width="470" height="245" rx="8"/><text x="25" y="38">class Rectangle(val width: Double, val height: Double) {</text><text class="s" x="25" y="58">  constructor primario: val/var crean las propiedades</text><text x="25" y="86">    init { require(width &gt; 0 &amp;&amp; height &gt; 0) }</text><text class="s" x="25" y="106">  se ejecuta al crear el objeto, en orden</text><text x="25" y="134">    val area: Double get() = width * height</text><text class="s" x="25" y="154">  propiedad calculada: sin campo, sin valor guardado</text><text x="25" y="182">    constructor(side: Double) : this(side, side)</text><text class="s" x="25" y="202">  secundario: siempre delega en el primario</text><text x="25" y="230">    private fun interno() { ... }</text><text class="s" x="25" y="250">  solo visible dentro de la clase</text><rect class="f" x="505" y="12" width="245" height="245" rx="8"/><text x="520" y="38">Visibilidad</text><text x="520" y="70">public</text><text class="s" x="520" y="88">(por defecto) cualquiera</text><text x="520" y="118">internal</text><text class="s" x="520" y="136">el mismo módulo Gradle</text><text x="520" y="166">protected</text><text class="s" x="520" y="184">la clase y sus subclases</text><text x="520" y="214">private</text><text class="s" x="520" y="232">la clase (o el archivo)</text></svg>
