<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 260" role="img" aria-labelledby="t d"><title id="t">Interfaces y herencia</title><desc id="d">La interfaz Shape es implementada por Circle y Square. La clase abstracta Employee es extendida por Manager y Developer.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.s{font-size:12px;fill:#9aa4af}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker><marker id="h" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L12 6L0 12z" fill="#0d1117" stroke="#9aa4af" stroke-width="1.5"/></marker></defs><rect class="f" x="60" y="15" width="260" height="60" rx="8"/><text x="190" y="40" text-anchor="middle">«interface» Shape</text><text class="s" x="190" y="60" text-anchor="middle">name · area() · describe()</text><rect class="b" x="10" y="160" width="150" height="55" rx="8"/><text x="85" y="185" text-anchor="middle">Circle</text><text class="s" x="85" y="203" text-anchor="middle">area = π r²</text><rect class="b" x="220" y="160" width="150" height="55" rx="8"/><text x="295" y="185" text-anchor="middle">Square</text><text class="s" x="295" y="203" text-anchor="middle">area = side²</text><path d="M85 160V120H190V77M295 160V120H190" fill="none" stroke="#9aa4af" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#h)"/><rect class="f" x="440" y="15" width="300" height="60" rx="8"/><text x="590" y="40" text-anchor="middle">abstract Employee</text><text class="s" x="590" y="60" text-anchor="middle">name · baseSalary · salary() abstract · open title()</text><rect class="b" x="420" y="160" width="150" height="55" rx="8"/><text x="495" y="185" text-anchor="middle">Manager</text><text class="s" x="495" y="203" text-anchor="middle">base + bonus</text><rect class="b" x="600" y="160" width="150" height="55" rx="8"/><text x="675" y="185" text-anchor="middle">Developer</text><text class="s" x="675" y="203" text-anchor="middle">base + base · nivel / 10</text><path d="M495 160V120H590V77M675 160V120H590" fill="none" stroke="#9aa4af" stroke-width="2" marker-end="url(#h)"/><text class="s" x="15" y="245">línea discontinua: implementa una interfaz · línea continua: hereda de una clase</text></svg>
