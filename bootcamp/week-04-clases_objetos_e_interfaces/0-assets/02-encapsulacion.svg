<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 240" role="img" aria-labelledby="t d"><title id="t">Encapsulación con propiedad de respaldo</title><desc id="d">Dentro de la clase hay una lista mutable privada; hacia fuera se expone una lista de solo lectura que es una copia. El código externo solo puede llamar a add y consultar.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.s{font-size:12px;fill:#9aa4af}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker><marker id="h" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L12 6L0 12z" fill="#0d1117" stroke="#9aa4af" stroke-width="1.5"/></marker></defs><rect class="f" x="10" y="15" width="340" height="205" rx="8"/><text x="25" y="42">Dentro de la clase</text><rect class="b" x="30" y="62" width="300" height="50" rx="6"/><text x="45" y="84">private val _songs = mutableListOf&lt;Song&gt;()</text><text class="s" x="45" y="102">la lista real, solo la toca la clase</text><rect class="b" x="30" y="130" width="300" height="70" rx="6"/><text x="45" y="152">fun add(song: Song) { require(...); ... }</text><text class="s" x="45" y="172">aquí se aplican las reglas (invariantes)</text><text class="s" x="45" y="190">nadie puede saltárselas</text><rect class="g" x="410" y="15" width="340" height="205" rx="8"/><text x="425" y="42">Fuera de la clase</text><rect class="b" x="430" y="62" width="300" height="50" rx="6"/><text x="445" y="84">val songs: List&lt;Song&gt; get() = _songs.toList()</text><text class="s" x="445" y="102">una copia de solo lectura</text><rect class="b" x="430" y="130" width="300" height="70" rx="6"/><text x="445" y="152">playlist.add(Song("Uno", 200))</text><text class="s" x="445" y="172">único camino para cambiar el estado</text><text class="s" x="445" y="190">playlist.songs.add(...) no compila</text><path d="M350 87H428" stroke="#9aa4af" stroke-width="2" marker-end="url(#a)"/><path d="M430 165H332" stroke="#9aa4af" stroke-width="2" marker-end="url(#a)"/></svg>
