<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Del gesto a la acción</title><desc id="d">A la izquierda, las capas de gestos de Compose, de la más alta a la más baja: clickable, combinedClickable, draggable y anchoredDraggable, pointerInput con detectTapGestures, y pointerInput con cada evento. Las altas traen su semántica, las bajas no. A la derecha, para cada gesto de la Bitácora, la acción que ofrece TalkBack: el toque es OnClick, la pulsación larga OnLongClick con su etiqueta Cambiar el nivel, y deslizar para borrar una acción propia Borrar.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<text x="30" y="34">Capas de gestos</text>
<rect class="g" x="30" y="46" width="300" height="34" rx="6"/><text x="44" y="68">clickable</text><text class="s" x="200" y="68">con semántica</text>
<rect class="g" x="30" y="86" width="300" height="34" rx="6"/><text x="44" y="108">combinedClickable</text><text class="s" x="200" y="108">con semántica</text>
<rect class="b" x="30" y="126" width="300" height="34" rx="6"/><text x="44" y="148">draggable, anchoredDraggable</text>
<rect class="r" x="30" y="166" width="300" height="34" rx="6"/><text x="44" y="188">pointerInput { detectTapGestures }</text>
<rect class="r" x="30" y="206" width="300" height="34" rx="6"/><text x="44" y="228">pointerInput { cada evento }</text><text class="s" x="30" y="262">más alto, menos código y más semántica hecha</text>
<text x="420" y="34">Gesto y acción de TalkBack</text>
<rect class="b" x="420" y="46" width="310" height="44" rx="6"/><text x="434" y="72">toque</text><path class="l" d="M500 68H560" marker-end="url(#a)"/><text x="570" y="72">OnClick</text>
<rect class="b" x="420" y="100" width="310" height="44" rx="6"/><text x="434" y="126">pulsación larga</text><path class="l" d="M540 122H570" marker-end="url(#a)"/><text x="578" y="126">OnLongClick</text><text class="s" x="578" y="140">"Cambiar el nivel"</text>
<rect class="b" x="420" y="154" width="310" height="44" rx="6"/><text x="434" y="180">deslizar</text><path class="l" d="M500 176H560" marker-end="url(#a)"/><text x="570" y="180">CustomAction</text><text class="s" x="570" y="194">"Borrar"</text>
<text class="s" x="420" y="236">Cada gesto tiene su acción con nombre: TalkBack</text><text class="s" x="420" y="254">no hace gestos, ofrece acciones.</text></svg>
