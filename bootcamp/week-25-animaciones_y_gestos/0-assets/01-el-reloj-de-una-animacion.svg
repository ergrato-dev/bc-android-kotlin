<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">El reloj de una animación</title><desc id="d">animateColorAsState recibe el color del nivel. Cuando cambia de Alta a Baja, en cada fotograma el reloj da la hora y la animación devuelve un color intermedio: a los 0 ms el de Alta, a los 150 uno a medias, a los 300 el de Baja. En el móvil el reloj lo marca la pantalla; en un test, rule.mainClock, que con autoAdvance a false solo avanza con advanceTimeBy.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="30" y="30" width="300" height="60" rx="8"/><text x="46" y="56">animateColorAsState(destino, tween(300))</text><text class="s" x="46" y="78">destino: el color del nivel</text>
<rect class="f" x="400" y="30" width="330" height="60" rx="8"/><text x="416" y="56">reloj: la hora de cada fotograma</text><text class="s" x="416" y="78">móvil: la pantalla · test: rule.mainClock</text>
<path class="l" d="M60 200H700" marker-end="url(#a)"/><text class="s" x="680" y="225">ms</text>
<rect x="60" y="130" width="60" height="50" rx="6" fill="#f4c7c3"/><text class="s" x="80" y="222">0</text>
<rect x="240" y="130" width="60" height="50" rx="6" fill="#dcdac9"/><text class="s" x="255" y="222">150</text>
<rect x="420" y="130" width="60" height="50" rx="6" fill="#c4eed0"/><text class="s" x="435" y="222">300</text>
<rect x="600" y="130" width="60" height="50" rx="6" fill="#c4eed0"/><text class="s" x="615" y="222">400</text>
<text class="s" x="60" y="120">Alta</text><text class="s" x="240" y="120">a medias</text><text class="s" x="420" y="120">Baja</text>
<text class="s" x="30" y="260">autoAdvance = true: cada espera del test avanza hasta el final. autoAdvance = false: solo avanza con advanceTimeBy(ms),</text><text class="s" x="30" y="280">y la animación empieza en el primer fotograma tras recomponer.</text></svg>
