<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">El reloj virtual de runTest</title><desc id="d">Una línea de tiempo virtual de 0 a 3000 milisegundos para retrying con tres intentos y espera inicial de 1000. En 0, primer intento, falla. Delay de 1000. En 1000, segundo intento, falla. Delay de 2000. En 3000, tercer intento, contesta. currentTime vale 3000 y el test dura milisegundos reales. Debajo, advanceTimeBy de 1000 ejecuta lo anterior a 1000 pero no lo de 1000; runCurrent ejecuta lo de 1000. Y una caja roja: Dispatchers.Default e IO llevan tiempo real, fuera del reloj.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.h{font-weight:bold}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<line class="l" x1="60" y1="120" x2="720" y2="120" marker-end="url(#a)"/><text x="726" y="125" class="s">t</text>
<circle cx="80" cy="120" r="7" fill="#f85149"/><text x="80" y="150" text-anchor="middle" class="s">0</text><text x="80" y="95" text-anchor="middle">intento 1 ✗</text>
<circle cx="280" cy="120" r="7" fill="#f85149"/><text x="280" y="150" text-anchor="middle" class="s">1000</text><text x="280" y="95" text-anchor="middle">intento 2 ✗</text>
<circle cx="680" cy="120" r="7" fill="#3fb950"/><text x="680" y="150" text-anchor="middle" class="s">3000</text><text x="680" y="95" text-anchor="middle">intento 3 ✓</text>
<text x="180" y="60" text-anchor="middle" class="s">delay(1000)</text><text x="480" y="60" text-anchor="middle" class="s">delay(2000)</text>
<text x="60" y="30" class="h">retrying(times = 3, first = 1000) dentro de runTest: currentTime == 3000, 0 ms reales</text>
<rect class="b" x="40" y="180" width="420" height="120" rx="8"/><text x="56" y="206" class="h">Mover el reloj</text><text x="56" y="230" class="s">advanceTimeBy(1000): lo de antes de 1000, no lo de 1000</text><text x="56" y="252" class="s">runCurrent(): lo que toca ahora</text><text x="56" y="274" class="s">advanceUntilIdle(): todo, hasta vaciar la cola</text>
<rect class="r" x="480" y="180" width="260" height="120" rx="8"/><text x="496" y="206" class="h">Fuera del reloj</text><text x="496" y="230" class="s">Dispatchers.Default e IO:</text><text x="496" y="252" class="s">tiempo real (delay(500) = 504 ms)</text><text x="496" y="274" class="s">inyecta el dispatcher</text>
</svg>
