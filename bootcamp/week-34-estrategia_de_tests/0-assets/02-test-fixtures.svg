<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 360" role="img" aria-labelledby="t d"><title id="t">Lo que ve cada conjunto de fuentes con test fixtures</title><desc id="d">El módulo core data tiene tres conjuntos de fuentes: main, con ObservationRepository y RoomObservationRepository; testFixtures, con FakeRepository y FakeSettings, que ve main y lo internal; y test, con el contrato, FakeRepositoryTest y RoomRepositoryTest, que ve main y testFixtures. La app ve main de core data en implementation, y en sus tests ve testFixtures con testImplementation de testFixtures de core data. El APK lleva main de core data, pero no testFixtures ni test.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.h{font-weight:bold}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="s" x="20" y="20" width="420" height="320" rx="10" fill="none" stroke="#30363d" stroke-width="2"/><text x="36" y="46" class="h">:core:data</text>
<rect class="b" x="40" y="62" width="380" height="70" rx="8"/><text x="56" y="88" class="h">src/main</text><text x="56" y="112" class="s">ObservationRepository, RoomObservationRepository</text>
<rect class="g" x="40" y="160" width="380" height="70" rx="8"/><text x="56" y="186" class="h">src/testFixtures</text><text x="56" y="210" class="s">FakeRepository, FakeSettings (ve main e internal)</text>
<rect class="f" x="40" y="258" width="380" height="70" rx="8"/><text x="56" y="284" class="h">src/test</text><text x="56" y="308" class="s">el contrato: FakeRepositoryTest, RoomRepositoryTest</text>
<line class="l" x1="230" y1="160" x2="230" y2="134" marker-end="url(#a)"/><line class="l" x1="120" y1="258" x2="120" y2="232" marker-end="url(#a)"/>
<rect class="b" x="520" y="62" width="220" height="70" rx="8"/><text x="536" y="88" class="h">:app (main)</text><text x="536" y="112" class="s">implementation</text>
<rect class="f" x="520" y="196" width="220" height="70" rx="8"/><text x="536" y="222" class="h">:app (tests)</text><text x="536" y="246" class="s">testImplementation(testFixtures(...))</text>
<line class="l" x1="520" y1="97" x2="422" y2="97" marker-end="url(#a)"/><line class="l" x1="520" y1="231" x2="422" y2="200" marker-end="url(#a)"/>
<text x="520" y="300" class="s">El APK lleva src/main de :core:data,</text><text x="520" y="318" class="s">nunca testFixtures ni test.</text>
</svg>
