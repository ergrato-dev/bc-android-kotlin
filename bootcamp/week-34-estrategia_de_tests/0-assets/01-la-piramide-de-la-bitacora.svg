<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 440" role="img" aria-labelledby="t d"><title id="t">La pirámide de tests de la Bitácora</title><desc id="d">Cuatro niveles de abajo arriba. Base, unidad en la JVM: 10 tests de core model, ReducerTest y ViewModelTest, de 2 a 80 milisegundos por test. Integración en la JVM: 43 tests de core data con Room, Ktor y DataStore, a 0,1 segundos por test. Integración con Robolectric: 102 tests de la app y 2 del mapa, 0,44 segundos por test más unos 7 segundos de arranque. Arriba, extremo a extremo en un dispositivo, ninguno todavía, semana 35. Aparte, a la derecha, los tests del build con TestKit: 25 tests a 26 segundos por test.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.h{font-weight:bold}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<polygon class="r" points="300,40 380,40 410,120 270,120"/><text x="340" y="78" text-anchor="middle" class="h">E2E</text><text x="340" y="98" text-anchor="middle" class="s">dispositivo</text>
<polygon class="f" points="270,130 410,130 450,220 230,220"/><text x="340" y="168" text-anchor="middle" class="h">Robolectric</text><text x="340" y="190" text-anchor="middle" class="s">app 102 + mapa 2</text>
<polygon class="b" points="230,230 450,230 490,320 190,320"/><text x="340" y="268" text-anchor="middle" class="h">Integración en la JVM</text><text x="340" y="290" text-anchor="middle" class="s">core:data 43 (Room, Ktor, DataStore)</text>
<polygon class="g" points="190,330 490,330 530,420 150,420"/><text x="340" y="368" text-anchor="middle" class="h">Unidad en la JVM</text><text x="340" y="390" text-anchor="middle" class="s">core:model, network, ReducerTest, ViewModelTest</text>
<text x="20" y="80" class="s">0 tests (semana 35)</text><text x="20" y="175" class="s">0,44 s por test</text><text x="20" y="193" class="s">+ ~7 s de arranque</text><text x="20" y="278" class="s">0,1 s por test</text><text x="20" y="378" class="s">2-80 ms por test</text>
<line class="l" x1="140" y1="410" x2="140" y2="50" marker-end="url(#a)"/><text x="120" y="230" class="s" transform="rotate(-90 120 230)" text-anchor="middle">más lento y más frágil</text>
<rect class="r" x="580" y="150" width="160" height="120" rx="8"/><text x="660" y="180" text-anchor="middle" class="h">Build (TestKit)</text><text x="660" y="205" text-anchor="middle" class="s">BuildTest, ModulesTest,</text><text x="660" y="222" text-anchor="middle" class="s">TestingTest: 25</text><text x="660" y="250" text-anchor="middle" class="s">26 s por test</text>
</svg>
