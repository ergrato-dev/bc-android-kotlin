<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">El resultado tras la muerte del proceso</title><desc id="d">MainActivity registra el lanzador al crearse y el registro le asigna un requestCode aleatorio. launch abre LevelPickerActivity. Mientras el usuario elige, Android mata el proceso; el Bundle guarda qué requestCode es de qué lanzador. El usuario elige, Android crea una MainActivity nueva con el Bundle, que vuelve a registrar el lanzador en el mismo orden, y el registro entrega el resultado al callback de la actividad nueva.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="15" y="20" width="220" height="56" rx="8"/><text x="30" y="43">MainActivity 1</text><text class="s" x="30" y="63">register: requestCode aleatorio</text>
<rect class="f" x="270" y="20" width="200" height="56" rx="8"/><text x="285" y="43">launch(LOW)</text><text class="s" x="285" y="63">abre LevelPickerActivity</text>
<rect class="g" x="510" y="20" width="235" height="56" rx="8"/><text x="525" y="43">LevelPickerActivity</text><text class="s" x="525" y="63">el usuario elige HIGH</text>
<path class="l" d="M235 48H265" marker-end="url(#a)"/><path class="l" d="M470 48H505" marker-end="url(#a)"/>
<rect class="r" x="15" y="120" width="455" height="56" rx="8"/><text x="30" y="143">Android mata el proceso de la Bitácora</text><text class="s" x="30" y="163">el Bundle guarda: 1978823429 es el lanzador de PickLevel</text>
<path class="l" d="M125 76V115" marker-end="url(#a)"/>
<rect class="b" x="15" y="220" width="455" height="56" rx="8"/><text x="30" y="243">MainActivity 2, creada con el Bundle</text><text class="s" x="30" y="263">register en el mismo orden: recupera el mismo requestCode</text>
<path class="l" d="M125 176V215" marker-end="url(#a)"/>
<rect class="g" x="510" y="220" width="235" height="56" rx="8"/><text x="525" y="243">callback(HIGH)</text><text class="s" x="525" y="263">en la actividad nueva</text>
<path class="l" d="M627 76V215" marker-end="url(#a)"/><text class="s" x="635" y="150">RESULT_OK</text>
<path class="l" d="M470 248H505" marker-end="url(#a)"/>
<text class="s" x="15" y="310">Registrar en un onClick llega tarde: tras recrearse, el lanzador aún no existe cuando llega el resultado.</text></svg>
