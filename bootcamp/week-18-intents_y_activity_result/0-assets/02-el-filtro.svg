<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Cómo pasa un Intent por un filtro</title><desc id="d">El Intent ACTION_VIEW con bitacora://observation/A-7 pasa tres pruebas contra el intent-filter de ObservationActivity: la acción VIEW está en el filtro; todas las categorías del Intent, entre ellas DEFAULT, que añade startActivity, están en el filtro; y el esquema bitacora y el host observation encajan con data. Si pasa las tres, se abre ObservationActivity con intent.data. Sin DEFAULT en el filtro, startActivity no la encuentra.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="15" y="30" width="200" height="74" rx="8"/><text x="28" y="54">Intent</text><text class="s" x="28" y="74">VIEW + DEFAULT</text><text class="s" x="28" y="92">bitacora://observation/A-7</text>
<rect class="f" x="250" y="20" width="150" height="40" rx="8"/><text x="263" y="45">1 acción</text>
<rect class="f" x="250" y="72" width="150" height="40" rx="8"/><text x="263" y="97">2 categorías</text>
<rect class="f" x="250" y="124" width="150" height="40" rx="8"/><text x="263" y="149">3 datos</text>
<text class="s" x="415" y="45">VIEW está en el filtro</text><text class="s" x="415" y="97">todas las del Intent están</text><text class="s" x="415" y="149">esquema bitacora, host observation</text>
<path class="l" d="M215 67H232V40H245" marker-end="url(#a)"/><path class="l" d="M325 60V68" marker-end="url(#a)"/><path class="l" d="M325 112V120" marker-end="url(#a)"/>
<rect class="g" x="250" y="190" width="300" height="40" rx="8"/><text x="263" y="215">ObservationActivity, data = .../A-7</text>
<path class="l" d="M325 164V186" marker-end="url(#a)"/>
<rect class="o" x="15" y="246" width="730" height="42" rx="10"/><text x="30" y="272">startActivity añade DEFAULT a todo Intent implícito: un filtro sin DEFAULT nunca lo recibe.</text></svg>
