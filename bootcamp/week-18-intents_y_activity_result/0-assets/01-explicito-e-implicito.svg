<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">Explícito e implícito</title><desc id="d">Arriba, un Intent explícito nombra el componente dev.bitacora.agro/ObservationActivity y Android abre esa actividad sin buscar. Abajo, un Intent implícito con ACTION_SEND y text/plain pasa por el PackageManager, que lo compara con los intent-filter de las apps instaladas: si ninguna lo acepta, ActivityNotFoundException; si una, se abre; si varias, el usuario elige. createChooser lo envuelve en ACTION_CHOOSER, que es del sistema y siempre existe.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="15" y="20" width="230" height="56" rx="8"/><text x="30" y="43">Intent explícito</text><text class="s" x="30" y="63">component = ObservationActivity</text>
<rect class="g" x="510" y="20" width="235" height="56" rx="8"/><text x="525" y="43">ObservationActivity</text><text class="s" x="525" y="63">sin buscar: el nombre basta</text>
<path class="l" d="M245 48H505" marker-end="url(#a)"/><text class="s" x="300" y="40">Android la crea y la apila</text>
<rect class="b" x="15" y="120" width="230" height="56" rx="8"/><text x="30" y="143">Intent implícito</text><text class="s" x="30" y="163">ACTION_SEND, text/plain</text>
<rect class="f" x="290" y="120" width="175" height="56" rx="8"/><text x="303" y="143">PackageManager</text><text class="s" x="303" y="163">filtros de cada app</text>
<path class="l" d="M245 148H285" marker-end="url(#a)"/>
<rect class="r" x="510" y="100" width="235" height="40" rx="8"/><text x="525" y="125">ninguna: ActivityNotFound</text>
<rect class="g" x="510" y="150" width="235" height="40" rx="8"/><text x="525" y="175">una: se abre</text>
<rect class="g" x="510" y="200" width="235" height="40" rx="8"/><text x="525" y="225">varias: elige el usuario</text>
<path class="l" d="M465 140H488V120H505" marker-end="url(#a)"/><path class="l" d="M465 150H505" marker-end="url(#a)"/><path class="l" d="M465 160H488V220H505" marker-end="url(#a)"/>
<rect class="o" x="15" y="262" width="730" height="56" rx="10"/><text x="30" y="285">createChooser(send) lanza ACTION_CHOOSER, que es del sistema y siempre existe: muestra la lista,</text><text x="30" y="306">vacía si nadie acepta send, y no da ActivityNotFoundException en un móvil.</text></svg>
