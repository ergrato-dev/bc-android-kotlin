<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">El back stack</title><desc id="d">Una sola actividad. Dentro, el back stack es una lista de claves: SessionKey, ObservationKey A-1 y ObservationKey A-2. NavDisplay pinta la última, A-2, con lo que devuelve el entryProvider para su tipo. Abrir añade una clave al final; atrás llama a onBack, que quita la última. Con una sola clave, atrás es de Android y cierra la actividad. rememberNavBackStack guarda la lista en el estado de la actividad, por eso las claves son Serializable.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="o" x="20" y="20" width="720" height="250" rx="10"/><text class="s" x="36" y="42">MainActivity: una sola actividad</text>
<text x="40" y="74">back stack (rememberNavBackStack)</text>
<rect class="b" x="40" y="90" width="150" height="44" rx="6"/><text x="62" y="117">SessionKey</text>
<rect class="b" x="40" y="142" width="150" height="44" rx="6"/><text x="52" y="169">ObservationKey(A-1)</text>
<rect class="g" x="40" y="194" width="150" height="44" rx="6"/><text x="52" y="221">ObservationKey(A-2)</text>
<path class="l" d="M200 216H300" marker-end="url(#a)"/><text class="s" x="206" y="206">la última</text>
<rect class="g" x="310" y="70" width="210" height="180" rx="10"/><text x="326" y="96">NavDisplay</text><text class="s" x="326" y="120">entryProvider {</text><text class="s" x="338" y="140">entry&lt;SessionKey&gt; { ... }</text><text class="s" x="338" y="160">entry&lt;ObservationKey&gt; { key -&gt;</text><text class="s" x="350" y="180">ObservationScreen(...)</text><text class="s" x="338" y="200">}</text><text class="s" x="326" y="220">}</text>
<rect class="f" x="550" y="70" width="170" height="80" rx="8"/><text x="566" y="96">abrir</text><text class="s" x="566" y="118">backStack +=</text><text class="s" x="566" y="136">ObservationKey(code)</text>
<rect class="f" x="550" y="166" width="170" height="84" rx="8"/><text x="566" y="192">atrás: onBack</text><text class="s" x="566" y="214">removeLastOrNull()</text><text class="s" x="566" y="234">con una: cierra Android</text>
<text class="s" x="40" y="300">La lista se guarda en el estado de la actividad: sobrevive a la muerte del proceso, y por eso cada clave es @Serializable y lleva lo justo, un código.</text></svg>
