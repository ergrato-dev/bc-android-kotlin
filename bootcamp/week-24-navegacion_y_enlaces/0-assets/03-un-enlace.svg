<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 320" role="img" aria-labelledby="t d"><title id="t">Un enlace</title><desc id="d">Un enlace bitacora://observation/A-2 llega a Android como un Intent VIEW con esa Uri. Android busca en los manifiestos un intent-filter con VIEW, DEFAULT, BROWSABLE, el esquema bitacora y el host observation, y abre MainActivity. startOf lee el Intent: sin Uri, la sesión; con Uri, UriDeepLinkMatcher saca el código y withBackStack pone la sesión debajo. Si el código no existe, la sesión. El back stack empieza por esa lista.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="f" x="30" y="40" width="200" height="70" rx="8"/><text x="46" y="66">Intent VIEW</text><text class="s" x="46" y="90">bitacora://observation/A-2</text>
<path class="l" d="M240 75H280" marker-end="url(#a)"/>
<rect class="b" x="290" y="30" width="210" height="90" rx="8"/><text x="306" y="56">Android: manifiestos</text><text class="s" x="306" y="78">VIEW, DEFAULT, BROWSABLE</text><text class="s" x="306" y="98">scheme bitacora, host observation</text>
<path class="l" d="M510 75H550" marker-end="url(#a)"/>
<rect class="g" x="560" y="40" width="170" height="70" rx="8"/><text x="576" y="66">MainActivity</text><text class="s" x="576" y="90">startOf(intent)</text>
<path class="l" d="M645 120V160" marker-end="url(#a)"/>
<rect class="b" x="290" y="170" width="440" height="80" rx="8"/><text x="306" y="194">UriDeepLinkMatcher("bitacora://observation/{code}")</text><text class="s" x="306" y="216">.withBackStack { listOf(SessionKey, it.key) }</text><text class="s" x="306" y="236">encaja: [SessionKey, ObservationKey(A-2)]</text>
<rect class="r" x="30" y="170" width="230" height="80" rx="8"/><text x="46" y="194">a la sesión</text><text class="s" x="46" y="216">sin Uri (lanzador, explícito)</text><text class="s" x="46" y="236">no encaja, o A-99 no existe</text>
<path class="l" d="M290 210H270" marker-end="url(#a)"/>
<text class="s" x="30" y="290">El enlace viene de fuera: cualquier app puede mandarlo. Se comprueba que el código existe antes de abrir nada.</text></svg>
