<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">El estado de cada destino</title><desc id="d">Tres momentos. Primero, A-1 está arriba con la nota escrita. Segundo, A-2 se apila encima: A-1 sale de la composición, y con rememberSaveableStateHolderNavEntryDecorator su nota se guarda; sin el decorador se pierde. Tercero, atrás quita A-2: A-1 vuelve con su nota, y el estado de A-2 se borra, también su ViewModel si se usa el decorador de ViewModel. Volver a abrir A-2 empieza de cero.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<text x="40" y="40">1. A-1 arriba</text><rect class="g" x="40" y="56" width="180" height="70" rx="8"/><text x="56" y="82">A-1</text><text class="s" x="56" y="106">nota: "revisar la bomba"</text>
<path class="l" d="M230 90H270" marker-end="url(#a)"/>
<text x="280" y="40">2. Siguiente: A-2 encima</text><rect class="g" x="280" y="56" width="180" height="70" rx="8"/><text x="296" y="82">A-2</text><text class="s" x="296" y="106">nota: ""</text>
<rect class="o" x="280" y="140" width="180" height="70" rx="8"/><text class="s" x="296" y="164">A-1, fuera de la composición</text><text class="s" x="296" y="184">su nota, guardada por</text><text class="s" x="296" y="200">el decorador saveable</text>
<path class="l" d="M470 90H510" marker-end="url(#a)"/>
<text x="520" y="40">3. Atrás: quita A-2</text><rect class="g" x="520" y="56" width="200" height="70" rx="8"/><text x="536" y="82">A-1</text><text class="s" x="536" y="106">nota: "revisar la bomba"</text>
<rect class="r" x="520" y="140" width="200" height="70" rx="8"/><text class="s" x="536" y="164">A-2, borrada: su estado</text><text class="s" x="536" y="184">y su ViewModel (onCleared)</text><text class="s" x="536" y="200">si hay decorador de ViewModel</text>
<text class="s" x="40" y="250">Sin rememberSaveableStateHolderNavEntryDecorator, A-1 vuelve con la nota vacía. Tras la muerte del proceso, el back stack y la nota de</text><text class="s" x="40" y="270">la de arriba vuelven. Lo que se quita del back stack se olvida: volver a abrir A-1 empieza de cero.</text></svg>
