<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 250" role="img" aria-labelledby="t d"><title id="t">enum frente a sealed</title><desc id="d">Un enum tiene un conjunto fijo de instancias que comparten forma. Una sealed tiene un conjunto fijo de tipos y cada tipo puede llevar sus propios datos.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs><rect class="b" x="10" y="15" width="360" height="220" rx="8"/><text x="25" y="42">enum class Level</text><text class="s" x="25" y="62">instancias fijas, todas con la misma forma</text><rect class="f" x="30" y="85" width="90" height="36" rx="6"/><text x="75" y="108" text-anchor="middle">LOW</text><rect class="f" x="130" y="85" width="90" height="36" rx="6"/><text x="175" y="108" text-anchor="middle">MEDIUM</text><rect class="f" x="230" y="85" width="90" height="36" rx="6"/><text x="275" y="108" text-anchor="middle">HIGH</text><text class="s" x="25" y="152">Level.entries · name · ordinal</text><text class="s" x="25" y="174">Úsalo cuando los valores son "etiquetas":</text><text class="s" x="25" y="194">niveles, días, prioridades, estados simples</text><rect class="g" x="390" y="15" width="360" height="220" rx="8"/><text x="405" y="42">sealed interface ParseResult</text><text class="s" x="405" y="62">tipos fijos, cada uno con sus propios datos</text><rect class="f" x="410" y="85" width="150" height="62" rx="6"/><text x="485" y="108" text-anchor="middle">Valid</text><text class="s" x="485" y="128" text-anchor="middle">observation</text><rect class="f" x="580" y="85" width="150" height="62" rx="6"/><text x="655" y="108" text-anchor="middle">Invalid</text><text class="s" x="655" y="128" text-anchor="middle">line, reason</text><text class="s" x="405" y="174">Úsalo cuando cada caso lleva información distinta:</text><text class="s" x="405" y="194">resultados, estados de pantalla, eventos</text></svg>
