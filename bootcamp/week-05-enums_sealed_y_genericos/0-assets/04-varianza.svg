<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 250" role="img" aria-labelledby="t d"><title id="t">Varianza</title><desc id="d">Box de out T solo produce T, por eso Box de String es un Box de Any. Consumer de in T solo consume T, por eso Consumer de Any es un Consumer de String. MutableList de T produce y consume, así que es invariante.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs><rect class="g" x="10" y="15" width="240" height="220" rx="8"/><text x="25" y="42">out T  (productor)</text><text class="s" x="25" y="64">solo DEVUELVE T</text><text x="25" y="100">class Box&lt;out T&gt;</text><text class="s" x="25" y="122">Box&lt;String&gt;</text><text class="s" x="25" y="144">es un Box&lt;Any&gt;</text><text class="s" x="25" y="176">List&lt;String&gt; es una List&lt;Any&gt;</text><text class="s" x="25" y="198">covariante: el subtipo se conserva</text><rect class="b" x="260" y="15" width="240" height="220" rx="8"/><text x="275" y="42">in T  (consumidor)</text><text class="s" x="275" y="64">solo RECIBE T</text><text x="275" y="100">interface Sink&lt;in T&gt;</text><text class="s" x="275" y="122">Sink&lt;Any&gt;</text><text class="s" x="275" y="144">es un Sink&lt;String&gt;</text><text class="s" x="275" y="176">quien acepta cualquier cosa</text><text class="s" x="275" y="198">acepta también Strings</text><rect class="r" x="510" y="15" width="240" height="220" rx="8"/><text x="525" y="42">sin variación</text><text class="s" x="525" y="64">DEVUELVE y RECIBE T</text><text x="525" y="100">MutableList&lt;T&gt;</text><text class="s" x="525" y="122">MutableList&lt;String&gt;</text><text class="s" x="525" y="144">NO es MutableList&lt;Any&gt;</text><text class="s" x="525" y="176">si lo fuera, podrías meter un Int</text><text class="s" x="525" y="198">en una lista de Strings</text></svg>
