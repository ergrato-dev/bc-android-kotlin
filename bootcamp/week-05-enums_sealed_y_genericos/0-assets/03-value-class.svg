<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 230" role="img" aria-labelledby="t d"><title id="t">value class</title><desc id="d">En tiempo de compilación, Code y String son tipos distintos y no se pueden mezclar. En ejecución, el Code se representa directamente como el String que contiene.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs><rect class="b" x="10" y="15" width="360" height="200" rx="8"/><text x="25" y="42">Al compilar: dos tipos distintos</text><text class="s" x="25" y="68">fun find(code: Code, text: String)</text><rect class="g" x="25" y="85" width="330" height="40" rx="6"/><text x="40" y="110">find(Code("OBS-1"), "lote norte")</text><rect class="r" x="25" y="140" width="330" height="40" rx="6"/><text x="40" y="165">find("lote norte", Code("OBS-1"))</text><text class="s" x="25" y="202">el segundo no compila: argumentos intercambiados</text><rect class="f" x="400" y="15" width="350" height="200" rx="8"/><text x="415" y="42">Al ejecutar: sin envoltorio</text><text class="s" x="415" y="68">@JvmInline value class Code(val value: String)</text><rect class="b" x="415" y="85" width="150" height="40" rx="6"/><text x="490" y="110" text-anchor="middle">Code("OBS-1")</text><text x="580" y="110">=</text><rect class="b" x="605" y="85" width="125" height="40" rx="6"/><text x="667" y="110" text-anchor="middle">"OBS-1"</text><text class="s" x="415" y="152">un solo String en memoria, sin objeto extra</text><text class="s" x="415" y="174">(se envuelve solo al usarlo como genérico,</text><text class="s" x="415" y="194">o por interfaz)</text></svg>
