<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 240" role="img" aria-labelledby="t d"><title id="t">when exhaustivo</title><desc id="d">El compilador comprueba que un when sobre una jerarquía sealed trata todos los casos. Si se añade un caso nuevo y falta una rama, el programa no compila.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs><rect class="b" x="10" y="15" width="360" height="210" rx="8"/><text x="25" y="42">sealed interface LoadState</text><text class="s" x="25" y="70">data object Loading</text><text class="s" x="25" y="92">data class Success(data)</text><text class="s" x="25" y="114">data class Failure(message)</text><rect class="r" x="25" y="135" width="330" height="70" rx="6"/><text x="40" y="160">+ data object Empty</text><text class="s" x="40" y="180">un caso nuevo, añadido más tarde</text><rect class="g" x="400" y="15" width="350" height="100" rx="8"/><text x="415" y="42">when (state) {</text><text class="s" x="415" y="64">  Loading -&gt; ...   is Success -&gt; ...</text><text class="s" x="415" y="86">  is Failure -&gt; ...      // sin else</text><text x="415" y="106">}</text><rect class="r" x="400" y="125" width="350" height="100" rx="8"/><text x="415" y="150">error de compilación:</text><text class="s" x="415" y="172">'when' expression must be exhaustive,</text><text class="s" x="415" y="192">add the 'Empty' branch</text><text class="s" x="415" y="212">el compilador te dice qué sitios revisar</text><path d="M370 70H398M370 170H398" stroke="#9aa4af" stroke-width="2" marker-end="url(#a)"/></svg>
