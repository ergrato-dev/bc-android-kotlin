<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 320" role="img" aria-labelledby="t d"><title id="t">El ciclo de vida de una actividad</title><desc id="d">Cinco estados en fila: INITIALIZED, CREATED, STARTED, RESUMED y DESTROYED. Al subir, onCreate lleva a CREATED, onStart a STARTED y onResume a RESUMED. Al bajar, onPause vuelve a STARTED, onStop a CREATED y onDestroy a DESTROYED. Desde CREATED la actividad puede volver a STARTED con onStart. Al girar el móvil, la actividad pasa por onPause, onStop, onSaveInstanceState y onDestroy, y se crea otra con el Bundle guardado.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="15" y="110" width="120" height="44" rx="8"/><text x="28" y="137">INITIALIZED</text>
<rect class="b" x="175" y="110" width="120" height="44" rx="8"/><text x="196" y="137">CREATED</text>
<rect class="b" x="335" y="110" width="120" height="44" rx="8"/><text x="356" y="137">STARTED</text>
<rect class="g" x="495" y="110" width="120" height="44" rx="8"/><text x="514" y="137">RESUMED</text>
<rect class="r" x="635" y="230" width="110" height="44" rx="8"/><text x="647" y="257">DESTROYED</text>
<path class="l" d="M135 120H175" marker-end="url(#a)"/><text x="122" y="100">onCreate</text>
<path class="l" d="M295 120H335" marker-end="url(#a)"/><text x="288" y="100">onStart</text>
<path class="l" d="M455 120H495" marker-end="url(#a)"/><text x="444" y="100">onResume</text>
<path class="l" d="M495 146H455" marker-end="url(#a)"/><text x="448" y="176">onPause</text>
<path class="l" d="M335 146H295" marker-end="url(#a)"/><text x="292" y="176">onStop</text>
<path class="l" d="M235 154V252H630" marker-end="url(#a)"/><text x="400" y="244">onDestroy</text>
<text class="s" x="250" y="200">al fondo: se queda en CREATED</text><text class="s" x="250" y="216">y vuelve con onStart</text>
<rect class="o" x="15" y="20" width="730" height="50" rx="10"/><text x="30" y="42">Giro del móvil: onPause → onStop → onSaveInstanceState → onDestroy,</text><text class="s" x="30" y="60">y otra actividad nueva: onCreate(Bundle) → onStart → onResume</text>
<rect class="f" x="15" y="280" width="420" height="32" rx="8"/><text x="28" y="301">Muerte del proceso: sin onDestroy; vuelve con el Bundle</text></svg>
