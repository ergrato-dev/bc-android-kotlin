<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 250" role="img" aria-labelledby="t d"><title id="t">Métodos y observadores</title><desc id="d">Dos filas en el tiempo. Al subir, cada método de la actividad va primero y el observador después: onCreate, observer.onCreate, onStart, observer.onStart, onResume, observer.onResume. Al bajar, el observador va primero: observer.onPause, onPause, observer.onStop, onStop, observer.onDestroy, onDestroy. repeatOnLifecycle(STARTED) empieza después de onStart y se cancela antes de onStop.</desc><style>text{font:13px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.s{font-size:12px;fill:#9aa4af}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/>
<text x="15" y="30">al subir: primero la actividad, después el observador</text>
<rect class="b" x="15" y="42" width="110" height="34" rx="6"/><text x="25" y="64">onCreate</text>
<rect class="g" x="135" y="42" width="110" height="34" rx="6"/><text x="141" y="64">obs.onCreate</text>
<rect class="b" x="255" y="42" width="110" height="34" rx="6"/><text x="265" y="64">onStart</text>
<rect class="g" x="375" y="42" width="110" height="34" rx="6"/><text x="381" y="64">obs.onStart</text>
<rect class="b" x="495" y="42" width="110" height="34" rx="6"/><text x="505" y="64">onResume</text>
<rect class="g" x="615" y="42" width="130" height="34" rx="6"/><text x="621" y="64">obs.onResume</text>
<text x="15" y="115">al bajar: primero el observador, después la actividad</text>
<rect class="g" x="15" y="127" width="110" height="34" rx="6"/><text x="21" y="149">obs.onPause</text>
<rect class="b" x="135" y="127" width="110" height="34" rx="6"/><text x="145" y="149">onPause</text>
<rect class="g" x="255" y="127" width="110" height="34" rx="6"/><text x="261" y="149">obs.onStop</text>
<rect class="b" x="375" y="127" width="110" height="34" rx="6"/><text x="385" y="149">onStop</text>
<rect class="g" x="495" y="127" width="110" height="34" rx="6"/><text x="501" y="149">obs.onDestroy</text>
<rect class="b" x="615" y="127" width="130" height="34" rx="6"/><text x="625" y="149">onDestroy</text>
<rect class="f" x="15" y="185" width="730" height="50" rx="8"/><text x="28" y="207">repeatOnLifecycle(STARTED) { flow.collect { } }</text><text class="s" x="28" y="225">empieza después de onStart, se cancela antes de onStop y vuelve a empezar en el siguiente onStart</text></svg>
