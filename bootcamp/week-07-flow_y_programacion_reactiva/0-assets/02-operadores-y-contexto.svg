<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Operadores y contexto</title><desc id="d">Una tubería: el productor flow, los operadores map y filter, y el colector. flowOn cambia el dispatcher solo de lo que tiene arriba. buffer separa productor y colector en dos coroutines para que no se esperen.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="f" x="15" y="30" width="120" height="50" rx="6"/><text x="30" y="60">flow { emit }</text>
<rect class="b" x="175" y="30" width="90" height="50" rx="6"/><text x="195" y="60">map</text>
<rect class="b" x="305" y="30" width="90" height="50" rx="6"/><text x="323" y="60">filter</text>
<rect class="g" x="435" y="30" width="110" height="50" rx="6"/><text x="452" y="60">flowOn(IO)</text>
<rect class="g" x="585" y="30" width="160" height="50" rx="6"/><text x="600" y="60">collect { }</text>
<path class="l" d="M135 55L173 55" marker-end="url(#a)"/><path class="l" d="M265 55L303 55" marker-end="url(#a)"/><path class="l" d="M395 55L433 55" marker-end="url(#a)"/><path class="l" d="M545 55L583 55" marker-end="url(#a)"/>
<path d="M15 100L545 100" stroke="#d29922" stroke-width="3"/><text class="s" x="15" y="122">todo esto corre en Dispatchers.IO (lo que queda ARRIBA de flowOn)</text>
<path d="M585 100L745 100" stroke="#3fb950" stroke-width="3"/><text class="s" x="585" y="122">en el contexto del colector</text>
<rect class="b" x="15" y="160" width="730" height="125" rx="8"/><text x="30" y="188">sin buffer: productor y colector se esperan</text>
<rect class="f" x="30" y="200" width="60" height="26" rx="4"/><rect class="g" x="95" y="200" width="60" height="26" rx="4"/><rect class="f" x="160" y="200" width="60" height="26" rx="4"/><rect class="g" x="225" y="200" width="60" height="26" rx="4"/><text class="s" x="300" y="218">emit, procesa, emit, procesa: se suman los tiempos</text>
<text x="30" y="255">con buffer(): dos coroutines</text>
<rect class="f" x="30" y="263" width="60" height="16" rx="4"/><rect class="f" x="95" y="263" width="60" height="16" rx="4"/><rect class="f" x="160" y="263" width="60" height="16" rx="4"/><text class="s" x="300" y="276">el productor sigue emitiendo mientras el colector procesa</text></svg>
