<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">Combinar flujos</title><desc id="d">Diagrama de canicas. combine recalcula con el último valor de cada entrada cuando cualquiera cambia. flatMapLatest cancela la búsqueda anterior al llegar una consulta nueva. debounce solo deja pasar el último valor tras un tiempo sin cambios.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<text class="s" x="25" y="30">combine(lista, consulta)</text>
<text x="25" y="58">lista</text><path class="l" d="M110 54L740 54" marker-end="url(#a)"/><circle cx="150" cy="54" r="12" class="b"/><text class="s" x="144" y="58">L1</text><circle cx="520" cy="54" r="12" class="b"/><text class="s" x="514" y="58">L2</text>
<text x="25" y="98">consulta</text><path class="l" d="M110 94L740 94" marker-end="url(#a)"/><circle cx="260" cy="94" r="12" class="f"/><text class="s" x="254" y="98">q1</text><circle cx="390" cy="94" r="12" class="f"/><text class="s" x="384" y="98">q2</text>
<text x="25" y="138">resultado</text><path class="l" d="M110 134L740 134" marker-end="url(#a)"/><rect x="236" y="122" width="48" height="24" rx="12" class="g"/><text class="s" x="243" y="138">L1q1</text><rect x="366" y="122" width="48" height="24" rx="12" class="g"/><text class="s" x="373" y="138">L1q2</text><rect x="496" y="122" width="48" height="24" rx="12" class="g"/><text class="s" x="503" y="138">L2q2</text>
<text class="s" x="25" y="172">no emite hasta tener un valor de cada entrada; después, un resultado por cada cambio</text>
<text class="s" x="25" y="200">flatMapLatest { buscar(it) }</text>
<text x="25" y="228">consultas</text><path class="l" d="M110 224L740 224" marker-end="url(#a)"/><circle cx="150" cy="224" r="12" class="f"/><text class="s" x="144" y="228">a</text><circle cx="260" cy="224" r="12" class="f"/><text class="s" x="252" y="228">ab</text>
<text x="25" y="268">búsquedas</text><rect x="150" y="256" width="110" height="24" rx="4" class="r"/><text class="s" x="160" y="272">a ✗ cancelada</text><rect x="260" y="256" width="140" height="24" rx="4" class="g"/><text class="s" x="270" y="272">ab termina</text>
<text class="s" x="25" y="308">debounce(200): solo pasa el último valor tras 200 ms sin cambios: a, ab, abc ... (silencio) → abc</text></svg>
