<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 270" role="img" aria-labelledby="t d"><title id="t">stateIn con WhileSubscribed</title><desc id="d">Línea de tiempo. Sin suscriptores el flujo de origen está parado. Al llegar el primer suscriptor arranca. Cuando se va el último, el origen sigue 5 segundos más; si vuelve alguien a tiempo no se reinicia, y si no, se cancela.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<text x="25" y="42">suscriptores</text><path class="l" d="M140 38L740 38" marker-end="url(#a)"/>
<rect class="b" x="220" y="26" width="170" height="24" rx="4"/><text class="s" x="235" y="43">pantalla abierta</text>
<rect class="b" x="560" y="26" width="120" height="24" rx="4"/><text class="s" x="572" y="43">vuelve a abrir</text>
<text x="25" y="122">flujo de origen</text><path class="l" d="M140 118L740 118" marker-end="url(#a)"/>
<rect class="g" x="220" y="106" width="260" height="24" rx="4"/><text class="s" x="235" y="123">recogiendo (arranca con el primero)</text>
<rect class="g" x="560" y="106" width="130" height="24" rx="4"/><text class="s" x="572" y="123">recogiendo otra vez</text>
<rect class="f" x="390" y="150" width="90" height="22" rx="4"/><text class="s" x="397" y="166">5 000 ms</text>
<path d="M390 56L390 150" stroke="#d29922" stroke-width="2" stroke-dasharray="4 4"/><path d="M480 130L480 172" stroke="#d29922" stroke-width="2" stroke-dasharray="4 4"/>
<text class="s" x="25" y="200">sin nadie escuchando, el origen NO corre (gasta cero)</text>
<text class="s" x="25" y="222">una rotación de pantalla dura menos de 5 s: el origen no se reinicia y no se pierde el valor</text>
<text class="s" x="25" y="244">pasados los 5 s sin suscriptores, el origen se cancela; al volver, empieza de cero</text></svg>
