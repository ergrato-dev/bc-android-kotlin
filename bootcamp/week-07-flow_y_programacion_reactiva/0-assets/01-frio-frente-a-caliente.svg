<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">Flujo frío frente a caliente</title><desc id="d">Un flujo frío ejecuta su código desde cero para cada colector: dos colectores, dos ejecuciones. Un StateFlow o SharedFlow es caliente: una sola fuente que reparte los valores a todos los colectores que estén escuchando.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="10" y="15" width="365" height="300" rx="8"/><text x="25" y="42">frío: flow { ... }</text><text class="s" x="25" y="62">el código corre una vez por colector</text>
<rect class="b" x="30" y="90" width="110" height="40" rx="6"/><text x="45" y="115">colector 1</text><rect class="b" x="30" y="190" width="110" height="40" rx="6"/><text x="45" y="215">colector 2</text>
<rect class="f" x="230" y="80" width="125" height="60" rx="6"/><text x="245" y="106">flow { }</text><text class="s" x="245" y="126">ejecución 1</text>
<rect class="f" x="230" y="180" width="125" height="60" rx="6"/><text x="245" y="206">flow { }</text><text class="s" x="245" y="226">ejecución 2</text>
<path class="l" d="M140 110L228 110" marker-end="url(#a)"/><path class="l" d="M140 210L228 210" marker-end="url(#a)"/>
<text class="s" x="25" y="272">sin colector no se ejecuta nada</text><text class="s" x="25" y="294">cada colector ve la secuencia entera, desde el principio</text>
<rect class="g" x="385" y="15" width="365" height="300" rx="8"/><text x="400" y="42">caliente: StateFlow / SharedFlow</text><text class="s" x="400" y="62">una fuente, muchos colectores</text>
<rect class="g" x="400" y="120" width="130" height="80" rx="6"/><text x="415" y="148">fuente única</text><text class="s" x="415" y="170">value = 1, 2, 3...</text><text class="s" x="415" y="188">existe sin colectores</text>
<rect class="b" x="640" y="80" width="100" height="40" rx="6"/><text x="652" y="105">colector 1</text><rect class="b" x="640" y="200" width="100" height="40" rx="6"/><text x="652" y="225">colector 2</text>
<path class="l" d="M530 145L638 105" marker-end="url(#a)"/><path class="l" d="M530 175L638 220" marker-end="url(#a)"/>
<text class="s" x="400" y="272">un colector tardío solo ve lo siguiente</text><text class="s" x="400" y="294">(StateFlow: el valor actual; SharedFlow: el replay)</text></svg>
