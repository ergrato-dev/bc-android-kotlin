<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">Dónde vive cada plugin</title><desc id="d">El proyecto raíz carga AGP 9.4.1 con apply false y el plugin de Kotlin 2.4.21, que aplica para los tests de TestKit. build-logic es un build aparte que depende de AGP y de Kotlin para compilar el convention plugin bitacora.android-application. El módulo app aplica bitacora.android-application, que aplica com.android.application y BuildInfoPlugin. core y data aplican bitacora.kotlin-library: Kotlin puro, sin Android. Sin AGP en el raíz, Kotlin se carga en el raíz y AGP en app, y falla con Could not generate a decorated class for type KotlinAndroidTarget.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.r{fill:#2d1115;stroke:#f85149;stroke-width:2}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="f" x="15" y="20" width="300" height="80" rx="8"/><text x="30" y="44">build-logic (build aparte)</text><text class="s" x="30" y="66">implementation(AGP 9.4.1, KGP 2.4.21)</text><text class="s" x="30" y="86">bitacora.android-application</text>
<rect class="b" x="400" y="20" width="345" height="80" rx="8"/><text x="415" y="44">raíz: el classpath que ven todos</text><text class="s" x="415" y="66">com.android.application 9.4.1 apply false</text><text class="s" x="415" y="86">org.jetbrains.kotlin.jvm 2.4.21</text>
<path class="l" d="M300 100L415 152" marker-end="url(#a)"/><text class="s" x="185" y="135">convention plugins</text>
<path class="l" d="M520 100V150" marker-end="url(#a)"/><path class="l" d="M640 100L690 150" marker-end="url(#a)"/>
<rect class="g" x="400" y="155" width="220" height="70" rx="8"/><text x="415" y="179">:app</text><text class="s" x="415" y="199">bitacora.android-application</text><text class="s" x="415" y="216">AGP + BuildInfoPlugin</text>
<rect class="g" x="630" y="155" width="115" height="70" rx="8"/><text x="645" y="179">:core :data</text><text class="s" x="645" y="199">Kotlin puro</text><text class="s" x="645" y="216">sin Android</text>
<rect class="r" x="15" y="155" width="360" height="70" rx="8"/><text x="30" y="179">sin AGP en el raíz</text><text class="s" x="30" y="199">Kotlin en el raíz, AGP solo en :app</text><text class="s" x="30" y="216">Could not generate a decorated class ...</text>
<text x="15" y="270">Regla de la semana 10: cada plugin se declara una vez, en el raíz;</text><text x="15" y="295">los módulos lo aplican sin versión, a través de los convention plugins.</text></svg>
