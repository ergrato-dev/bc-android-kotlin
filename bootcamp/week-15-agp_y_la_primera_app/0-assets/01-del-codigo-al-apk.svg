<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">Del código al APK</title><desc id="d">El código Kotlin de app, core y data se compila contra el android.jar de compileSdk 37 y d8 lo convierte en archivos classes.dex. Los recursos de res pasan por aapt2 y salen como resources.arsc. El manifiesto de app se fusiona con el de las bibliotecas y con applicationId, versión, minSdk 26 y targetSdk 36. Los assets se copian tal cual. Todo se empaqueta en el APK. AGP es el plugin que conecta los pasos; el SDK pone android.jar, d8 y aapt2 viene de google().</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="15" y="20" width="200" height="50" rx="8"/><text x="30" y="42">Kotlin (app, core, data)</text><text class="s" x="30" y="60">src/main/kotlin</text>
<rect class="b" x="15" y="85" width="200" height="50" rx="8"/><text x="30" y="107">res/</text><text class="s" x="30" y="125">values/strings.xml</text>
<rect class="b" x="15" y="150" width="200" height="50" rx="8"/><text x="30" y="172">AndroidManifest.xml</text><text class="s" x="30" y="190">la actividad, el label</text>
<rect class="b" x="15" y="215" width="200" height="50" rx="8"/><text x="30" y="237">assets</text><text class="s" x="30" y="255">build-info.properties</text>
<path class="l" d="M215 45H270" marker-end="url(#a)"/><path class="l" d="M215 110H270" marker-end="url(#a)"/><path class="l" d="M215 175H270" marker-end="url(#a)"/><path class="l" d="M215 240H270" marker-end="url(#a)"/>
<rect class="f" x="275" y="20" width="230" height="50" rx="8"/><text x="290" y="42">kotlinc + d8</text><text class="s" x="290" y="60">contra android.jar (compileSdk 37)</text>
<rect class="f" x="275" y="85" width="230" height="50" rx="8"/><text x="290" y="107">aapt2</text><text class="s" x="290" y="125">compila y enlaza recursos</text>
<rect class="f" x="275" y="150" width="230" height="50" rx="8"/><text x="290" y="172">manifest merger</text><text class="s" x="290" y="190">+ applicationId, versión, SDK</text>
<rect class="f" x="275" y="215" width="230" height="50" rx="8"/><text x="290" y="237">copia</text><text class="s" x="290" y="255">tal cual</text>
<path class="l" d="M505 45L560 120" marker-end="url(#a)"/><path class="l" d="M505 110L560 135" marker-end="url(#a)"/><path class="l" d="M505 175L560 150" marker-end="url(#a)"/><path class="l" d="M505 240L560 165" marker-end="url(#a)"/>
<rect class="g" x="565" y="70" width="180" height="140" rx="8"/><text x="580" y="95">app-debug.apk</text><text class="s" x="580" y="120">classes*.dex</text><text class="s" x="580" y="140">resources.arsc</text><text class="s" x="580" y="160">AndroidManifest.xml</text><text class="s" x="580" y="180">assets/</text><text class="s" x="580" y="200">META-INF/</text>
<rect class="o" x="15" y="280" width="730" height="40" rx="10"/><text x="30" y="305">AGP conecta los pasos (tareas). El SDK pone android.jar y d8; aapt2 llega de google().</text></svg>
