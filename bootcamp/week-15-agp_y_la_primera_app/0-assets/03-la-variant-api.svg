<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">La Variant API</title><desc id="d">Una sola tarea generateBuildInfo. En onVariants, addGeneratedSourceDirectory la conecta a los assets de cada variante. AGP le da outputDir, build/generated/assets/generateBuildInfo, y hace que mergeDebugAssets y mergeReleaseAssets dependan de ella. build-info.properties acaba en app-debug.apk y en app-release-unsigned.apk. Tú no escribes rutas ni dependsOn.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="15" y="95" width="190" height="70" rx="8"/><text x="30" y="120">generateBuildInfo</text><text class="s" x="30" y="140">una tarea, sin outputDir</text><text class="s" x="30" y="156">version, domain</text>
<path class="l" d="M205 130H250" marker-end="url(#a)"/>
<rect class="f" x="255" y="85" width="230" height="90" rx="8"/><text x="270" y="110">onVariants { variant -&gt;</text><text class="s" x="270" y="132">sources.assets?</text><text class="s" x="270" y="150">.addGeneratedSourceDirectory(</text><text class="s" x="270" y="166">tarea, GenerateBuildInfo::outputDir)</text>
<path class="l" d="M485 110L540 60" marker-end="url(#a)"/><path class="l" d="M485 150L540 200" marker-end="url(#a)"/>
<rect class="g" x="545" y="25" width="200" height="70" rx="8"/><text x="560" y="49">mergeDebugAssets</text><text class="s" x="560" y="69">app-debug.apk</text><text class="s" x="560" y="86">assets/build-info.properties</text>
<rect class="g" x="545" y="165" width="200" height="70" rx="8"/><text x="560" y="189">mergeReleaseAssets</text><text class="s" x="560" y="209">app-release-unsigned.apk</text><text class="s" x="560" y="226">assets/build-info.properties</text>
<rect class="o" x="15" y="250" width="730" height="40" rx="10"/><text x="30" y="275">AGP pone outputDir (build/generated/assets/generateBuildInfo) y las dependencias entre tareas.</text></svg>
