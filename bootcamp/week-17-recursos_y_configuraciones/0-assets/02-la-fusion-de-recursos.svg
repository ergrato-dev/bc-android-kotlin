<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">La fusión de recursos</title><desc id="d">Tres fuentes de recursos entran en mergeDebugResources: src/debug/res con prioridad alta, src/main/res con prioridad media y las bibliotecas, como androidx.core, con prioridad baja. El resultado pasa por localeFilters, que solo deja los idiomas de la lista, y llega a aapt2, que escribe resources.arsc en el APK. La prioridad se aplica por configuración: el values de debug sustituye al values de main, pero no a su values-es.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="b" x="15" y="20" width="220" height="50" rx="8"/><text x="30" y="42">src/debug/res</text><text class="s" x="30" y="60">prioridad alta: Field log (debug)</text>
<rect class="b" x="15" y="85" width="220" height="50" rx="8"/><text x="30" y="107">src/main/res</text><text class="s" x="30" y="125">media: values, -es, -b+es+419</text>
<rect class="b" x="15" y="150" width="220" height="50" rx="8"/><text x="30" y="172">bibliotecas</text><text class="s" x="30" y="190">baja: androidx.core, 87 configs.</text>
<rect class="f" x="290" y="85" width="170" height="50" rx="8"/><text x="303" y="107">mergeDebug-</text><text x="303" y="125">Resources</text>
<rect class="f" x="500" y="20" width="245" height="50" rx="8"/><text x="515" y="42">localeFilters</text><text class="s" x="515" y="60">en, es, b+es+419: el resto fuera</text>
<rect class="g" x="500" y="150" width="245" height="50" rx="8"/><text x="515" y="172">aapt2: resources.arsc</text><text class="s" x="515" y="190">default, es, es-r419</text>
<path class="l" d="M235 45H260V105H285" marker-end="url(#a)"/><path class="l" d="M235 110H285" marker-end="url(#a)"/><path class="l" d="M235 175H260V115H285" marker-end="url(#a)"/>
<path class="l" d="M460 100H480V45H495" marker-end="url(#a)"/><path class="l" d="M622 70V148" marker-end="url(#a)"/>
<rect class="o" x="15" y="225" width="730" height="60" rx="10"/><text x="30" y="248">La prioridad va configuración por configuración: values de debug sustituye a values de main,</text><text x="30" y="270">pero values-es de main sigue ahí. En español, la app de debug se llama Bitácora.</text></svg>
