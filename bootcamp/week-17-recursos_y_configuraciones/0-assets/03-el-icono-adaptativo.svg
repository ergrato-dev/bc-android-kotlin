<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">El icono adaptativo</title><desc id="d">Tres capas de 108 por 108 dp: background, un color verde; foreground, una hoja sobre un cuaderno con fondo transparente; monochrome, la misma silueta en un solo color. Dentro de cada capa, la máscara deja ver los 72 dp centrales y la zona segura es el círculo central de 66 dp. A la derecha, el mismo icono recortado en círculo, en cuadrado redondeado y, con iconos temáticos de Android 13, pintado con los colores del fondo de pantalla.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.s{font-size:12px;fill:#9aa4af}.o{fill:none;stroke:#9aa4af;stroke-width:1.5;stroke-dasharray:5 4}.k{fill:none;stroke:#d29922;stroke-width:1.5}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/>
<defs><g id="fg"><rect x="38" y="32" width="32" height="44" fill="#ffffff"/><path d="M54 40c8 4 10 14 0 26c-10-12-8-22 0-26z" fill="#2E7D32"/></g><g id="mono"><rect x="38" y="32" width="32" height="44" fill="#c9d1d9"/><path d="M54 40c8 4 10 14 0 26c-10-12-8-22 0-26z" fill="#0d1117"/></g></defs>
<text x="15" y="30">background</text><text x="155" y="30">foreground</text><text x="295" y="30">monochrome</text>
<g transform="translate(15 45)"><rect width="108" height="108" fill="#2E7D32"/><rect class="o" x="18" y="18" width="72" height="72"/><circle class="k" cx="54" cy="54" r="33"/></g>
<g transform="translate(155 45)"><rect width="108" height="108" fill="#161b22" stroke="#30363d"/><use href="#fg"/><rect class="o" x="18" y="18" width="72" height="72"/><circle class="k" cx="54" cy="54" r="33"/></g>
<g transform="translate(295 45)"><rect width="108" height="108" fill="#161b22" stroke="#30363d"/><use href="#mono"/><rect class="o" x="18" y="18" width="72" height="72"/><circle class="k" cx="54" cy="54" r="33"/></g>
<text class="s" x="15" y="185">108 × 108 dp cada capa · gris: los 72 dp que se ven · naranja: zona segura de 66 dp</text>
<text x="460" y="30">lo que ve el usuario</text>
<g transform="translate(445 45)"><circle cx="54" cy="54" r="36" fill="#2E7D32"/><use href="#fg"/></g>
<g transform="translate(540 45)"><rect x="18" y="18" width="72" height="72" rx="18" fill="#2E7D32"/><use href="#fg"/></g>
<g transform="translate(635 45)"><circle cx="54" cy="54" r="36" fill="#d7e3f4"/><rect x="38" y="32" width="32" height="44" fill="#26466d"/><path d="M54 40c8 4 10 14 0 26c-10-12-8-22 0-26z" fill="#d7e3f4"/></g>
<text class="s" x="478" y="158">círculo</text><text class="s" x="572" y="158">cuadrado</text><text class="s" x="648" y="158">temático (13+)</text>
<rect x="15" y="200" width="730" height="80" rx="10" fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="6 5"/><text x="30" y="225">res/mipmap-anydpi/ic_launcher.xml → en el APK, res/mipmap-anydpi-v21/ic_launcher.xml</text><text x="30" y="248">Sin monochrome: aviso de lint MonochromeLauncherIcon y el icono no se adapta al tema.</text><text x="30" y="270">Sin android:icon en el manifiesto: icono genérico y aviso MissingApplicationIcon.</text></svg>
