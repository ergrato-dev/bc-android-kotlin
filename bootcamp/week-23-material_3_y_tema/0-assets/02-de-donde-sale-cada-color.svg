<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 360" role="img" aria-labelledby="t d"><title id="t">De dónde sale cada color</title><desc id="d">Tres sitios deciden los colores de la Bitácora. Antes de que Compose pinte, la ventana usa el tema del manifiesto, Theme.Bitacora, con una versión en values y otra en values-night, sin barra de acción. Después, BitacoraTheme elige el esquema: con color dinámico y desde la API 31, el del fondo de pantalla; si no, el oscuro o el claro de la marca según isSystemInDarkTheme. Un Surface pinta el fondo surface y da onSurface a los textos. Los colores de los niveles no son del esquema: salen de colors.xml con colorResource, de día o de noche.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="f" x="30" y="30" width="220" height="110" rx="8"/><text x="46" y="56">1. La ventana</text><text class="s" x="46" y="80">android:theme en el manifiesto</text><text class="s" x="46" y="100">values/ y values-night/themes.xml</text><text class="s" x="46" y="120">sin barra de acción</text>
<rect class="b" x="290" y="30" width="440" height="190" rx="8"/><text x="306" y="56">2. BitacoraTheme: el esquema</text>
<rect class="o" x="306" y="72" width="190" height="56" rx="6"/><text class="s" x="318" y="96">dynamicColor y</text><text class="s" x="318" y="114">SDK_INT &gt;= 31 (S)</text>
<path class="l" d="M496 100H540" marker-end="url(#a)"/><text x="548" y="105">dynamic*ColorScheme</text>
<rect class="o" x="306" y="146" width="190" height="56" rx="6"/><text class="s" x="318" y="170">si no:</text><text class="s" x="318" y="188">isSystemInDarkTheme()</text>
<path class="l" d="M496 174H540" marker-end="url(#a)"/><text x="548" y="168">DarkColors</text><text x="548" y="190">LightColors</text>
<path class="l" d="M400 128V146" marker-end="url(#a)"/>
<rect class="g" x="290" y="240" width="440" height="56" rx="8"/><text x="306" y="264">3. Surface: pinta surface, deja onSurface a los Text</text><text class="s" x="306" y="284">sin él, LocalContentColor es negro también de noche</text>
<path class="l" d="M510 220V240" marker-end="url(#a)"/>
<rect class="r" x="30" y="170" width="220" height="126" rx="8"/><text x="46" y="196">Los niveles</text><text class="s" x="46" y="220">colorResource(R.color.level_high)</text><text class="s" x="46" y="240">values/colors.xml: #F4C7C3</text><text class="s" x="46" y="260">values-night/colors.xml: #8C1D18</text><text class="s" x="46" y="280">no siguen el fondo de pantalla</text>
<text class="s" x="30" y="335">Lo primero que ve el usuario es la ventana (1); luego Compose pinta con el esquema (2) dentro de un Surface (3).</text></svg>
