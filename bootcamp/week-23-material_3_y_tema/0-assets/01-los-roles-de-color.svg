<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">Los roles de color</title><desc id="d">Un esquema de color de Material 3 son roles por parejas. Un botón pinta su fondo con primary y su texto con onPrimary. Un fondo de marca suave usa primaryContainer con onPrimaryContainer. La pantalla usa surface con onSurface para el texto y onSurfaceVariant para el texto secundario. Lo que va encima de un rol X se pinta con onX. Si solo se define primary, los demás roles se quedan con el morado de ejemplo.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<text x="40" y="40">Lo que va encima de X se pinta con onX</text>
<rect x="40" y="64" width="200" height="56" rx="28" fill="#3B6939"/><text x="88" y="97" style="fill:#FFFFFF">primary / onPrimary</text><text class="s" x="40" y="140">Button: fondo y texto</text>
<rect x="280" y="64" width="200" height="56" rx="12" fill="#BCF0B4"/><text x="294" y="97" style="fill:#235024">primaryContainer / on...</text><text class="s" x="280" y="140">fondo de marca, más suave</text>
<rect x="520" y="64" width="200" height="56" rx="4" fill="#F7FBF1" stroke="#72796F" stroke-width="2"/><text x="532" y="90" style="fill:#181D17">surface / onSurface</text><text x="532" y="108" style="fill:#424940;font-size:12px">onSurfaceVariant</text><text class="s" x="520" y="140">la pantalla y su texto</text>
<text x="40" y="190">lightColorScheme(primary = verde): solo un rol</text>
<rect x="40" y="210" width="200" height="56" rx="28" fill="#2E7D32"/><text x="96" y="243" style="fill:#FFFFFF">primary: verde</text>
<rect x="280" y="210" width="200" height="56" rx="12" fill="#EADDFF"/><text x="294" y="243" style="fill:#21005D">primaryContainer: #EADDFF</text>
<rect x="520" y="210" width="200" height="56" rx="4" fill="#625B71"/><text x="550" y="243" style="fill:#FFFFFF">secondary: #625B71</text>
<text class="s" x="40" y="300">Lo que no se da se queda con el morado de ejemplo. Un esquema se genera entero (Material Theme Builder), claro y oscuro.</text></svg>
