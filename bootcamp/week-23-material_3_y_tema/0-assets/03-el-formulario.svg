<svg xmlns="http://www.w3.org/2000/svg" fill="#e6edf3" font-family="sans-serif" viewBox="0 0 760 340" role="img" aria-labelledby="t d"><title id="t">El formulario</title><desc id="d">Un OutlinedTextField con la etiqueta Descripción, el texto escrito y, debajo, el texto de apoyo con la cuenta 81 / 80. Con más de 80 caracteres, isError lo pinta con el color de error y la semántica dice Entrada no válida. El teclado tiene mayúscula al empezar la frase y el botón Hecho, que llama a onDone, que solo guarda si se puede. Debajo, los niveles, que se pueden pulsar solo con una descripción válida. La regla de los 80 caracteres está en core y la comprueban la pantalla y el ViewModel.</desc><style>text{font:14px sans-serif;fill:#e6edf3}.b{fill:#16243d;stroke:#58a6ff;stroke-width:2}.g{fill:#0f2d1a;stroke:#3fb950;stroke-width:2}.f{fill:#2b2110;stroke:#d29922;stroke-width:2}.r{fill:#2d1215;stroke:#f85149;stroke-width:2}.o{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:6 5}.s{font-size:12px;fill:#9aa4af}.l{stroke:#9aa4af;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#0d1117" rx="10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4af"/></marker></defs>
<rect class="r" x="40" y="50" width="400" height="60" rx="4"/><rect x="56" y="40" width="96" height="20" fill="#0d1117"/><text x="62" y="55" style="fill:#f85149">Descripción</text><text x="56" y="88">riego roto en el sector norte y tubería...</text>
<text x="56" y="132" style="fill:#f85149;font-size:12px">81 / 80</text><text class="s" x="120" y="132">supportingText, solo cuando sobra</text>
<path class="l" d="M450 80H500" marker-end="url(#a)"/><text x="508" y="70">isError = true</text><text class="s" x="508" y="90">borde, etiqueta y apoyo en error</text><text class="s" x="508" y="108">semántica: Error =</text><text class="s" x="508" y="126">'Entrada no válida'</text>
<rect class="o" x="40" y="160" width="440" height="44" rx="6"/><text class="s" x="56" y="187">teclado: Sentences, ImeAction.Done. onDone { if (canSave) onSave() }</text>
<rect x="40" y="226" width="120" height="40" rx="20" fill="#30363d"/><text x="80" y="251" style="fill:#9aa4af">Baja</text><rect x="180" y="226" width="120" height="40" rx="20" fill="#30363d"/><text x="216" y="251" style="fill:#9aa4af">Media</text><rect x="320" y="226" width="120" height="40" rx="20" fill="#30363d"/><text x="362" y="251" style="fill:#9aa4af">Alta</text>
<text class="s" x="40" y="290">enabled = draft.isNotBlank() &amp;&amp; !tooLong: apagados, [Disabled] en la semántica</text>
<rect class="g" x="500" y="160" width="230" height="106" rx="8"/><text x="516" y="186">MAX_DESCRIPTION = 80</text><text class="s" x="516" y="208">en core: es del dominio</text><text class="s" x="516" y="228">pantalla: avisa antes</text><text class="s" x="516" y="248">ViewModel: add() da null</text>
<text class="s" x="40" y="320">isError no impide escribir ni llama a nada: quien decide si se guarda es el código, en la pantalla y en el ViewModel.</text></svg>
